<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 500" width="1560" height="500">

  <defs>
    <style>
      text {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        fill: #000000;
      }
      .title-text {
        font-size: 15px;
        font-weight: bold;
        fill: #000000;
      }
      .subtitle-text {
        font-size: 11px;
        font-style: italic;
        fill: #000000;
      }
      .section-heading {
        font-size: 12px;
        font-weight: bold;
        fill: #000000;
      }
      .code-font {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        font-size: 11px;
        fill: #000000;
      }
      .body-text {
        font-size: 11px;
        fill: #000000;
      }
      .arrow-label {
        font-size: 11px;
        font-weight: bold;
        fill: #000000;
      }
      .arrow-sub {
        font-size: 10px;
        font-style: italic;
        fill: #000000;
      }
      .flow-step-title {
        font-size: 12px;
        font-weight: bold;
        fill: #000000;
      }
      .flow-step-sub {
        font-size: 11px;
        font-style: italic;
        fill: #000000;
      }
    </style>
    <marker id="arr-black" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Section 1 Label -->
  <text x="20" y="32" class="title-text">1. Task Execution Pipeline (Async Jobs):</text>

  <!-- Box 1: Client (Curl / Script) (Blue) -->
  <g transform="translate(20, 50)">
    <rect width="250" height="195" rx="8" fill="#f0f7ff" stroke="#2563eb" stroke-width="2" />
    <rect width="250" height="36" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
    <rect y="26" width="250" height="10" fill="#dbeafe" />
    <text x="125" y="22" text-anchor="middle" class="section-heading">Client (Curl / Script)</text>

    <text x="10" y="55" class="body-text">• Submits batch task trigger:</text>
    <text x="18" y="73" class="code-font" font-weight="bold">POST /trigger</text>
    <text x="18" y="91" class="code-font">Payload: {"count": 5}</text>
    <text x="10" y="115" class="body-text">• Receives non-blocking reply:</text>
    <text x="18" y="133" class="code-font" font-weight="bold">202 Accepted</text>
    <text x="18" y="151" class="code-font">{"task_ids": [...]}</text>
    <text x="10" y="178" class="subtitle-text">Asynchronous execution</text>
  </g>

  <!-- Box 2: Flask API (Green) -->
  <g transform="translate(410, 50)">
    <rect width="260" height="195" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="2" />
    <rect width="260" height="36" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.5" />
    <rect y="26" width="260" height="10" fill="#dcfce7" />
    <text x="130" y="22" text-anchor="middle" class="section-heading">Flask API (Port 5000)</text>

    <text x="10" y="55" class="body-text">• Application: app.py</text>
    <text x="10" y="75" class="body-text">• Endpoint: POST /trigger</text>
    <text x="10" y="95" class="body-text">• Dispatches Celery tasks:</text>
    <text x="18" y="115" class="code-font">process_data_task.delay(i)</text>
    <text x="10" y="138" class="body-text">• Collects 5 UUID tokens</text>
    <text x="10" y="158" class="body-text">• Non-blocking caller return</text>
    <text x="10" y="178" class="subtitle-text">Producer Interface</text>
  </g>

  <!-- Box 3: Redis 7 (Red / Rose) -->
  <g transform="translate(810, 50)">
    <rect width="260" height="195" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="2" />
    <rect width="260" height="36" rx="8" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5" />
    <rect y="26" width="260" height="10" fill="#ffe4e6" />
    <text x="130" y="22" text-anchor="middle" class="section-heading">Redis 7 (Port 6379)</text>

    <text x="10" y="55" class="body-text">• Container: lab17-redis</text>
    <text x="10" y="75" class="body-text">DB 0: Message Broker Queue</text>
    <text x="18" y="93" class="code-font">redis://localhost:6379/0</text>
    <text x="10" y="115" class="body-text">DB 1: Result Backend Store</text>
    <text x="18" y="133" class="code-font">redis://localhost:6379/1</text>
    <text x="10" y="155" class="body-text">• Emits Celery event stream</text>
    <text x="10" y="178" class="subtitle-text">Central In-Memory Bus</text>
  </g>

  <!-- Box 4: Celery Worker (Purple) -->
  <g transform="translate(1210, 50)">
    <rect width="250" height="195" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" />
    <rect width="250" height="36" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" />
    <rect y="26" width="250" height="10" fill="#ede9fe" />
    <text x="125" y="22" text-anchor="middle" class="section-heading">Celery Worker Daemon</text>

    <text x="10" y="55" class="body-text">• Module: tasks.py</text>
    <text x="10" y="75" class="body-text">• Task: process_data_task</text>
    <text x="10" y="95" class="body-text">• Simulates delay: 2–5s sleep</text>
    <text x="10" y="117" class="body-text">• Error rate: 20% simulated</text>
    <text x="18" y="135" class="code-font">raise ValueError(error)</text>
    <text x="10" y="157" class="body-text">• Produces SUCCESS / FAILURE</text>
    <text x="10" y="178" class="subtitle-text">Background Execution</text>
  </g>

  <!-- Connectors Row 1 -->
  <line x1="270" y1="140" x2="408" y2="140" stroke="#000000" stroke-width="2" marker-end="url(#arr-black)" />
  <rect x="305" y="118" width="70" height="22" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
  <text x="340" y="133" text-anchor="middle" class="arrow-label">POST</text>

  <line x1="670" y1="140" x2="808" y2="140" stroke="#000000" stroke-width="2" marker-end="url(#arr-black)" />
  <rect x="705" y="118" width="70" height="22" rx="3" fill="#ffffff" stroke="#059669" stroke-width="1" />
  <text x="740" y="133" text-anchor="middle" class="arrow-label">Enqueue</text>

  <line x1="1070" y1="140" x2="1208" y2="140" stroke="#000000" stroke-width="2" marker-end="url(#arr-black)" />
  <rect x="1105" y="118" width="70" height="22" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1" />
  <text x="1140" y="133" text-anchor="middle" class="arrow-label">Execute</text>

  <!-- Section 2 Label -->
  <text x="20" y="278" class="title-text">2. Secure Observability &amp; Dashboard Pipeline:</text>

  <!-- Box 5: Operator / Browser (Blue) -->
  <g transform="translate(20, 295)">
    <rect width="250" height="190" rx="8" fill="#f0f7ff" stroke="#2563eb" stroke-width="2" />
    <rect width="250" height="36" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
    <rect y="26" width="250" height="10" fill="#dbeafe" />
    <text x="125" y="22" text-anchor="middle" class="section-heading">Operator / Browser</text>

    <text x="10" y="55" class="body-text">• Accesses Flower dashboard:</text>
    <text x="18" y="73" class="code-font" font-weight="bold">GET http://localhost:8080</text>
    <text x="10" y="97" class="body-text">• Enters Basic Auth credentials:</text>
    <text x="18" y="115" class="body-text">User: admin</text>
    <text x="18" y="131" class="body-text">Password: admin123</text>
    <text x="10" y="153" class="body-text">• Displays live task metrics</text>
    <text x="10" y="174" class="subtitle-text">Authenticated Client</text>
  </g>

  <!-- Box 6: Nginx Proxy (Teal) -->
  <g transform="translate(410, 295)">
    <rect width="260" height="190" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" />
    <rect width="260" height="36" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5" />
    <rect y="26" width="260" height="10" fill="#ccfbf1" />
    <text x="130" y="22" text-anchor="middle" class="section-heading">Nginx Proxy (Port 8080)</text>

    <text x="10" y="55" class="body-text">• Reverse Proxy on port 8080</text>
    <text x="10" y="75" class="body-text">Authentication: auth_basic</text>
    <text x="18" y="93" class="code-font">/etc/nginx/.htpasswd</text>
    <text x="10" y="115" class="body-text">• Blocks unauthorized access</text>
    <text x="10" y="135" class="body-text">• Proxies authenticated requests:</text>
    <text x="18" y="153" class="code-font">proxy_pass http://127.0.0.1:5555</text>
    <text x="10" y="174" class="subtitle-text">Security Gatekeeper</text>
  </g>

  <!-- Box 7: Flower Dashboard (Orange) -->
  <g transform="translate(810, 295)">
    <rect width="260" height="190" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2" />
    <rect width="260" height="36" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" />
    <rect y="26" width="260" height="10" fill="#ffedd5" />
    <text x="130" y="22" text-anchor="middle" class="section-heading">Flower Dashboard (:5555)</text>

    <text x="10" y="55" class="body-text">• Internal Web Daemon</text>
    <text x="10" y="75" class="body-text">• Bound to: 127.0.0.1:5555</text>
    <text x="10" y="95" class="body-text">• Renders real-time cluster state:</text>
    <text x="18" y="113" class="body-text">- Worker online / offline</text>
    <text x="18" y="129" class="body-text">- Succeeded vs Failed counts</text>
    <text x="18" y="145" class="body-text">- Task latency &amp; runtime</text>
    <text x="10" y="174" class="subtitle-text">Monitoring Interface</text>
  </g>

  <!-- Box 8: Event Bus / Telemetry (Purple) -->
  <g transform="translate(1210, 295)">
    <rect width="250" height="190" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" />
    <rect width="250" height="36" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" />
    <rect y="26" width="250" height="10" fill="#ede9fe" />
    <text x="125" y="22" text-anchor="middle" class="section-heading">Event Bus / Telemetry</text>

    <text x="10" y="55" class="body-text">• Flower subscribes to broker</text>
    <text x="10" y="75" class="body-text">• Ingests Celery event stream:</text>
    <text x="18" y="93" class="body-text">- task-received</text>
    <text x="18" y="109" class="body-text">- task-started</text>
    <text x="18" y="125" class="body-text">- task-succeeded / failed</text>
    <text x="10" y="147" class="body-text">• Zero performance overhead</text>
    <text x="10" y="174" class="subtitle-text">Real-Time Ingestion</text>
  </g>

  <!-- Connectors Row 2 -->
  <line x1="270" y1="385" x2="408" y2="385" stroke="#000000" stroke-width="2" marker-end="url(#arr-black)" />
  <rect x="295" y="363" width="90" height="22" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
  <text x="340" y="378" text-anchor="middle" class="arrow-label">Basic Auth</text>

  <line x1="670" y1="385" x2="808" y2="385" stroke="#000000" stroke-width="2" marker-end="url(#arr-black)" />
  <rect x="705" y="363" width="70" height="22" rx="3" fill="#ffffff" stroke="#0d9488" stroke-width="1" />
  <text x="740" y="378" text-anchor="middle" class="arrow-label">Proxy</text>

  <line x1="1070" y1="385" x2="1208" y2="385" stroke="#000000" stroke-width="2" marker-end="url(#arr-black)" />
  <rect x="1100" y="363" width="80" height="22" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1" />
  <text x="1140" y="378" text-anchor="middle" class="arrow-label">Subscribe</text>

  <!-- Cross-tier vertical connection: Redis -> Flower -->
  <line x1="940" y1="245" x2="940" y2="293" stroke="#000000" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arr-black)" />
  <rect x="875" y="259" width="130" height="20" rx="3" fill="#ffffff" stroke="#ea580c" stroke-width="1" />
  <text x="940" y="273" text-anchor="middle" class="arrow-sub">Celery Event Stream</text>

</svg>