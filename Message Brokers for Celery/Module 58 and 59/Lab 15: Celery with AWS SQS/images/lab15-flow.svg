<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 500; fill: #64748b; }
      .actor-title { font-size: 14px; font-weight: 700; fill: #ffffff; }
      .actor-sub { font-size: 11px; font-weight: 500; fill: #e2e8f0; }
      .step-num { font-size: 11px; font-weight: 700; fill: #ffffff; }
      .step-title { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .step-desc { font-size: 11.5px; font-weight: 400; fill: #334155; }
      .code-inline { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #0369a1; background: #e0f2fe; }
      .lifeline { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 4; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="680" fill="#f8fafc" rx="12" />
  <rect x="1" y="1" width="998" height="678" fill="none" stroke="#e2e8f0" stroke-width="2" rx="11" />

  <!-- Header -->
  <rect x="25" y="20" width="950" height="54" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)" />
  <text x="45" y="44" class="font-sans title">Lab 15: Celery + Redis Asynchronous Task Lifecycle Flow</text>
  <text x="45" y="62" class="font-sans subtitle">Detailed step-by-step sequence of task submission, queuing, worker execution, and result retrieval</text>

  <!-- 4 Actor Columns -->
  <!-- Actor 1: Python Client -->
  <g transform="translate(40, 95)">
    <rect width="180" height="50" rx="8" fill="#2563eb" filter="url(#shadow)" />
    <text x="90" y="24" text-anchor="middle" class="font-sans actor-title">Python Client</text>
    <text x="90" y="40" text-anchor="middle" class="font-sans actor-sub">Interactive REPL</text>
    <line x1="90" y1="50" x2="90" y2="540" class="lifeline" />
  </g>

  <!-- Actor 2: Redis Broker (DB 0) -->
  <g transform="translate(280, 95)">
    <rect width="190" height="50" rx="8" fill="#dc2626" filter="url(#shadow)" />
    <text x="95" y="24" text-anchor="middle" class="font-sans actor-title">Redis Broker (DB 0)</text>
    <text x="95" y="40" text-anchor="middle" class="font-sans actor-sub">redis://localhost:6379/0</text>
    <line x1="95" y1="50" x2="95" y2="540" class="lifeline" />
  </g>

  <!-- Actor 3: Celery Worker -->
  <g transform="translate(530, 95)">
    <rect width="190" height="50" rx="8" fill="#7c3aed" filter="url(#shadow)" />
    <text x="95" y="24" text-anchor="middle" class="font-sans actor-title">Celery Worker</text>
    <text x="95" y="40" text-anchor="middle" class="font-sans actor-sub">celery -A tasks.app worker</text>
    <line x1="95" y1="50" x2="95" y2="540" class="lifeline" />
  </g>

  <!-- Actor 4: Redis Backend (DB 1) -->
  <g transform="translate(770, 95)">
    <rect width="190" height="50" rx="8" fill="#059669" filter="url(#shadow)" />
    <text x="95" y="24" text-anchor="middle" class="font-sans actor-title">Redis Backend (DB 1)</text>
    <text x="95" y="40" text-anchor="middle" class="font-sans actor-sub">redis://localhost:6379/1</text>
    <line x1="95" y1="50" x2="95" y2="540" class="lifeline" />
  </g>

  <!-- STEP 1: delay() invocation -->
  <g transform="translate(0, 165)">
    <line x1="130" y1="20" x2="370" y2="20" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" />
    <!-- Step Badge -->
    <rect x="180" y="2" width="140" height="34" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="196" cy="19" r="10" fill="#2563eb" />
    <text x="196" y="23" text-anchor="middle" class="font-sans step-num">1</text>
    <text x="214" y="16" class="font-sans step-title" fill="#1e40af">process_task.delay()</text>
    <text x="214" y="29" class="font-sans step-desc">Enqueue task payload</text>
  </g>

  <!-- STEP 2: AsyncResult return -->
  <g transform="translate(0, 225)">
    <line x1="375" y1="20" x2="135" y2="20" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow)" />
    <rect x="180" y="2" width="140" height="34" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="196" cy="19" r="10" fill="#2563eb" />
    <text x="196" y="23" text-anchor="middle" class="font-sans step-num">2</text>
    <text x="214" y="16" class="font-sans step-title" fill="#1e40af">AsyncResult(UUID)</text>
    <text x="214" y="29" class="font-sans step-desc">Non-blocking return</text>
  </g>

  <!-- STEP 3: Worker BRPOP -->
  <g transform="translate(0, 285)">
    <line x1="375" y1="20" x2="620" y2="20" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)" />
    <rect x="440" y="2" width="140" height="34" rx="6" fill="#ffffff" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="456" cy="19" r="10" fill="#7c3aed" />
    <text x="456" y="23" text-anchor="middle" class="font-sans step-num">3</text>
    <text x="474" y="16" class="font-sans step-title" fill="#581c87">Pop Task Message</text>
    <text x="474" y="29" class="font-sans step-desc">Worker consumes via BRPOP</text>
  </g>

  <!-- STEP 4: Execution -->
  <g transform="translate(0, 345)">
    <!-- Self loop on worker -->
    <path d="M 625 15 C 675 15, 675 45, 625 45" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)" />
    <rect x="680" y="10" width="165" height="42" rx="6" fill="#ffffff" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="696" cy="31" r="10" fill="#7c3aed" />
    <text x="696" y="35" text-anchor="middle" class="font-sans step-num">4</text>
    <text x="714" y="25" class="font-sans step-title" fill="#581c87">Execute Function</text>
    <text x="714" y="40" class="font-sans step-desc">time.sleep(5) workload</text>
  </g>

  <!-- STEP 5: Store Result -->
  <g transform="translate(0, 415)">
    <line x1="625" y1="20" x2="860" y2="20" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)" />
    <rect x="680" y="2" width="155" height="34" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="696" cy="19" r="10" fill="#059669" />
    <text x="696" y="23" text-anchor="middle" class="font-sans step-num">5</text>
    <text x="714" y="16" class="font-sans step-title" fill="#065f46">Save Status &amp; Value</text>
    <text x="714" y="29" class="font-sans step-desc">SUCCESS + Return payload</text>
  </g>

  <!-- STEP 6: Query Result -->
  <g transform="translate(0, 480)">
    <line x1="130" y1="20" x2="860" y2="20" stroke="#059669" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-green)" />
    <rect x="420" y="2" width="190" height="34" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="436" cy="19" r="10" fill="#059669" />
    <text x="436" y="23" text-anchor="middle" class="font-sans step-num">6</text>
    <text x="454" y="16" class="font-sans step-title" fill="#065f46">result.get() / status</text>
    <text x="454" y="29" class="font-sans step-desc">Client fetches task output from DB 1</text>
  </g>

  <!-- Bottom Summary Note -->
  <g transform="translate(40, 565)">
    <rect width="920" height="90" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect width="6" height="90" rx="3" fill="#2563eb" />
    <text x="24" y="28" class="font-sans step-title">Key Decoupling Mechanisms in this Lifecycle:</text>
    <text x="24" y="50" class="font-sans step-desc">• <tspan font-weight="600">Client Isolation:</tspan> The client thread is never blocked during task computation; <tspan font-family="monospace">delay()</tspan> returns immediately with a task UUID.</text>
    <text x="24" y="70" class="font-sans step-desc">• <tspan font-weight="600">Database Separation:</tspan> Task queue messages reside in Redis Database 0, while completed status keys reside in Database 1, preventing lock contention.</text>
  </g>
</svg>