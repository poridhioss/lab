<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680" width="980" height="680">

  <defs>
    <style>
      text {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        fill: #000000;
      }
      .title-text {
        font-size: 20px;
        font-weight: bold;
        fill: #000000;
      }
      .subtitle-text {
        font-size: 15px;
        font-style: italic;
        fill: #000000;
      }
      .section-heading {
        font-size: 17px;
        font-weight: bold;
        fill: #000000;
      }
      .code-font {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        font-size: 15.5px;
        fill: #000000;
      }
      .body-text {
        font-size: 15.5px;
        fill: #000000;
      }
      .arrow-label {
        font-size: 16px;
        font-weight: bold;
        fill: #000000;
      }
      .arrow-sub {
        font-size: 14.5px;
        font-style: italic;
        fill: #000000;
      }
      .flow-step-title {
        font-size: 16.5px;
        font-weight: bold;
        fill: #000000;
      }
      .flow-step-sub {
        font-size: 14.5px;
        font-style: italic;
        fill: #000000;
      }
    </style>
    <marker id="arr-black" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

<rect width="100%" height="100%" fill="#ffffff" />

  <!-- Lifeline Header: Python Client -->
  <rect x="50" y="20" width="220" height="60" rx="8" fill="#f0f7ff" stroke="#2563eb" stroke-width="1.8" />
  
  <rect x="62" y="31" width="38" height="38" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" />
  <g transform="translate(67, 36) scale(1.16)">
    <path d="M14.25.18l.9.2.73.26.59.3.45.32.34.34.25.34.16.33.1.3.04.26.02.2-.01.13V8.5l-.05.63-.13.55-.21.46-.26.38-.3.31-.33.25-.35.19-.35.14-.33.1-.3.07-.26.04-.21.02H8.77l-.69.05-.59.14-.5.22-.41.27-.33.32-.27.35-.2.36-.15.37-.1.35-.07.32-.04.27-.02.21v3.06H3.17l-.21-.03-.28-.07-.32-.12-.35-.18-.36-.26-.36-.36-.35-.46-.32-.59-.28-.73-.21-.88-.14-1.05-.05-1.23.06-1.22.16-1.04.24-.87.32-.71.36-.57.4-.44.42-.33.42-.24.4-.16.36-.1.32-.05.24-.01h.16l.06.01h8.16v-.83H6.18l-.01-2.75-.02-.37.05-.34.11-.31.17-.28.25-.26.31-.23.38-.2.44-.18.51-.15.58-.12.64-.1.71-.06.77-.04.84-.02 1.27.05zm-6.3 1.98l-.23.33-.08.41.08.41.23.34.33.22.41.09.41-.09.33-.22.23-.34.08-.41-.08-.41-.23-.33-.33-.22-.41-.09-.41.09zm13.09 3.95l.28.06.32.12.35.18.36.27.36.35.35.47.32.59.28.73.21.88.14 1.04.05 1.23-.06 1.23-.16 1.04-.24.86-.32.71-.36.57-.4.45-.42.33-.42.24-.4.16-.36.09-.32.05-.24.02-.16-.01h-8.22v.82h5.84l.01 2.76.02.36-.05.34-.11.31-.17.29-.25.25-.31.24-.38.2-.44.17-.51.15-.58.13-.64.09-.71.07-.77.04-.84.01-1.27-.04-1.07-.14-.9-.2-.73-.25-.59-.3-.45-.33-.34-.34-.25-.34-.16-.33-.1-.3-.04-.25-.02-.2.01-.13v-5.34l.05-.64.13-.54.21-.46.26-.38.3-.32.33-.24.35-.2.35-.14.33-.1.3-.06.26-.04.21-.02.13-.01h5.84l.69-.05.59-.14.5-.21.41-.28.33-.32.27-.35.2-.36.15-.36.1-.35.07-.32.04-.28.02-.21V6.07h2.09l.14.01zm-6.47 14.25l-.23.33-.08.41.08.41.23.33.33.23.41.08.41-.08.33-.23.23-.33.08-.41-.08-.41-.23-.33-.33-.23-.41-.08-.41.08z" fill="#3776ab" />
  </g>
  <text x="108" y="44" text-anchor="start" class="section-heading">Python Client</text>
  <text x="108" y="64" text-anchor="start" class="subtitle-text">REPL (tasks.py)</text>
  <line x1="160" y1="80" x2="160" y2="660" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Lifeline Header: Redis 7 Container -->
  <rect x="380" y="20" width="220" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" />
  
  <rect x="392" y="31" width="38" height="38" rx="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" />
  <g transform="translate(397, 36) scale(1.16)">
    <path d="M22.71 13.145c-1.66 2.092-3.452 4.483-7.038 4.483-3.203 0-4.397-2.825-4.48-5.12.701 1.484 2.073 2.685 4.214 2.63 4.117-.133 6.94-3.852 6.94-7.239 0-4.05-3.022-6.972-8.268-6.972-3.752 0-8.4 1.428-11.455 3.685C2.59 6.937 3.885 9.958 4.35 9.626c2.648-1.904 4.748-3.13 6.784-3.744C8.12 9.244.886 17.05 0 18.425c.1 1.261 1.66 4.648 2.424 4.648.232 0 .431-.133.664-.365a100.49 100.49 0 0 0 5.54-6.765c.222 3.104 1.748 6.898 6.014 6.898 3.819 0 7.604-2.756 9.33-8.965.2-.764-.73-1.361-1.261-.73zm-4.349-5.013c0 1.959-1.926 2.922-3.685 2.922-.941 0-1.664-.247-2.235-.568 1.051-1.592 2.092-3.225 3.21-4.973 1.972.334 2.71 1.43 2.71 2.619z" fill="#dc2626" />
  </g>
  <text x="438" y="44" text-anchor="start" class="section-heading">Redis 7 Container</text>
  <text x="438" y="64" text-anchor="start" class="subtitle-text">Broker (DB0) &amp; Store (DB1)</text>
  <line x1="490" y1="80" x2="490" y2="660" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Lifeline Header: Celery Worker -->
  <rect x="710" y="20" width="220" height="60" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8" />
  
  <rect x="722" y="31" width="38" height="38" rx="7" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" />
  <g transform="translate(727, 36) scale(1.16)">
    <path d="M2.303 0A2.298 2.298 0 0 0 0 2.303v19.394A2.298 2.298 0 0 0 2.303 24h19.394A2.298 2.298 0 0 0 24 21.697V2.303A2.298 2.298 0 0 0 21.697 0zm8.177 3.072c4.098 0 7.028 1.438 7.68 1.764l-1.194 2.55c-2.442-1.057-4.993-1.41-5.672-1.41-1.574 0-2.17.922-2.17 1.763v8.494c0 .869.596 1.791 2.17 1.791.679 0 3.23-.38 5.672-1.41l1.194 2.496c-.435.271-3.637 1.818-7.68 1.818-1.112 0-4.64-.244-4.64-4.64V7.713c0-4.397 3.528-4.64 4.64-4.64z" fill="#7c3aed" />
  </g>
  <text x="768" y="44" text-anchor="start" class="section-heading">Celery Worker</text>
  <text x="768" y="64" text-anchor="start" class="subtitle-text">tasks.process_task</text>
  <line x1="820" y1="80" x2="820" y2="660" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Message Step -->
  <line x1="160" y1="145" x2="488" y2="145" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="325" y="117" text-anchor="middle" class="flow-step-title">1. process_task.delay("Bayajid")</text>

  <text x="325" y="133" text-anchor="middle" class="flow-step-sub">(Client sends task message to Redis DB 0 list)</text>

  <!-- Message Step -->
  <line x1="490" y1="233" x2="818" y2="233" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="655" y="205" text-anchor="middle" class="flow-step-title">2. BRPOP celery (Worker Dequeues)</text>

  <text x="655" y="221" text-anchor="middle" class="flow-step-sub">(Worker daemon fetches task payload)</text>

  <!-- Self Loop -->
  <path d="M 820 309 C 860 309, 860 333, 825 333" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arr-black)" />
  <text x="870" y="319" text-anchor="start" class="flow-step-title">3. Execute 5s Workload</text>

  <text x="870" y="337" text-anchor="start" class="flow-step-sub">time.sleep(5) simulation</text>

  <!-- Message Step -->
  <line x1="820" y1="409" x2="492" y2="409" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="655" y="381" text-anchor="middle" class="flow-step-title">4. Write SUCCESS to Redis DB 1</text>

  <text x="655" y="397" text-anchor="middle" class="flow-step-sub">(Stores outcome in celery-task-meta-{id})</text>

  <!-- Message Step -->
  <line x1="160" y1="497" x2="488" y2="497" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="325" y="469" text-anchor="middle" class="flow-step-title">5. res.status -&gt; SUCCESS</text>

  <text x="325" y="485" text-anchor="middle" class="flow-step-sub">(Client inspects task execution state)</text>

  <!-- Message Step -->
  <line x1="160" y1="585" x2="488" y2="585" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="325" y="557" text-anchor="middle" class="flow-step-title">6. res.get() -&gt; "Hello Bayajid..."</text>

  <text x="325" y="573" text-anchor="middle" class="flow-step-sub">(Client retrieves output payload from DB 1)</text>
</svg>