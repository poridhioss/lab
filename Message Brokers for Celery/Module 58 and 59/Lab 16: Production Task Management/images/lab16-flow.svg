<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 650" width="1180" height="650">

  <defs>
    <style>
      text {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        fill: #000000;
      }
      .title-text {
        font-size: 17px;
        font-weight: bold;
        fill: #000000;
      }
      .subtitle-text {
        font-size: 13px;
        font-style: italic;
        fill: #000000;
      }
      .section-heading {
        font-size: 14.5px;
        font-weight: bold;
        fill: #000000;
      }
      .code-font {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        font-size: 13px;
        fill: #000000;
      }
      .body-text {
        font-size: 13px;
        fill: #000000;
      }
      .arrow-label {
        font-size: 13px;
        font-weight: bold;
        fill: #000000;
      }
      .arrow-sub {
        font-size: 12px;
        font-style: italic;
        fill: #000000;
      }
      .flow-step-title {
        font-size: 13.5px;
        font-weight: bold;
        fill: #000000;
      }
      .flow-step-sub {
        font-size: 12px;
        font-style: italic;
        fill: #000000;
      }
    </style>
    <marker id="arr-black" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

<rect width="100%" height="100%" fill="#ffffff" />

  <!-- Lifeline Header: Client (Curl) -->
  <rect x="30" y="20" width="200" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
  <text x="130" y="42" text-anchor="middle" class="section-heading">Client (Curl)</text>
  <text x="130" y="59" text-anchor="middle" class="subtitle-text">HTTP Caller</text>
  <line x1="130" y1="70" x2="130" y2="630" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Lifeline Header: Flask API (:5000) -->
  <rect x="290" y="20" width="200" height="50" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.8" />
  <text x="390" y="42" text-anchor="middle" class="section-heading">Flask API (:5000)</text>
  <text x="390" y="59" text-anchor="middle" class="subtitle-text">Producer Service</text>
  <line x1="390" y1="70" x2="390" y2="630" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Lifeline Header: Redis (DB 0 & DB 1) -->
  <rect x="550" y="20" width="200" height="50" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.8" />
  <text x="650" y="42" text-anchor="middle" class="section-heading">Redis (DB 0 &amp; DB 1)</text>
  <text x="650" y="59" text-anchor="middle" class="subtitle-text">Broker &amp; Result Store</text>
  <line x1="650" y1="70" x2="650" y2="630" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Lifeline Header: Celery Pool (x4) -->
  <rect x="800" y="20" width="200" height="50" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8" />
  <text x="900" y="42" text-anchor="middle" class="section-heading">Celery Pool (x4)</text>
  <text x="900" y="59" text-anchor="middle" class="subtitle-text">Concurrent Workers</text>
  <line x1="900" y1="70" x2="900" y2="630" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Message Step -->
  <line x1="130" y1="130" x2="388" y2="130" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="260" y="102" text-anchor="middle" class="flow-step-title">1. POST /tasks {"duration": 10}</text>

  <text x="260" y="118" text-anchor="middle" class="flow-step-sub">(Client submits long-running task request)</text>

  <!-- Message Step -->
  <line x1="390" y1="210" x2="648" y2="210" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="520" y="182" text-anchor="middle" class="flow-step-title">2. long_running_task.delay(10)</text>

  <text x="520" y="198" text-anchor="middle" class="flow-step-sub">(Flask dispatches job to Redis DB 0)</text>

  <!-- Message Step -->
  <line x1="390" y1="290" x2="132" y2="290" stroke="#000000" stroke-width="1.8" stroke-dasharray="5,5" marker-end="url(#arr-black)" />
  <text x="260" y="262" text-anchor="middle" class="flow-step-title">3. 202 Accepted {"task_id":"uuid"}</text>

  <text x="260" y="278" text-anchor="middle" class="flow-step-sub">(Instant return with status: PENDING)</text>

  <!-- Message Step -->
  <line x1="650" y1="370" x2="898" y2="370" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="775" y="342" text-anchor="middle" class="flow-step-title">4. Worker Slot Dequeue (1 of 4)</text>

  <text x="775" y="358" text-anchor="middle" class="flow-step-sub">(Allocated to available process in concurrency pool)</text>

  <!-- Self Loop -->
  <path d="M 900 438 C 935 438, 935 462, 905 462" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arr-black)" />
  <text x="945" y="448" text-anchor="start" class="flow-step-title">5. On Exception: Retry Backoff</text>

  <text x="945" y="464" text-anchor="start" class="flow-step-sub">retry_backoff=True (max 3 retries)</text>

  <!-- Message Step -->
  <line x1="900" y1="530" x2="652" y2="530" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="775" y="502" text-anchor="middle" class="flow-step-title">6. Save Result (SUCCESS)</text>

  <text x="775" y="518" text-anchor="middle" class="flow-step-sub">(Stores duration &amp; completion payload in DB 1)</text>

  <!-- Message Step -->
  <line x1="130" y1="610" x2="388" y2="610" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="260" y="582" text-anchor="middle" class="flow-step-title">7. GET /tasks/{id} -&gt; SUCCESS</text>

  <text x="260" y="598" text-anchor="middle" class="flow-step-sub">(Client retrieves: "Long-running task completed successfully")</text>
</svg>