<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 480" width="1560" height="480">

  <defs>
    <style>
      text {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        fill: #000000;
      }
      .title-text {
        font-size: 17px;
        font-weight: bold;
        fill: #000000;
      }
      .subtitle-text {
        font-size: 13px;
        font-style: italic;
        fill: #000000;
      }
      .section-heading {
        font-size: 14.5px;
        font-weight: bold;
        fill: #000000;
      }
      .code-font {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        font-size: 13px;
        fill: #000000;
      }
      .body-text {
        font-size: 13px;
        fill: #000000;
      }
      .arrow-label {
        font-size: 13px;
        font-weight: bold;
        fill: #000000;
      }
      .arrow-sub {
        font-size: 12px;
        font-style: italic;
        fill: #000000;
      }
      .flow-step-title {
        font-size: 13.5px;
        font-weight: bold;
        fill: #000000;
      }
      .flow-step-sub {
        font-size: 12px;
        font-style: italic;
        fill: #000000;
      }
    </style>
    <marker id="arr-black" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Box 1: HTTP Client (Blue) -->
  <g transform="translate(20, 20)">
    <rect width="260" height="440" rx="8" fill="#f0f7ff" stroke="#2563eb" stroke-width="2" />
    <rect width="260" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
    <rect y="36" width="260" height="10" fill="#dbeafe" />
    <text x="130" y="26" text-anchor="middle" class="title-text">HTTP Client (Curl)</text>
    <text x="130" y="42" text-anchor="middle" class="subtitle-text">Postman / Terminal Caller</text>

    <g transform="translate(15, 65)">
      <rect width="230" height="150" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2" />
      <rect width="230" height="28" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
      <text x="12" y="19" class="section-heading">1. Task Submission</text>
      <text x="12" y="52" class="code-font" font-weight="bold">POST /send-email</text>
      <text x="12" y="76" class="code-font">{"to": "user@example.com"}</text>
      <text x="12" y="106" class="body-text">&#x2190; 202 Accepted (Instant)</text>
      <text x="12" y="130" class="code-font">{"task_id": "uuid"}</text>
    </g>

    <g transform="translate(15, 235)">
      <rect width="230" height="175" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2" />
      <rect width="230" height="28" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
      <text x="12" y="19" class="section-heading">2. Status Polling</text>
      <text x="12" y="52" class="code-font" font-weight="bold">GET /task-status/{id}</text>
      <text x="12" y="80" class="body-text">• Initial: {"status": "PENDING"}</text>
      <text x="12" y="108" class="body-text">• After 10s: {"status": "SUCCESS"}</text>
      <text x="12" y="136" class="code-font">"Email sent to user..."</text>
      <text x="12" y="160" class="subtitle-text">Non-blocking client execution</text>
    </g>
  </g>

  <!-- Box 2: Flask Web App (Green) -->
  <g transform="translate(420, 20)">
    <rect width="270" height="440" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="2" />
    <rect width="270" height="46" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.5" />
    <rect y="36" width="270" height="10" fill="#dcfce7" />
    <text x="135" y="26" text-anchor="middle" class="title-text">Flask Web App (:5000)</text>
    <text x="135" y="42" text-anchor="middle" class="subtitle-text">Producer REST API (app.py)</text>

    <g transform="translate(15, 65)">
      <rect width="240" height="150" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.2" />
      <rect width="240" height="28" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" />
      <text x="12" y="19" class="section-heading">Task Dispatch Route</text>
      <text x="12" y="52" class="body-text">• Validates JSON request body</text>
      <text x="12" y="78" class="code-font">task = send_email_task.delay(to)</text>
      <text x="12" y="106" class="body-text">• Enqueues task into broker</text>
      <text x="12" y="130" class="body-text">• Returns HTTP 202 + task ID</text>
    </g>

    <g transform="translate(15, 235)">
      <rect width="240" height="175" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.2" />
      <rect width="240" height="28" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" />
      <text x="12" y="19" class="section-heading">Status Query &amp; Config</text>
      <text x="12" y="52" class="code-font">task = AsyncResult(task_id)</text>
      <text x="12" y="78" class="body-text">• Returns status and result payload</text>
      <text x="12" y="108" class="code-font">broker: redis://localhost:6379/0</text>
      <text x="12" y="132" class="code-font">backend: redis://localhost:6379/0</text>
      <text x="12" y="160" class="subtitle-text">Integrated Celery &amp; Flask application</text>
    </g>
  </g>

  <!-- Box 3: Redis Server (Red) -->
  <g transform="translate(830, 20)">
    <rect width="270" height="440" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="2" />
    <rect width="270" height="46" rx="8" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5" />
    <rect y="36" width="270" height="10" fill="#ffe4e6" />
    <text x="135" y="26" text-anchor="middle" class="title-text">Redis Server (:6379)</text>
    <text x="135" y="42" text-anchor="middle" class="subtitle-text">In-Memory Message Bus &amp; Store</text>

    <g transform="translate(15, 65)">
      <rect width="240" height="150" rx="6" fill="#ffffff" stroke="#fda4af" stroke-width="1.2" />
      <rect width="240" height="28" rx="6" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2" />
      <text x="12" y="19" class="section-heading">Message Broker (DB 0)</text>
      <text x="12" y="52" class="code-font">• Key: "celery" (Task List)</text>
      <text x="12" y="78" class="body-text">• Ingests JSON task messages</text>
      <text x="12" y="106" class="body-text">• Atomic BRPOP delivery</text>
      <text x="12" y="130" class="body-text">• High throughput in-memory bus</text>
    </g>

    <g transform="translate(15, 235)">
      <rect width="240" height="175" rx="6" fill="#ffffff" stroke="#fda4af" stroke-width="1.2" />
      <rect width="240" height="28" rx="6" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2" />
      <text x="12" y="19" class="section-heading">Result Backend (DB 0)</text>
      <text x="12" y="52" class="code-font">• Key: celery-task-meta-{id}</text>
      <text x="12" y="80" class="body-text">• Stores task state: PENDING / SUCCESS</text>
      <text x="12" y="108" class="body-text">• Stores return string &amp; metadata</text>
      <text x="12" y="136" class="body-text">• Serves polling queries from API</text>
      <text x="12" y="160" class="subtitle-text">Persistent state until TTL expiry</text>
    </g>
  </g>

  <!-- Box 4: Celery Worker (Purple) -->
  <g transform="translate(1240, 20)">
    <rect width="270" height="440" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" />
    <rect width="270" height="46" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" />
    <rect y="36" width="270" height="10" fill="#ede9fe" />
    <text x="135" y="26" text-anchor="middle" class="title-text">Celery Worker</text>
    <text x="135" y="42" text-anchor="middle" class="subtitle-text">Asynchronous Background Consumer</text>

    <g transform="translate(15, 65)">
      <rect width="240" height="150" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2" />
      <rect width="240" height="28" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2" />
      <text x="12" y="19" class="section-heading">Task Definition</text>
      <text x="12" y="52" class="code-font">@celery.task(name=...)</text>
      <text x="12" y="76" class="code-font">def send_email_task(to):</text>
      <text x="20" y="104" class="code-font">time.sleep(10) # 10s sleep</text>
      <text x="20" y="128" class="code-font">return f"Email sent to {to}"</text>
    </g>

    <g transform="translate(15, 235)">
      <rect width="240" height="175" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2" />
      <rect width="240" height="28" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2" />
      <text x="12" y="19" class="section-heading">Worker Execution</text>
      <text x="12" y="52" class="code-font">celery -A app.celery worker</text>
      <text x="12" y="80" class="body-text">• Dequeues pending jobs via BRPOP</text>
      <text x="12" y="108" class="body-text">• Executes simulated email workload</text>
      <text x="12" y="136" class="body-text">• Writes SUCCESS result to backend</text>
      <text x="12" y="160" class="subtitle-text">Acks message and awaits next task</text>
    </g>
  </g>

  <!-- Connectors (Badges sit ABOVE the lines) -->
  <!-- 1. POST -->
  <rect x="300" y="112" width="100" height="26" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" />
  <text x="350" y="130" text-anchor="middle" class="arrow-label">1. POST</text>
  <line x1="280" y1="150" x2="418" y2="150" stroke="#000000" stroke-width="2" marker-end="url(#arr-black)" />

  <!-- 2. delay() -->
  <rect x="710" y="112" width="100" height="26" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.2" />
  <text x="760" y="130" text-anchor="middle" class="arrow-label">2. delay()</text>
  <line x1="690" y1="150" x2="828" y2="150" stroke="#000000" stroke-width="2" marker-end="url(#arr-black)" />

  <!-- 3. Pop -->
  <rect x="1120" y="112" width="100" height="26" rx="4" fill="#ffffff" stroke="#e11d48" stroke-width="1.2" />
  <text x="1170" y="130" text-anchor="middle" class="arrow-label">3. Pop Task</text>
  <line x1="1100" y1="150" x2="1238" y2="150" stroke="#000000" stroke-width="2" marker-end="url(#arr-black)" />

  <!-- 5. Poll -->
  <rect x="300" y="202" width="100" height="26" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" />
  <text x="350" y="220" text-anchor="middle" class="arrow-label">5. Poll Status</text>
  <line x1="280" y1="240" x2="418" y2="240" stroke="#000000" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arr-black)" />

  <!-- 6. Query -->
  <rect x="710" y="202" width="100" height="26" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.2" />
  <text x="760" y="220" text-anchor="middle" class="arrow-label">6. Query State</text>
  <line x1="690" y1="240" x2="828" y2="240" stroke="#000000" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arr-black)" />

  <!-- 4. Save -->
  <rect x="1120" y="292" width="100" height="26" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" />
  <text x="1170" y="310" text-anchor="middle" class="arrow-label">4. Save Result</text>
  <line x1="1240" y1="330" x2="1102" y2="330" stroke="#000000" stroke-width="2" marker-end="url(#arr-black)" />

</svg>