<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="1080" height="720">

  <defs>
    <style>
      text {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        fill: #000000;
      }
      .title-text {
        font-size: 17px;
        font-weight: bold;
        fill: #000000;
      }
      .subtitle-text {
        font-size: 13px;
        font-style: italic;
        fill: #000000;
      }
      .section-heading {
        font-size: 14.5px;
        font-weight: bold;
        fill: #000000;
      }
      .code-font {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        font-size: 13px;
        fill: #000000;
      }
      .body-text {
        font-size: 13px;
        fill: #000000;
      }
      .arrow-label {
        font-size: 13px;
        font-weight: bold;
        fill: #000000;
      }
      .arrow-sub {
        font-size: 12px;
        font-style: italic;
        fill: #000000;
      }
      .flow-step-title {
        font-size: 13.5px;
        font-weight: bold;
        fill: #000000;
      }
      .flow-step-sub {
        font-size: 12px;
        font-style: italic;
        fill: #000000;
      }
    </style>
    <marker id="arr-black" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

<rect width="100%" height="100%" fill="#ffffff" />

  <!-- Lifeline Header: Client / Admin -->
  <rect x="30" y="20" width="200" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
  <text x="130" y="42" text-anchor="middle" class="section-heading">Client / Admin</text>
  <text x="130" y="59" text-anchor="middle" class="subtitle-text">Browser / Curl</text>
  <line x1="130" y1="70" x2="130" y2="700" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Lifeline Header: Nginx Proxy (Port 80) -->
  <rect x="300" y="20" width="200" height="50" rx="6" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8" />
  <text x="400" y="42" text-anchor="middle" class="section-heading">Nginx Proxy (Port 80)</text>
  <text x="400" y="59" text-anchor="middle" class="subtitle-text">auth_basic Module</text>
  <line x1="400" y1="70" x2="400" y2="700" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Lifeline Header: Flower (Port 5555) -->
  <rect x="570" y="20" width="200" height="50" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" />
  <text x="670" y="42" text-anchor="middle" class="section-heading">Flower (Port 5555)</text>
  <text x="670" y="59" text-anchor="middle" class="subtitle-text">127.0.0.1:5555 (Internal)</text>
  <line x1="670" y1="70" x2="670" y2="700" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Lifeline Header: RabbitMQ (Broker) -->
  <rect x="840" y="20" width="200" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.8" />
  <text x="940" y="42" text-anchor="middle" class="section-heading">RabbitMQ (Broker)</text>
  <text x="940" y="59" text-anchor="middle" class="subtitle-text">Port 5672 (AMQP)</text>
  <line x1="940" y1="70" x2="940" y2="700" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Message Step -->
  <line x1="130" y1="130" x2="398" y2="130" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="265" y="102" text-anchor="middle" class="flow-step-title">1. GET / (No Credentials)</text>

  <text x="265" y="118" text-anchor="middle" class="flow-step-sub">(curl -I http://localhost)</text>

  <!-- Message Step -->
  <line x1="400" y1="210" x2="132" y2="210" stroke="#000000" stroke-width="1.8" stroke-dasharray="5,5" marker-end="url(#arr-black)" />
  <text x="265" y="182" text-anchor="middle" class="flow-step-title">2. HTTP/1.1 401 Unauthorized</text>

  <text x="265" y="198" text-anchor="middle" class="flow-step-sub">(WWW-Authenticate: Basic realm="Flower Auth")</text>

  <!-- Message Step -->
  <line x1="130" y1="290" x2="398" y2="290" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="265" y="262" text-anchor="middle" class="flow-step-title">3. GET / (With Basic Auth)</text>

  <text x="265" y="278" text-anchor="middle" class="flow-step-sub">(curl -u floweradmin http://localhost)</text>

  <!-- Self Loop -->
  <path d="M 400 358 C 435 358, 435 382, 405 382" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arr-black)" />
  <text x="445" y="368" text-anchor="start" class="flow-step-title">4. Verify Hash against .flower_htpasswd</text>

  <text x="445" y="384" text-anchor="start" class="flow-step-sub">Matches encrypted password</text>

  <!-- Message Step -->
  <line x1="400" y1="450" x2="668" y2="450" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="535" y="422" text-anchor="middle" class="flow-step-title">5. proxy_pass http://localhost:5555</text>

  <text x="535" y="438" text-anchor="middle" class="flow-step-sub">(Nginx forwards authenticated request to Flower)</text>

  <!-- Message Step -->
  <line x1="670" y1="530" x2="938" y2="530" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="805" y="502" text-anchor="middle" class="flow-step-title">6. AMQP: Query Broker &amp; Queue Depth</text>

  <text x="805" y="518" text-anchor="middle" class="flow-step-sub">(Flower queries rabbitmq-server status)</text>

  <!-- Message Step -->
  <line x1="940" y1="610" x2="672" y2="610" stroke="#000000" stroke-width="1.8" stroke-dasharray="5,5" marker-end="url(#arr-black)" />
  <text x="805" y="582" text-anchor="middle" class="flow-step-title">7. Return Active Queues &amp; Stats</text>

  <text x="805" y="598" text-anchor="middle" class="flow-step-sub">(RabbitMQ delivers broker telemetry to Flower)</text>

  <!-- Message Step -->
  <line x1="670" y1="690" x2="132" y2="690" stroke="#000000" stroke-width="1.8" stroke-dasharray="5,5" marker-end="url(#arr-black)" />
  <text x="400" y="662" text-anchor="middle" class="flow-step-title">8. HTTP/1.1 200 OK (Dashboard HTML)</text>

  <text x="400" y="678" text-anchor="middle" class="flow-step-sub">(Browser displays real-time Flower dashboard)</text>
</svg>