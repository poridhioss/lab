<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 580" width="100%" height="100%">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 500; fill: #64748b; }
      .box-title { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .box-desc { font-size: 12px; font-weight: 400; fill: #475569; }
      .badge-text { font-size: 11px; font-weight: 600; }
      .code-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #0f172a; }
    </style>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <rect width="1150" height="580" fill="#f8fafc" rx="12" />
  <rect x="1" y="1" width="1148" height="578" fill="none" stroke="#e2e8f0" stroke-width="2" rx="11" />

  <!-- Header -->
  <rect x="30" y="24" width="1090" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)" />
  <circle cx="58" cy="54" r="16" fill="#fef3c7" />
  <path d="M51 54 L56 59 L66 49" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="86" y="48" class="font-sans title">Lab 23: Remote RabbitMQ &amp; Flower Deployment Architecture</text>
  <text x="86" y="68" class="font-sans subtitle">Containerized Task Processing via Docker Compose &amp; Secure Ingress via Cloudflare Quick Tunnel</text>

  <!-- Left: Public Internet & Cloudflare -->
  <g transform="translate(40, 115)">
    <rect width="240" height="400" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect width="240" height="46" rx="10" fill="#fffbeb" />
    <rect y="36" width="240" height="10" fill="#fffbeb" />
    <text x="120" y="28" text-anchor="middle" class="font-sans box-title" fill="#92400e">Public Client / Browser</text>
    <text x="16" y="75" class="font-sans box-desc">• Remote Operator Web Browser</text>

    <!-- Cloudflare Tunnel Box -->
    <rect x="14" y="95" width="212" height="140" rx="8" fill="#fff7ed" stroke="#fdba74" />
    <text x="24" y="120" class="font-sans badge-text" fill="#c2410c">CLOUDFLARE QUICK TUNNEL</text>
    <text x="24" y="142" class="code-text" fill="#ea580c">cloudflared tunnel</text>
    <text x="24" y="160" class="code-text" fill="#64748b">--url http://localhost:5555</text>
    <text x="24" y="185" class="font-sans box-desc">• Generates HTTPS URL:</text>
    <text x="24" y="205" class="code-text" fill="#0369a1">*.trycloudflare.com</text>
    <text x="24" y="223" class="font-sans box-desc">• Zero inbound ports needed</text>

    <rect x="14" y="250" width="212" height="130" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="24" y="275" class="font-sans badge-text" fill="#334155">EXTERNAL VERIFICATION</text>
    <text x="24" y="297" class="font-sans box-desc">• Real-time dashboard view</text>
    <text x="24" y="317" class="font-sans box-desc">• Worker health check</text>
    <text x="24" y="337" class="font-sans box-desc">• Task execution history</text>
    <text x="24" y="357" class="font-sans box-desc">• Graph &amp; latency metrics</text>
  </g>

  <!-- Right: Remote Host Docker Compose Stack -->
  <g transform="translate(320, 115)">
    <!-- Docker Compose Group Outline -->
    <rect width="780" height="400" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)" />
    <rect width="780" height="40" rx="10" fill="#eff6ff" />
    <rect y="30" width="780" height="10" fill="#eff6ff" />
    <text x="20" y="26" class="font-sans box-title" fill="#1e40af">Remote Server — Docker Compose Multi-Container Stack (docker-compose.yml)</text>

    <!-- Sub-container 1: RabbitMQ -->
    <g transform="translate(20, 55)">
      <rect width="230" height="325" rx="8" fill="#f8fafc" stroke="#f87171" stroke-width="1.5" />
      <rect width="230" height="32" rx="8" fill="#fef2f2" />
      <text x="115" y="21" text-anchor="middle" class="font-sans box-title" fill="#991b1b">RabbitMQ Broker</text>
      <text x="16" y="55" class="font-sans box-desc">• Image: <tspan font-family="monospace">rabbitmq:3-management</tspan></text>
      <text x="16" y="75" class="font-sans box-desc">• Container: <tspan font-family="monospace">lab23-rabbitmq</tspan></text>
      <text x="16" y="95" class="code-text" fill="#991b1b">Port 5672 (AMQP)</text>
      <text x="16" y="115" class="code-text" fill="#64748b">Port 15672 (Admin UI)</text>

      <rect x="14" y="130" width="202" height="75" rx="6" fill="#fff1f2" stroke="#fecaca" />
      <text x="24" y="152" class="font-sans badge-text" fill="#991b1b">CREDENTIALS</text>
      <text x="24" y="172" class="code-text" fill="#0f172a">USER: celery</text>
      <text x="24" y="190" class="code-text" fill="#0f172a">PASS: celery123</text>

      <rect x="14" y="215" width="202" height="90" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
      <text x="24" y="238" class="font-sans badge-text" fill="#475569">PERSISTENT VOLUME</text>
      <text x="24" y="258" class="font-sans box-desc">• Volume: <tspan font-family="monospace">rabbitmq_data</tspan></text>
      <text x="24" y="278" class="font-sans box-desc">• Mount: /var/lib/rabbitmq</text>
      <text x="24" y="296" class="font-sans box-desc">• Preserves queues on reboot</text>
    </g>

    <!-- Sub-container 2: Celery Worker -->
    <g transform="translate(275, 55)">
      <rect width="230" height="325" rx="8" fill="#f8fafc" stroke="#c084fc" stroke-width="1.5" />
      <rect width="230" height="32" rx="8" fill="#faf5ff" />
      <text x="115" y="21" text-anchor="middle" class="font-sans box-title" fill="#581c87">Celery Worker</text>
      <text x="16" y="55" class="font-sans box-desc">• Image: <tspan font-family="monospace">python:3.11-slim</tspan></text>
      <text x="16" y="75" class="font-sans box-desc">• Container: <tspan font-family="monospace">lab23-worker</tspan></text>
      <text x="16" y="95" class="code-text" fill="#581c87">amqp://celery:...@rabbitmq</text>

      <rect x="14" y="115" width="202" height="105" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="24" y="137" class="font-sans badge-text" fill="#7c3aed">TASK DEFINITION</text>
      <text x="24" y="157" class="code-text" fill="#7c3aed">@app.task</text>
      <text x="24" y="175" class="code-text" fill="#0f172a">def add(x, y):</text>
      <text x="36" y="193" class="code-text" fill="#d97706">time.sleep(2)</text>
      <text x="36" y="211" class="code-text" fill="#059669">return x + y</text>

      <rect x="14" y="230" width="202" height="75" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
      <text x="24" y="252" class="font-sans badge-text" fill="#475569">RPC BACKEND</text>
      <text x="24" y="272" class="font-sans box-desc">• backend="rpc://"</text>
      <text x="24" y="290" class="font-sans box-desc">• Transmits result over AMQP</text>
    </g>

    <!-- Sub-container 3: Flower -->
    <g transform="translate(530, 55)">
      <rect width="230" height="325" rx="8" fill="#f8fafc" stroke="#fcd34d" stroke-width="1.5" />
      <rect width="230" height="32" rx="8" fill="#fef3c7" />
      <text x="115" y="21" text-anchor="middle" class="font-sans box-title" fill="#92400e">Flower Dashboard</text>
      <text x="16" y="55" class="font-sans box-desc">• Image: <tspan font-family="monospace">mher/flower:2.0</tspan></text>
      <text x="16" y="75" class="font-sans box-desc">• Container: <tspan font-family="monospace">lab23-flower</tspan></text>
      <text x="16" y="95" class="code-text" fill="#b45309">Port 5555:5555</text>

      <rect x="14" y="115" width="202" height="90" rx="6" fill="#fffbeb" stroke="#fde68a" />
      <text x="24" y="137" class="font-sans badge-text" fill="#92400e">BROKER CONNECTION</text>
      <text x="24" y="157" class="font-sans box-desc">• Connects to RabbitMQ</text>
      <text x="24" y="175" class="font-sans box-desc">• Subscribes to events</text>
      <text x="24" y="193" class="font-sans box-desc">• Discovers active workers</text>

      <rect x="14" y="215" width="202" height="90" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
      <text x="24" y="238" class="font-sans badge-text" fill="#475569">INGRESS TARGET</text>
      <text x="24" y="258" class="font-sans box-desc">• Proxied via Cloudflare</text>
      <text x="24" y="278" class="font-sans box-desc">• Exposed to remote browser</text>
      <text x="24" y="296" class="font-sans box-desc">• Real-time visual feedback</text>
    </g>

    <!-- Internal Connectors -->
    <line x1="250" y1="180" x2="275" y2="180" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-blue)" />
    <line x1="250" y1="210" x2="530" y2="210" stroke="#d97706" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-amber)" />
  </g>

  <!-- Cloudflare to Flower Link -->
  <line x1="280" y1="230" x2="850" y2="230" stroke="#d97706" stroke-width="2.5" marker-end="url(#arr-amber)" />
  <rect x="520" y="218" width="130" height="22" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1" />
  <text x="585" y="233" text-anchor="middle" class="font-sans code-text" fill="#b45309">HTTPS Tunnel</text>

  <!-- Footer -->
  <rect x="40" y="530" width="1060" height="26" rx="4" fill="#f1f5f9" />
  <text x="50" y="547" class="font-sans box-desc">Port 5672: RabbitMQ AMQP | Port 15672: Management | Port 5555: Flower | Cloudflare Quick Tunnel Ingress</text>
  <text x="1080" y="547" text-anchor="end" class="font-sans badge-text" fill="#64748b">Poridhi Labs • Lab 23</text>
</svg>