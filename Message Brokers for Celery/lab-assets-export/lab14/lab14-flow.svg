  <text x="889" y="44" text-anchor="start" class="section-heading">Celery Worker</text>
  <text x="889" y="62" text-anchor="start" class="subtitle-text">send_email_task</text>
  <line x1="940" y1="76" x2="940" y2="700" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Message Step -->
  <line x1="140" y1="135" x2="398" y2="135" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="270" y="107" text-anchor="middle" class="flow-step-title">1. POST /send-email {"to": "..."}</text>

  <text x="270" y="123" text-anchor="middle" class="flow-step-sub">(Client submits background email job)</text>

  <!-- Message Step -->
  <line x1="400" y1="217" x2="678" y2="217" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="540" y="189" text-anchor="middle" class="flow-step-title">2. send_email_task.delay(to)</text>

  <text x="540" y="205" text-anchor="middle" class="flow-step-sub">(Flask pushes job into Redis DB 0 list)</text>

  <!-- Message Step -->
  <line x1="400" y1="299" x2="142" y2="299" stroke="#000000" stroke-width="1.8" stroke-dasharray="5,5" marker-end="url(#arr-black)" />
  <text x="270" y="271" text-anchor="middle" class="flow-step-title">3. 202 Accepted {"task_id": "uuid"}</text>

  <text x="270" y="287" text-anchor="middle" class="flow-step-sub">(Instant non-blocking response to client)</text>

  <!-- Message Step -->
  <line x1="680" y1="381" x2="938" y2="381" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="810" y="353" text-anchor="middle" class="flow-step-title">4. Worker Dequeues &amp; Runs</text>

  <text x="810" y="369" text-anchor="middle" class="flow-step-sub">(Simulates 10s workload: time.sleep(10))</text>

  <!-- Message Step -->
  <line x1="140" y1="463" x2="398" y2="463" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="270" y="435" text-anchor="middle" class="flow-step-title">5. GET /task-status/{id} -&gt; PENDING</text>

  <text x="270" y="451" text-anchor="middle" class="flow-step-sub">(Client polls status while task is running)</text>

  <!-- Message Step -->
  <line x1="940" y1="545" x2="682" y2="545" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="810" y="517" text-anchor="middle" class="flow-step-title">6. Save Result (SUCCESS)</text>

  <text x="810" y="533" text-anchor="middle" class="flow-step-sub">(Worker writes output payload to Redis)</text>

  <!-- Message Step -->
  <line x1="140" y1="627" x2="398" y2="627" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="270" y="599" text-anchor="middle" class="flow-step-title">7. GET /task-status/{id} -&gt; SUCCESS</text>

  <text x="270" y="615" text-anchor="middle" class="flow-step-sub">(Client receives completed result: "Email sent to...")</text>
</svg>