  <!-- Lifeline Header: Celery Worker -->
  <rect x="835" y="20" width="210" height="56" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8" />
  
  <rect x="845" y="30" width="36" height="36" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" />
  <g transform="translate(851, 36) scale(1)">
