<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 650" width="1080" height="650">

  <defs>
    <style>
      text {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        fill: #000000;
      }
      .title-text {
        font-size: 15px;
        font-weight: bold;
        fill: #000000;
      }
      .subtitle-text {
        font-size: 11px;
        font-style: italic;
        fill: #000000;
      }
      .section-heading {
        font-size: 12px;
        font-weight: bold;
        fill: #000000;
      }
      .code-font {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        font-size: 11px;
        fill: #000000;
      }
      .body-text {
        font-size: 11px;
        fill: #000000;
      }
      .arrow-label {
        font-size: 11px;
        font-weight: bold;
        fill: #000000;
      }
      .arrow-sub {
        font-size: 10px;
        font-style: italic;
        fill: #000000;
      }
      .flow-step-title {
        font-size: 12px;
        font-weight: bold;
        fill: #000000;
      }
      .flow-step-sub {
        font-size: 11px;
        font-style: italic;
        fill: #000000;
      }
    </style>
    <marker id="arr-black" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

<rect width="100%" height="100%" fill="#ffffff" />

  <!-- Lifeline Header: HTTP Client (Curl) -->
  <rect x="35" y="20" width="190" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
  <text x="130" y="42" text-anchor="middle" class="section-heading">HTTP Client (Curl)</text>
  <text x="130" y="57" text-anchor="middle" class="subtitle-text">REST Requester</text>
  <line x1="130" y1="68" x2="130" y2="630" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Lifeline Header: Flask API (:5000) -->
  <rect x="305" y="20" width="190" height="48" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.8" />
  <text x="400" y="42" text-anchor="middle" class="section-heading">Flask API (:5000)</text>
  <text x="400" y="57" text-anchor="middle" class="subtitle-text">app.py</text>
  <line x1="400" y1="68" x2="400" y2="630" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Lifeline Header: Redis Server (:6379) -->
  <rect x="575" y="20" width="190" height="48" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.8" />
  <text x="670" y="42" text-anchor="middle" class="section-heading">Redis Server (:6379)</text>
  <text x="670" y="57" text-anchor="middle" class="subtitle-text">Broker &amp; Result Backend</text>
  <line x1="670" y1="68" x2="670" y2="630" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Lifeline Header: Celery Worker -->
  <rect x="845" y="20" width="190" height="48" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8" />
  <text x="940" y="42" text-anchor="middle" class="section-heading">Celery Worker</text>
  <text x="940" y="57" text-anchor="middle" class="subtitle-text">send_email_task</text>
  <line x1="940" y1="68" x2="940" y2="630" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Message Step -->
  <line x1="130" y1="125" x2="398" y2="125" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="265" y="97" text-anchor="middle" class="flow-step-title">1. POST /send-email {"to":"..."}</text>

  <text x="265" y="113" text-anchor="middle" class="flow-step-sub">(Client submits background email job)</text>

  <!-- Message Step -->
  <line x1="400" y1="205" x2="668" y2="205" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="535" y="177" text-anchor="middle" class="flow-step-title">2. send_email_task.delay(to)</text>

  <text x="535" y="193" text-anchor="middle" class="flow-step-sub">(Flask pushes job into Redis DB 0 list)</text>

  <!-- Message Step -->
  <line x1="400" y1="285" x2="132" y2="285" stroke="#000000" stroke-width="1.8" stroke-dasharray="5,5" marker-end="url(#arr-black)" />
  <text x="265" y="257" text-anchor="middle" class="flow-step-title">3. 202 Accepted {"task_id":"uuid"}</text>

  <text x="265" y="273" text-anchor="middle" class="flow-step-sub">(Instant non-blocking response to client)</text>

  <!-- Message Step -->
  <line x1="670" y1="365" x2="938" y2="365" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="805" y="337" text-anchor="middle" class="flow-step-title">4. Worker Dequeues &amp; Runs</text>

  <text x="805" y="353" text-anchor="middle" class="flow-step-sub">(Simulates 10s workload: time.sleep(10))</text>

  <!-- Message Step -->
  <line x1="130" y1="445" x2="398" y2="445" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="265" y="417" text-anchor="middle" class="flow-step-title">5. GET /task-status/{id} -&gt; PENDING</text>

  <text x="265" y="433" text-anchor="middle" class="flow-step-sub">(Client polls status while task is running)</text>

  <!-- Message Step -->
  <line x1="940" y1="525" x2="672" y2="525" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="805" y="497" text-anchor="middle" class="flow-step-title">6. Save Result (SUCCESS)</text>

  <text x="805" y="513" text-anchor="middle" class="flow-step-sub">(Worker writes output payload to Redis)</text>

  <!-- Message Step -->
  <line x1="130" y1="605" x2="398" y2="605" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="265" y="577" text-anchor="middle" class="flow-step-title">7. GET /task-status/{id} -&gt; SUCCESS</text>

  <text x="265" y="593" text-anchor="middle" class="flow-step-sub">(Client receives completed result: "Email sent to...")</text>
</svg>