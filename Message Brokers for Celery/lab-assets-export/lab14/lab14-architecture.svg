<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 520" width="1640" height="520">

  <defs>
    <style>
      text {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        fill: #000000;
      }
      .title-text {
        font-size: 20px;
        font-weight: bold;
        fill: #000000;
      }
      .subtitle-text {
        font-size: 15px;
        font-style: italic;
        fill: #000000;
      }
      .section-heading {
        font-size: 17px;
        font-weight: bold;
        fill: #000000;
      }
      .code-font {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        font-size: 15.5px;
        fill: #000000;
      }
      .body-text {
        font-size: 15.5px;
        fill: #000000;
      }
      .arrow-label {
        font-size: 16px;
        font-weight: bold;
        fill: #000000;
      }
      .arrow-sub {
        font-size: 14.5px;
        font-style: italic;
        fill: #000000;
      }
      .flow-step-title {
        font-size: 16.5px;
        font-weight: bold;
        fill: #000000;
      }
      .flow-step-sub {
        font-size: 14.5px;
        font-style: italic;
        fill: #000000;
      }
    </style>
    <marker id="arr-black" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Box 1: HTTP Client -->
  <g transform="translate(30, 20)">
    <rect width="290" height="480" rx="8" fill="#f0f7ff" stroke="#2563eb" stroke-width="2" />

    <rect width="290" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
    <rect y="48" width="290" height="10" fill="#dbeafe" />
    <rect x="14" y="10" width="38" height="38" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" />
    <g transform="translate(19, 15) scale(1.16)">
      <path d="M.803 14.8169c0-.5342.433-.9665.9665-.9665.5335 0 .9665.4323.9665.9665 0 .5335-.433.9657-.9665.9657-.5335 0-.9666-.4322-.9666-.9657m2.736 0c0-.1963-.0532-.376-.1119-.5525-.2344-.7024-.876-1.2169-1.6575-1.2169-.1249 0-.2344.0465-.3524.0708C.6149 13.2865 0 13.9646 0 14.817c0 .9764.7923 1.7694 1.7695 1.7694.9772 0 1.7694-.793 1.7694-1.7694m-1.7694-7.149c.5335 0 .9665.433.9665.9665 0 .5335-.433.9665-.9665.9665-.5343 0-.9666-.433-.9666-.9665 0-.5335.4323-.9665.9666-.9665m0 2.7359c.9772 0 1.7694-.7923 1.7694-1.7694 0-.1956-.0532-.376-.1119-.5525-.2344-.7024-.8767-1.2169-1.6575-1.2169-.1249 0-.2344.0465-.3524.0716C.6149 7.104 0 7.782 0 8.6344c0 .9771.7923 1.7694 1.7695 1.7694m13.221-5.694c-.5342 0-.9665-.433-.9665-.9664a.966.966 0 01.9666-.9665c.5335 0 .9658.4322.9658.9665 0 .5334-.4323.9664-.9658.9664m-9.6 16.5133c-.5335 0-.9666-.433-.9666-.9665 0-.5342.433-.9665.9666-.9665a.966.966 0 01.9665.9665c0 .5335-.4323.9665-.9665.9665m9.6-19.2491c-.978 0-1.7695.7922-1.7695 1.7694 0 .2085.0525.4025.1187.5882L5.039 18.5581c-.803.1681-1.4179.8462-1.4179 1.6985 0 .9772.7923 1.7694 1.7695 1.7694.9772 0 1.7694-.7922 1.7694-1.7694 0-.1963-.0525-.3759-.111-.5525l8.3427-14.2728c.7778-.1865 1.3683-.8531 1.3683-1.688 0-.977-.793-1.7693-1.7694-1.7693m7.24 2.7359c-.5343 0-.9666-.433-.9666-.9665a.966.966 0 01.9665-.9665c.5335 0 .9666.4322.9666.9665 0 .5334-.433.9665-.9666.9665M12.6313 21.223c-.5343 0-.9665-.433-.9665-.9665a.966.966 0 01.9665-.9665c.5335 0 .9658.4323.9658.9665 0 .5335-.4323.9665-.9658.9665M22.2305 1.974c-.9772 0-1.7694.7922-1.7694 1.7694 0 .2085.0525.4025.1187.5882l-8.3009 14.2265c-.8021.1681-1.417.8462-1.417 1.6985 0 .9772.7922 1.7694 1.7694 1.7694.9764 0 1.7687-.7922 1.7687-1.7694 0-.1963-.0525-.3759-.1111-.5525l8.3427-14.2728C23.4094 5.2448 24 4.5782 24 3.7433c0-.977-.7923-1.7693-1.7695-1.7693" fill="#111827" />
    </g>
    <text x="60" y="28" text-anchor="start" class="title-text">HTTP Client (Curl)</text>
    <text x="60" y="48" text-anchor="start" class="subtitle-text">Postman / Terminal Caller</text>

    <g transform="translate(15, 75)">
      <rect width="260" height="170" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2" />
      <rect width="260" height="32" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">1. Task Submission</text>
      <text x="12" y="60" class="code-font" font-weight="bold">POST /send-email</text>
      <text x="12" y="88" class="code-font">{"to": "user@example.com"}</text>
      <text x="12" y="120" class="body-text">&#x2190; 202 Accepted (Instant)</text>
      <text x="12" y="148" class="code-font">{"task_id": "uuid"}</text>
    </g>

    <g transform="translate(15, 260)">
      <rect width="260" height="200" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2" />
      <rect width="260" height="32" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">2. Status Polling</text>
      <text x="12" y="60" class="code-font" font-weight="bold">GET /task-status/{id}</text>
      <text x="12" y="92" class="body-text">• Initial: {"status": "PENDING"}</text>
      <text x="12" y="122" class="body-text">• After 10s: {"status": "SUCCESS"}</text>
      <text x="12" y="154" class="code-font">"Email sent to user..."</text>
      <text x="12" y="182" class="subtitle-text">Non-blocking client execution</text>
    </g>
  </g>

  <!-- Forward Arrow 1: Client -> Flask -->
  <rect x="345" y="110" width="85" height="30" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2" />
  <text x="387" y="130" text-anchor="middle" class="arrow-label">1. POST</text>
  <line x1="320" y1="152" x2="453" y2="152" stroke="#000000" stroke-width="1.8" marker-end="url(#arr-black)" />

  <!-- Backward Arrow 5: Flask -> Client (Poll) -->
  <rect x="330" y="240" width="115" height="30" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2" />
  <text x="387" y="260" text-anchor="middle" class="arrow-label">5. Poll Status</text>
  <line x1="455" y1="282" x2="322" y2="282" stroke="#000000" stroke-width="1.8" stroke-dasharray="5,5" marker-end="url(#arr-black)" />

  <!-- Box 2: Flask Web App -->
  <g transform="translate(455, 20)">
    <rect width="290" height="480" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="2" />

    <rect width="290" height="58" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.5" />
    <rect y="48" width="290" height="10" fill="#dcfce7" />
    <rect x="14" y="10" width="38" height="38" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.2" />
    <g transform="translate(19, 15) scale(1.16)">
      <path d="M10.773 2.878c-.013 1.434.322 4.624.445 5.734l-8.558 3.83c-.56-.959-.98-2.304-1.237-3.38l-.06.027c-.205.09-.406.053-.494-.088l-.011-.018-.82-1.506c-.058-.105-.05-.252.024-.392a.78.78 0 0 1 .358-.331l9.824-4.207c.146-.064.299-.063.4.004.106.062.127.128.13.327Zm.68 7c.523 1.97.675 2.412.832 2.818l-7.263 3.7a19.35 19.35 0 0 1-1.81-2.83l8.24-3.689Zm12.432 8.786h.003c.283.402-.047.657-.153.698l-.947.37c.037.125.035.319-.217.414l-.736.287c-.229.09-.398-.059-.42-.2l-.025-.125c-4.427 1.784-7.94 1.685-10.696.647-1.981-.745-3.576-1.983-4.846-3.379l6.948-3.54c.721 1.431 1.586 2.454 2.509 3.178 2.086 1.638 4.415 1.712 5.793 1.563l-.047-.233c-.015-.077.007-.135.086-.165l.734-.288a.302.302 0 0 1 .342.086l.748-.288a.306.306 0 0 1 .341.086l.583.89Z" fill="#000000" />
    </g>
    <text x="60" y="28" text-anchor="start" class="title-text">Flask Web App (:5000)</text>
    <text x="60" y="48" text-anchor="start" class="subtitle-text">Producer REST API (app.py)</text>

    <g transform="translate(15, 75)">
      <rect width="260" height="170" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.2" />
      <rect width="260" height="32" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">Task Dispatch Route</text>
      <text x="12" y="60" class="body-text">• Validates JSON request body</text>
      <text x="12" y="90" class="code-font">task = send_email_task.delay(to)</text>
      <text x="12" y="120" class="body-text">• Enqueues task into broker</text>
      <text x="12" y="148" class="body-text">• Returns HTTP 202 + task ID</text>
    </g>

    <g transform="translate(15, 260)">
      <rect width="260" height="200" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.2" />
      <rect width="260" height="32" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">Status Query &amp; Config</text>
      <text x="12" y="60" class="code-font">task = AsyncResult(task_id)</text>
      <text x="12" y="90" class="body-text">• Returns status &amp; result payload</text>
      <text x="12" y="122" class="code-font">broker: redis://localhost:6379/0</text>
      <text x="12" y="150" class="code-font">backend: redis://localhost:6379/0</text>
      <text x="12" y="182" class="subtitle-text">Integrated Celery &amp; Flask app</text>
    </g>
  </g>

  <!-- Forward Arrow 2: Flask -> Redis -->
  <rect x="765" y="110" width="95" height="30" rx="5" fill="#f0fdf4" stroke="#059669" stroke-width="1.2" />
  <text x="812" y="130" text-anchor="middle" class="arrow-label">2. delay()</text>
  <line x1="745" y1="152" x2="878" y2="152" stroke="#000000" stroke-width="1.8" marker-end="url(#arr-black)" />

  <!-- Backward Arrow 6: Redis -> Flask -->
  <rect x="752" y="240" width="120" height="30" rx="5" fill="#f0fdf4" stroke="#059669" stroke-width="1.2" />
  <text x="812" y="260" text-anchor="middle" class="arrow-label">6. Query State</text>
  <line x1="880" y1="282" x2="747" y2="282" stroke="#000000" stroke-width="1.8" stroke-dasharray="5,5" marker-end="url(#arr-black)" />

  <!-- Box 3: Redis Server -->
  <g transform="translate(880, 20)">
    <rect width="290" height="480" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />

    <rect width="290" height="58" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
    <rect y="48" width="290" height="10" fill="#fee2e2" />
    <rect x="14" y="10" width="38" height="38" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" />
    <g transform="translate(19, 15) scale(1.16)">
      <path d="M22.71 13.145c-1.66 2.092-3.452 4.483-7.038 4.483-3.203 0-4.397-2.825-4.48-5.12.701 1.484 2.073 2.685 4.214 2.63 4.117-.133 6.94-3.852 6.94-7.239 0-4.05-3.022-6.972-8.268-6.972-3.752 0-8.4 1.428-11.455 3.685C2.59 6.937 3.885 9.958 4.35 9.626c2.648-1.904 4.748-3.13 6.784-3.744C8.12 9.244.886 17.05 0 18.425c.1 1.261 1.66 4.648 2.424 4.648.232 0 .431-.133.664-.365a100.49 100.49 0 0 0 5.54-6.765c.222 3.104 1.748 6.898 6.014 6.898 3.819 0 7.604-2.756 9.33-8.965.2-.764-.73-1.361-1.261-.73zm-4.349-5.013c0 1.959-1.926 2.922-3.685 2.922-.941 0-1.664-.247-2.235-.568 1.051-1.592 2.092-3.225 3.21-4.973 1.972.334 2.71 1.43 2.71 2.619z" fill="#dc2626" />
    </g>
    <text x="60" y="28" text-anchor="start" class="title-text">Redis Server (:6379)</text>
    <text x="60" y="48" text-anchor="start" class="subtitle-text">In-Memory Message Bus &amp; Store</text>

    <g transform="translate(15, 75)">
      <rect width="260" height="170" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2" />
      <rect width="260" height="32" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">Message Broker (DB 0)</text>
      <text x="12" y="60" class="body-text">• Key: "celery" (Task List)</text>
      <text x="12" y="90" class="body-text">• Ingests JSON task messages</text>
      <text x="12" y="120" class="body-text">• Atomic BRPOP delivery</text>
      <text x="12" y="148" class="body-text">• High throughput in-memory bus</text>
    </g>

    <g transform="translate(15, 260)">
      <rect width="260" height="200" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2" />
      <rect width="260" height="32" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">Result Backend (DB 0)</text>
      <text x="12" y="60" class="body-text">• Key: celery-task-meta-{id}</text>
      <text x="12" y="90" class="body-text">• Stores state: PENDING / SUCCESS</text>
      <text x="12" y="120" class="body-text">• Stores return string &amp; metadata</text>
      <text x="12" y="150" class="body-text">• Serves polling queries from API</text>
      <text x="12" y="182" class="subtitle-text">Persistent state until TTL expiry</text>
    </g>
  </g>

  <!-- Forward Arrow 3: Redis -> Worker -->
  <rect x="1182" y="110" width="110" height="30" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" />
  <text x="1237" y="130" text-anchor="middle" class="arrow-label">3. Pop Task</text>
  <line x1="1170" y1="152" x2="1303" y2="152" stroke="#000000" stroke-width="1.8" marker-end="url(#arr-black)" />

  <!-- Backward Arrow 4: Worker -> Redis -->
  <rect x="1177" y="240" width="120" height="30" rx="5" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2" />
  <text x="1237" y="260" text-anchor="middle" class="arrow-label">4. Save Result</text>
  <line x1="1305" y1="282" x2="1172" y2="282" stroke="#000000" stroke-width="1.8" marker-end="url(#arr-black)" />

  <!-- Box 4: Celery Worker -->
  <g transform="translate(1305, 20)">
    <rect width="290" height="480" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" />

    <rect width="290" height="58" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5" />
    <rect y="48" width="290" height="10" fill="#f3e8ff" />
    <rect x="14" y="10" width="38" height="38" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" />
    <g transform="translate(19, 15) scale(1.16)">
      <path d="M2.303 0A2.298 2.298 0 0 0 0 2.303v19.394A2.298 2.298 0 0 0 2.303 24h19.394A2.298 2.298 0 0 0 24 21.697V2.303A2.298 2.298 0 0 0 21.697 0zm8.177 3.072c4.098 0 7.028 1.438 7.68 1.764l-1.194 2.55c-2.442-1.057-4.993-1.41-5.672-1.41-1.574 0-2.17.922-2.17 1.763v8.494c0 .869.596 1.791 2.17 1.791.679 0 3.23-.38 5.672-1.41l1.194 2.496c-.435.271-3.637 1.818-7.68 1.818-1.112 0-4.64-.244-4.64-4.64V7.713c0-4.397 3.528-4.64 4.64-4.64z" fill="#7c3aed" />
    </g>
    <text x="60" y="28" text-anchor="start" class="title-text">Celery Worker</text>
    <text x="60" y="48" text-anchor="start" class="subtitle-text">Async Background Consumer</text>

    <g transform="translate(15, 75)">
      <rect width="260" height="170" rx="6" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.2" />
      <rect width="260" height="32" rx="6" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">Task Definition</text>
      <text x="12" y="60" class="code-font">@celery.task(name=...)</text>
      <text x="12" y="88" class="code-font">def send_email_task(to):</text>
      <text x="12" y="118" class="code-font">  time.sleep(10) # 10s sleep</text>
      <text x="12" y="146" class="code-font">  return f"Email sent to {to}"</text>
    </g>

    <g transform="translate(15, 260)">
      <rect width="260" height="200" rx="6" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.2" />
      <rect width="260" height="32" rx="6" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">Worker Execution</text>
      <text x="12" y="60" class="code-font">celery -A app.celery worker</text>
      <text x="12" y="90" class="body-text">• Dequeues tasks via BRPOP</text>
      <text x="12" y="120" class="body-text">• Runs simulated email task</text>
      <text x="12" y="150" class="body-text">• Writes SUCCESS to backend</text>
      <text x="12" y="182" class="subtitle-text">Acks message &amp; awaits next task</text>
    </g>
  </g>

</svg>