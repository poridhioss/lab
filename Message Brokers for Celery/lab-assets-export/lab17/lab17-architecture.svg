<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 620" width="100%" height="100%">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 500; fill: #64748b; }
      .box-title { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .box-desc { font-size: 12px; font-weight: 400; fill: #475569; }
      .badge-text { font-size: 11px; font-weight: 600; }
      .label-text { font-size: 12px; font-weight: 600; fill: #334155; }
      .code-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #0f172a; }
    </style>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <filter id="subtle-shadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1150" height="620" fill="#f8fafc" rx="12" />
  <rect x="1" y="1" width="1148" height="618" fill="none" stroke="#e2e8f0" stroke-width="2" rx="11" />

  <!-- Header -->
  <rect x="30" y="20" width="1090" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#subtle-shadow)" />
  <circle cx="60" cy="51" r="16" fill="#fef3c7" />
  <path d="M52 51 L57 56 L67 46" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="45" class="font-sans title">Lab 17: Celery Monitoring &amp; Observability with Flower &amp; Nginx</text>
  <text x="88" y="65" class="font-sans subtitle">Two-Tier Architecture: Asynchronous Task Execution Pipeline &amp; Authenticated Real-Time Dashboard</text>

  <!-- SECTION 1: WORKLOAD EXECUTION TIER (Top Row) -->
  <rect x="30" y="96" width="1090" height="230" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#subtle-shadow)" />
  <rect x="30" y="96" width="220" height="26" rx="6" fill="#f1f5f9" />
  <text x="42" y="113" class="font-sans badge-text" fill="#334155">WORKLOAD EXECUTION PIPELINE</text>

  <!-- Box 1A: Client / Trigger -->
  <g transform="translate(50, 132)">
    <rect width="200" height="175" rx="8" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5" />
    <rect width="200" height="32" rx="8" fill="#eff6ff" />
    <text x="100" y="21" text-anchor="middle" class="font-sans box-title" fill="#1e40af">Client / Curl</text>
    <text x="16" y="52" class="font-sans box-desc">• Submits batch jobs</text>
    <text x="16" y="72" class="code-text" fill="#2563eb">POST /trigger</text>
    <text x="16" y="90" class="code-text" fill="#64748b">{"count": 5}</text>
    <rect x="14" y="108" width="172" height="50" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="22" y="125" class="code-text" fill="#059669">202 Accepted</text>
    <text x="22" y="145" class="code-text" fill="#64748b">[task_ids: ...]</text>
  </g>

  <!-- Box 1B: Flask API -->
  <g transform="translate(300, 132)">
    <rect width="220" height="175" rx="8" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5" />
    <rect width="220" height="32" rx="8" fill="#eff6ff" />
    <text x="110" y="21" text-anchor="middle" class="font-sans box-title" fill="#1e40af">Flask API (Port 5000)</text>
    <text x="16" y="52" class="font-sans box-desc">• File: <tspan font-family="monospace">app.py</tspan></text>
    <text x="16" y="72" class="font-sans box-desc">• Dispatches tasks async:</text>
    <text x="16" y="92" class="code-text" fill="#2563eb">process_data_task.delay(i)</text>
    <text x="16" y="114" class="font-sans box-desc">• Collects UUIDs</text>
    <text x="16" y="134" class="font-sans box-desc">• Returns immediate response</text>
    <text x="16" y="154" class="font-sans badge-text" fill="#2563eb">REST Producer Endpoint</text>
  </g>

  <!-- Box 1C: Redis Container -->
  <g transform="translate(570, 132)">
    <rect width="240" height="175" rx="8" fill="#f8fafc" stroke="#f87171" stroke-width="1.5" />
    <rect width="240" height="32" rx="8" fill="#fef2f2" />
    <text x="120" y="21" text-anchor="middle" class="font-sans box-title" fill="#991b1b">Redis Broker (Port 6379)</text>
    <text x="16" y="52" class="font-sans box-desc">• Container: <tspan font-family="monospace">lab17-redis</tspan></text>
    <text x="16" y="72" class="font-sans box-desc">• <tspan font-weight="600">DB 0:</tspan> Message Broker Queue</text>
    <text x="16" y="92" class="code-text" fill="#991b1b">redis://localhost:6379/0</text>
    <text x="16" y="116" class="font-sans box-desc">• <tspan font-weight="600">DB 1:</tspan> Result Backend</text>
    <text x="16" y="136" class="code-text" fill="#991b1b">redis://localhost:6379/1</text>
    <text x="16" y="156" class="font-sans box-desc">• Broadcasts Celery event stream</text>
  </g>

  <!-- Box 1D: Celery Worker -->
  <g transform="translate(860, 132)">
    <rect width="240" height="175" rx="8" fill="#f8fafc" stroke="#c084fc" stroke-width="1.5" />
    <rect width="240" height="32" rx="8" fill="#faf5ff" />
    <text x="120" y="21" text-anchor="middle" class="font-sans box-title" fill="#581c87">Celery Worker Daemon</text>
    <text x="16" y="52" class="font-sans box-desc">• Module: <tspan font-family="monospace">tasks.py</tspan></text>
    <text x="16" y="72" class="font-sans box-desc">• Task: <tspan font-family="monospace">process_data_task</tspan></text>
    <text x="16" y="92" class="font-sans box-desc">• Delay: random sleep (2–5s)</text>
    <text x="16" y="112" class="code-text" fill="#d97706">20% Simulated Error Rate</text>
    <text x="16" y="132" class="font-sans box-desc">• Generates SUCCESS &amp; FAILURE</text>
    <text x="16" y="152" class="font-sans box-desc">• Emits lifecycle events to Redis</text>
  </g>

  <!-- Arrows in Tier 1 -->
  <!-- Client -> Flask -->
  <line x1="250" y1="210" x2="300" y2="210" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
  <!-- Flask -> Redis -->
  <line x1="520" y1="210" x2="570" y2="210" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
  <!-- Redis -> Celery Worker -->
  <line x1="810" y1="210" x2="860" y2="210" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)" />

  <!-- SECTION 2: OBSERVABILITY & MONITORING TIER (Bottom Row) -->
  <rect x="30" y="340" width="1090" height="230" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#subtle-shadow)" />
  <rect x="30" y="340" width="240" height="26" rx="6" fill="#f1f5f9" />
  <text x="42" y="357" class="font-sans badge-text" fill="#334155">OBSERVABILITY &amp; SECURITY TIER</text>

  <!-- Box 2A: Browser / Operator -->
  <g transform="translate(50, 376)">
    <rect width="200" height="175" rx="8" fill="#f8fafc" stroke="#fcd34d" stroke-width="1.5" />
    <rect width="200" height="32" rx="8" fill="#fef3c7" />
    <text x="100" y="21" text-anchor="middle" class="font-sans box-title" fill="#92400e">Operator / Browser</text>
    <text x="16" y="54" class="font-sans box-desc">• Web Browser access</text>
    <text x="16" y="74" class="code-text" fill="#b45309">GET :8080/</text>
    <text x="16" y="96" class="font-sans box-desc">• HTTP Basic Auth prompt</text>
    <text x="16" y="116" class="code-text" fill="#475569">User: admin</text>
    <text x="16" y="134" class="code-text" fill="#475569">Pass: admin123</text>
    <text x="16" y="156" class="font-sans badge-text" fill="#059669">Authenticated Session</text>
  </g>

  <!-- Box 2B: Nginx Reverse Proxy -->
  <g transform="translate(300, 376)">
    <rect width="220" height="175" rx="8" fill="#f8fafc" stroke="#6ee7b7" stroke-width="1.5" />
    <rect width="220" height="32" rx="8" fill="#ecfdf5" />
    <text x="110" y="21" text-anchor="middle" class="font-sans box-title" fill="#065f46">Nginx Reverse Proxy</text>
    <text x="16" y="52" class="font-sans box-desc">• Port: <tspan font-weight="600">8080</tspan></text>
    <text x="16" y="72" class="font-sans box-desc">• Module: <tspan font-family="monospace">auth_basic</tspan></text>
    <text x="16" y="92" class="code-text" fill="#065f46">/etc/nginx/.htpasswd</text>
    <text x="16" y="114" class="font-sans box-desc">• Enforces credentials</text>
    <text x="16" y="134" class="code-text" fill="#059669">proxy_pass :5555</text>
    <text x="16" y="154" class="font-sans badge-text" fill="#065f46">Blocks Unauthorized Access</text>
  </g>

  <!-- Box 2C: Flower Dashboard -->
  <g transform="translate(570, 376)">
    <rect width="240" height="175" rx="8" fill="#f8fafc" stroke="#fcd34d" stroke-width="1.5" />
    <rect width="240" height="32" rx="8" fill="#fef3c7" />
    <text x="120" y="21" text-anchor="middle" class="font-sans box-title" fill="#92400e">Flower Dashboard</text>
    <text x="16" y="52" class="font-sans box-desc">• Internal Port: <tspan font-weight="600">5555</tspan></text>
    <text x="16" y="72" class="font-sans box-desc">• Web-based Celery admin UI</text>
    <text x="16" y="92" class="font-sans box-desc">• Real-time graphs &amp; metrics</text>
    <text x="16" y="112" class="font-sans box-desc">• Active worker heartbeats</text>
    <text x="16" y="132" class="font-sans box-desc">• Succeeded / Failed task logs</text>
    <text x="16" y="154" class="font-sans badge-text" fill="#b45309">Protected by Nginx</text>
  </g>

  <!-- Box 2D: Celery Events Bridge -->
  <g transform="translate(860, 376)">
    <rect width="240" height="175" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <rect width="240" height="32" rx="8" fill="#f1f5f9" />
    <text x="120" y="21" text-anchor="middle" class="font-sans box-title" fill="#1e293b">Metrics &amp; Events Ingestion</text>
    <text x="16" y="52" class="font-sans box-desc">• Subscribes to Celery event feed</text>
    <text x="16" y="72" class="font-sans box-desc">• Worker State: Online / Offline</text>
    <text x="16" y="92" class="font-sans box-desc">• Task States: RECEIVED, STARTED,</text>
    <text x="24" y="110" class="font-sans box-desc">SUCCESS, FAILURE</text>
    <text x="16" y="132" class="font-sans box-desc">• Execution time &amp; traceback</text>
    <text x="16" y="154" class="font-sans badge-text" fill="#475569">Zero Overhead on Worker</text>
  </g>

  <!-- Arrows in Tier 2 -->
  <line x1="250" y1="455" x2="300" y2="455" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)" />
  <line x1="520" y1="455" x2="570" y2="455" stroke="#059669" stroke-width="2" marker-end="url(#arrow-emerald)" />
  <line x1="810" y1="455" x2="860" y2="455" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-blue)" />

  <!-- Vertical Bridge: Flower listens to Redis Broker -->
  <path d="M 690 376 L 690 307" stroke="#d97706" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-amber)" />
  <rect x="700" y="325" width="130" height="20" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1" />
  <text x="765" y="339" text-anchor="middle" class="font-sans code-text" fill="#b45309">Event Subscription</text>

  <!-- Footer -->
  <rect x="30" y="580" width="1090" height="28" rx="4" fill="#f1f5f9" />
  <text x="45" y="598" class="font-sans box-desc">Port 5000: Task Ingestion API | Port 6379: Redis (DB 0/1) | Port 5555: Flower Internal | Port 8080: Nginx Authenticated Proxy</text>
  <text x="1105" y="598" text-anchor="end" class="font-sans badge-text" fill="#64748b">Poridhi Labs • Lab 17 Architecture</text>
</svg>