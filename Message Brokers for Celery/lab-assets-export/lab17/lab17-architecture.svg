<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 500" width="1560" height="500">

  <defs>
    <style>
      text {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        fill: #000000;
      }
      .title-text {
        font-size: 17px;
        font-weight: bold;
        fill: #000000;
      }
      .subtitle-text {
        font-size: 13px;
        font-style: italic;
        fill: #000000;
      }
      .section-heading {
        font-size: 14.5px;
        font-weight: bold;
        fill: #000000;
      }
      .code-font {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        font-size: 13px;
        fill: #000000;
      }
      .body-text {
        font-size: 13px;
        fill: #000000;
      }
      .arrow-label {
        font-size: 13px;
        font-weight: bold;
        fill: #000000;
      }
      .arrow-sub {
        font-size: 12px;
        font-style: italic;
        fill: #000000;
      }
      .flow-step-title {
        font-size: 13.5px;
        font-weight: bold;
        fill: #000000;
      }
      .flow-step-sub {
        font-size: 12px;
        font-style: italic;
        fill: #000000;
      }
    </style>
    <marker id="arr-black" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Section 1 Label -->
  <text x="20" y="32" class="title-text">1. Task Execution Pipeline (Async Jobs):</text>

  <!-- Box 1: Client (Curl / Script) (Blue) -->
  <g transform="translate(20, 50)">
    <rect width="260" height="195" rx="8" fill="#f0f7ff" stroke="#2563eb" stroke-width="2" />
    <rect width="260" height="38" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
    <rect y="28" width="260" height="10" fill="#dbeafe" />
    <text x="130" y="24" text-anchor="middle" class="section-heading">Client (Curl / Script)</text>

    <text x="12" y="60" class="code-font" font-weight="bold">POST /trigger {"count": 5}</text>
    <text x="12" y="86" class="body-text">• Submits batch task trigger</text>
    <text x="12" y="114" class="code-font" font-weight="bold">202 Accepted {"task_ids": [...]}</text>
    <text x="12" y="142" class="body-text">• Instant non-blocking response</text>
    <text x="12" y="174" class="subtitle-text">Asynchronous execution trigger</text>
  </g>

  <!-- Box 2: Flask API (Green) -->
  <g transform="translate(420, 50)">
    <rect width="270" height="195" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="2" />
    <rect width="270" height="38" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.5" />
    <rect y="28" width="270" height="10" fill="#dcfce7" />
    <text x="135" y="24" text-anchor="middle" class="section-heading">Flask API (Port 5000)</text>

    <text x="12" y="60" class="body-text">• Endpoint: POST /trigger</text>
    <text x="12" y="86" class="code-font">process_data_task.delay(i)</text>
    <text x="12" y="114" class="body-text">• Dispatches 5 Celery tasks</text>
    <text x="12" y="142" class="body-text">• Returns list of UUID tokens</text>
    <text x="12" y="174" class="subtitle-text">Producer service layer</text>
  </g>

  <!-- Box 3: Redis 7 (Red) -->
  <g transform="translate(830, 50)">
    <rect width="270" height="195" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="2" />
    <rect width="270" height="38" rx="8" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5" />
    <rect y="28" width="270" height="10" fill="#ffe4e6" />
    <text x="135" y="24" text-anchor="middle" class="section-heading">Redis 7 (Port 6379)</text>

    <text x="12" y="60" class="code-font">DB 0: redis://...:6379/0 (Queue)</text>
    <text x="12" y="86" class="code-font">DB 1: redis://...:6379/1 (Backend)</text>
    <text x="12" y="114" class="body-text">• Holds broker task queue</text>
    <text x="12" y="142" class="body-text">• Emits Celery event stream</text>
    <text x="12" y="174" class="subtitle-text">Central in-memory bus</text>
  </g>

  <!-- Box 4: Celery Worker Daemon (Purple) -->
  <g transform="translate(1240, 50)">
    <rect width="270" height="195" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" />
    <rect width="270" height="38" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" />
    <rect y="28" width="270" height="10" fill="#ede9fe" />
    <text x="135" y="24" text-anchor="middle" class="section-heading">Celery Worker Daemon</text>

    <text x="12" y="60" class="code-font">Task: process_data_task</text>
    <text x="12" y="86" class="body-text">• Simulates delay: 2–5s sleep</text>
    <text x="12" y="114" class="body-text">• Simulated error rate: 20%</text>
    <text x="12" y="142" class="body-text">• Generates SUCCESS / FAILURE</text>
    <text x="12" y="174" class="subtitle-text">Background worker execution</text>
  </g>

  <!-- Connectors Row 1 (Badges sit ABOVE line at y=145) -->
  <rect x="305" y="107" width="80" height="26" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" />
  <text x="345" y="125" text-anchor="middle" class="arrow-label">POST</text>
  <line x1="280" y1="145" x2="418" y2="145" stroke="#000000" stroke-width="2" marker-end="url(#arr-black)" />

  <rect x="715" y="107" width="85" height="26" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.2" />
  <text x="757" y="125" text-anchor="middle" class="arrow-label">Enqueue</text>
  <line x1="690" y1="145" x2="828" y2="145" stroke="#000000" stroke-width="2" marker-end="url(#arr-black)" />

  <rect x="1125" y="107" width="85" height="26" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" />
  <text x="1167" y="125" text-anchor="middle" class="arrow-label">Execute</text>
  <line x1="1100" y1="145" x2="1238" y2="145" stroke="#000000" stroke-width="2" marker-end="url(#arr-black)" />

  <!-- Section 2 Label -->
  <text x="20" y="278" class="title-text">2. Secure Observability &amp; Dashboard Pipeline:</text>

  <!-- Box 5: Operator / Browser (Blue) -->
  <g transform="translate(20, 295)">
    <rect width="260" height="190" rx="8" fill="#f0f7ff" stroke="#2563eb" stroke-width="2" />
    <rect width="260" height="38" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
    <rect y="28" width="260" height="10" fill="#dbeafe" />
    <text x="130" y="24" text-anchor="middle" class="section-heading">Operator / Browser</text>

    <text x="12" y="60" class="code-font" font-weight="bold">GET http://localhost:8080</text>
    <text x="12" y="86" class="body-text">• Basic Auth: admin / admin123</text>
    <text x="12" y="114" class="body-text">• Displays live task metrics</text>
    <text x="12" y="142" class="body-text">• Real-time cluster status</text>
    <text x="12" y="172" class="subtitle-text">Authenticated web client</text>
  </g>

  <!-- Box 6: Nginx Proxy (Teal) -->
  <g transform="translate(420, 295)">
    <rect width="270" height="190" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" />
    <rect width="270" height="38" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5" />
    <rect y="28" width="270" height="10" fill="#ccfbf1" />
    <text x="135" y="24" text-anchor="middle" class="section-heading">Nginx Proxy (Port 8080)</text>

    <text x="12" y="60" class="code-font">auth_basic /etc/nginx/.htpasswd</text>
    <text x="12" y="86" class="body-text">• Enforces HTTP Basic Auth</text>
    <text x="12" y="114" class="code-font">proxy_pass http://127.0.0.1:5555</text>
    <text x="12" y="142" class="body-text">• Restricts direct port 5555 access</text>
    <text x="12" y="172" class="subtitle-text">Security gatekeeper</text>
  </g>

  <!-- Box 7: Flower Dashboard (Orange) -->
  <g transform="translate(830, 295)">
    <rect width="270" height="190" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2" />
    <rect width="270" height="38" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" />
    <rect y="28" width="270" height="10" fill="#ffedd5" />
    <text x="135" y="24" text-anchor="middle" class="section-heading">Flower Dashboard (:5555)</text>

    <text x="12" y="60" class="body-text">• Bound to: 127.0.0.1:5555</text>
    <text x="12" y="86" class="body-text">• Ingests task event telemetry</text>
    <text x="12" y="114" class="body-text">• Tracks active / completed jobs</text>
    <text x="12" y="142" class="body-text">• Renders live HTML dashboard</text>
    <text x="12" y="172" class="subtitle-text">Monitoring daemon</text>
  </g>

  <!-- Box 8: Event Bus / Telemetry (Purple) -->
  <g transform="translate(1240, 295)">
    <rect width="270" height="190" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" />
    <rect width="270" height="38" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" />
    <rect y="28" width="270" height="10" fill="#ede9fe" />
    <text x="135" y="24" text-anchor="middle" class="section-heading">Event Bus / Telemetry</text>

    <text x="12" y="60" class="body-text">• Subscribes to Redis broker</text>
    <text x="12" y="86" class="body-text">• Ingests Celery events:</text>
    <text x="20" y="114" class="code-font">task-received, succeeded, failed</text>
    <text x="12" y="142" class="body-text">• Zero performance overhead</text>
    <text x="12" y="172" class="subtitle-text">Real-time metrics engine</text>
  </g>

  <!-- Connectors Row 2 (Badges sit ABOVE line at y=385) -->
  <rect x="295" y="347" width="95" height="26" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" />
  <text x="342" y="365" text-anchor="middle" class="arrow-label">Basic Auth</text>
  <line x1="280" y1="385" x2="418" y2="385" stroke="#000000" stroke-width="2" marker-end="url(#arr-black)" />

  <rect x="715" y="347" width="85" height="26" rx="4" fill="#ffffff" stroke="#0d9488" stroke-width="1.2" />
  <text x="757" y="365" text-anchor="middle" class="arrow-label">Proxy</text>
  <line x1="690" y1="385" x2="828" y2="385" stroke="#000000" stroke-width="2" marker-end="url(#arr-black)" />

  <rect x="1120" y="347" width="90" height="26" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" />
  <text x="1165" y="365" text-anchor="middle" class="arrow-label">Subscribe</text>
  <line x1="1100" y1="385" x2="1238" y2="385" stroke="#000000" stroke-width="2" marker-end="url(#arr-black)" />

  <!-- Cross-tier vertical connection: Redis -> Flower -->
  <line x1="965" y1="245" x2="965" y2="293" stroke="#000000" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arr-black)" />
  <rect x="885" y="256" width="160" height="24" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.2" />
  <text x="965" y="273" text-anchor="middle" class="arrow-sub">Celery Event Stream</text>

</svg>