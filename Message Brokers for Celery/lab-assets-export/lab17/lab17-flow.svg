<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 680" width="100%" height="100%">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 500; fill: #64748b; }
      .actor-title { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .actor-sub { font-size: 10.5px; font-weight: 500; fill: #e2e8f0; }
      .step-num { font-size: 11px; font-weight: 700; fill: #ffffff; }
      .step-title { font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .step-desc { font-size: 11px; font-weight: 400; fill: #334155; }
      .lifeline { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 4; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1050" height="680" fill="#f8fafc" rx="12" />
  <rect x="1" y="1" width="1048" height="678" fill="none" stroke="#e2e8f0" stroke-width="2" rx="11" />

  <!-- Header -->
  <rect x="25" y="20" width="1000" height="54" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)" />
  <text x="45" y="44" class="font-sans title">Lab 17: Workload Execution &amp; Protected Observability Sequence</text>
  <text x="45" y="62" class="font-sans subtitle">Detailed lifecycle flow of task submission, failure simulation, event emission, and authenticated monitoring</text>

  <!-- Actors (5 columns) -->
  <!-- Actor 1: Client/Operator -->
  <g transform="translate(30, 95)">
    <rect width="150" height="48" rx="8" fill="#2563eb" filter="url(#shadow)" />
    <text x="75" y="23" text-anchor="middle" class="font-sans actor-title">Client / Admin</text>
    <text x="75" y="38" text-anchor="middle" class="font-sans actor-sub">Browser / Curl</text>
    <line x1="75" y1="48" x2="75" y2="550" class="lifeline" />
  </g>

  <!-- Actor 2: Nginx (Port 8080) -->
  <g transform="translate(220, 95)">
    <rect width="160" height="48" rx="8" fill="#059669" filter="url(#shadow)" />
    <text x="80" y="23" text-anchor="middle" class="font-sans actor-title">Nginx Proxy (:8080)</text>
    <text x="80" y="38" text-anchor="middle" class="font-sans actor-sub">Basic Auth (.htpasswd)</text>
    <line x1="80" y1="48" x2="80" y2="550" class="lifeline" />
  </g>

  <!-- Actor 3: Flask API (:5000) -->
  <g transform="translate(420, 95)">
    <rect width="160" height="48" rx="8" fill="#0284c7" filter="url(#shadow)" />
    <text x="80" y="23" text-anchor="middle" class="font-sans actor-title">Flask API (:5000)</text>
    <text x="80" y="38" text-anchor="middle" class="font-sans actor-sub">POST /trigger</text>
    <line x1="80" y1="48" x2="80" y2="550" class="lifeline" />
  </g>

  <!-- Actor 4: Redis & Celery Worker -->
  <g transform="translate(620, 95)">
    <rect width="180" height="48" rx="8" fill="#7c3aed" filter="url(#shadow)" />
    <text x="90" y="23" text-anchor="middle" class="font-sans actor-title">Redis &amp; Worker</text>
    <text x="90" y="38" text-anchor="middle" class="font-sans actor-sub">Task Queue &amp; Worker</text>
    <line x1="90" y1="48" x2="90" y2="550" class="lifeline" />
  </g>

  <!-- Actor 5: Flower Dashboard (:5555) -->
  <g transform="translate(840, 95)">
    <rect width="170" height="48" rx="8" fill="#d97706" filter="url(#shadow)" />
    <text x="85" y="23" text-anchor="middle" class="font-sans actor-title">Flower (:5555)</text>
    <text x="85" y="38" text-anchor="middle" class="font-sans actor-sub">Observability Engine</text>
    <line x1="85" y1="48" x2="85" y2="550" class="lifeline" />
  </g>

  <!-- STEP 1: POST /trigger -->
  <g transform="translate(0, 160)">
    <line x1="105" y1="20" x2="500" y2="20" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)" />
    <rect x="230" y="2" width="165" height="34" rx="6" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="246" cy="19" r="10" fill="#0284c7" />
    <text x="246" y="23" text-anchor="middle" class="font-sans step-num">1</text>
    <text x="264" y="16" class="font-sans step-title" fill="#0369a1">POST /trigger</text>
    <text x="264" y="29" class="font-sans step-desc">Dispatch 5 batch tasks</text>
  </g>

  <!-- STEP 2: Enqueue in Redis & Worker Execution -->
  <g transform="translate(0, 220)">
    <line x1="500" y1="20" x2="710" y2="20" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-purple)" />
    <rect x="545" y="2" width="150" height="34" rx="6" fill="#ffffff" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="561" cy="19" r="10" fill="#7c3aed" />
    <text x="561" y="23" text-anchor="middle" class="font-sans step-num">2</text>
    <text x="578" y="16" class="font-sans step-title" fill="#581c87">Push to Redis DB 0</text>
    <text x="578" y="29" class="font-sans step-desc">Worker executes tasks</text>
  </g>

  <!-- STEP 3: Worker Emits Events to Flower -->
  <g transform="translate(0, 280)">
    <line x1="710" y1="20" x2="925" y2="20" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)" />
    <rect x="740" y="2" width="160" height="34" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="756" cy="19" r="10" fill="#d97706" />
    <text x="756" y="23" text-anchor="middle" class="font-sans step-num">3</text>
    <text x="774" y="16" class="font-sans step-title" fill="#92400e">Celery Event Stream</text>
    <text x="774" y="29" class="font-sans step-desc">task-started / succeeded / failed</text>
  </g>

  <!-- STEP 4: Admin accesses Nginx (:8080) -->
  <g transform="translate(0, 350)">
    <line x1="105" y1="20" x2="300" y2="20" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)" />
    <rect x="135" y="2" width="150" height="34" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="151" cy="19" r="10" fill="#059669" />
    <text x="151" y="23" text-anchor="middle" class="font-sans step-num">4</text>
    <text x="168" y="16" class="font-sans step-title" fill="#065f46">GET :8080/ (with Auth)</text>
    <text x="168" y="29" class="font-sans step-desc">Basic admin:admin123</text>
  </g>

  <!-- STEP 5: Nginx validates against .htpasswd -->
  <g transform="translate(0, 410)">
    <path d="M 300 15 C 345 15, 345 45, 300 45" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)" />
    <rect x="350" y="10" width="150" height="42" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="366" cy="31" r="10" fill="#059669" />
    <text x="366" y="35" text-anchor="middle" class="font-sans step-num">5</text>
    <text x="384" y="25" class="font-sans step-title" fill="#065f46">Verify Credentials</text>
    <text x="384" y="40" class="font-sans step-desc">Match /etc/nginx/.htpasswd</text>
  </g>

  <!-- STEP 6: Forward to Flower & Render Metrics -->
  <g transform="translate(0, 480)">
    <line x1="300" y1="20" x2="925" y2="20" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)" />
    <rect x="520" y="2" width="185" height="34" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="536" cy="19" r="10" fill="#d97706" />
    <text x="536" y="23" text-anchor="middle" class="font-sans step-num">6</text>
    <text x="554" y="16" class="font-sans step-title" fill="#92400e">proxy_pass http://127.0.0.1:5555</text>
    <text x="554" y="29" class="font-sans step-desc">Flower renders real-time dashboard</text>
  </g>

  <!-- Bottom Summary Note -->
  <g transform="translate(30, 565)">
    <rect width="990" height="90" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect width="6" height="90" rx="3" fill="#059669" />
    <text x="24" y="28" class="font-sans step-title">Security &amp; Observability Key Insights:</text>
    <text x="24" y="50" class="font-sans step-desc">• <tspan font-weight="600">Reverse Proxy Isolation:</tspan> Flower's web port (5555) remains internal (127.0.0.1); external traffic is strictly funneled through Nginx (port 8080).</text>
    <text x="24" y="70" class="font-sans step-desc">• <tspan font-weight="600">Metric Separation:</tspan> The 20% simulated failure rate allows verifying error tracking, worker retries, and task state transitions in Flower's live charts.</text>
  </g>
</svg>