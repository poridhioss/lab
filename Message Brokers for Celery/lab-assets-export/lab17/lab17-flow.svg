  <text x="400" y="133" text-anchor="middle" class="flow-step-sub">(Client submits 5 batch tasks to Flask API)</text>

  <!-- Message Step -->
  <line x1="660" y1="233" x2="918" y2="233" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="790" y="205" text-anchor="middle" class="flow-step-title">2. Enqueue in Redis &amp; Execute</text>

