  <line x1="400" y1="585" x2="1168" y2="585" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="785" y="557" text-anchor="middle" class="flow-step-title">6. proxy_pass http://127.0.0.1:5555</text>

  <text x="785" y="573" text-anchor="middle" class="flow-step-sub">(Nginx forwards authenticated session; Flower delivers dashboard HTML)</text>
