<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" width="1180" height="600">

  <defs>
    <style>
      text {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        fill: #000000;
      }
      .title-text {
        font-size: 15px;
        font-weight: bold;
        fill: #000000;
      }
      .subtitle-text {
        font-size: 11px;
        font-style: italic;
        fill: #000000;
      }
      .section-heading {
        font-size: 12px;
        font-weight: bold;
        fill: #000000;
      }
      .code-font {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        font-size: 11px;
        fill: #000000;
      }
      .body-text {
        font-size: 11px;
        fill: #000000;
      }
      .arrow-label {
        font-size: 11px;
        font-weight: bold;
        fill: #000000;
      }
      .arrow-sub {
        font-size: 10px;
        font-style: italic;
        fill: #000000;
      }
      .flow-step-title {
        font-size: 12px;
        font-weight: bold;
        fill: #000000;
      }
      .flow-step-sub {
        font-size: 11px;
        font-style: italic;
        fill: #000000;
      }
    </style>
    <marker id="arr-black" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

<rect width="100%" height="100%" fill="#ffffff" />

  <!-- Lifeline Header: Client / Admin -->
  <rect x="25" y="20" width="190" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
  <text x="120" y="42" text-anchor="middle" class="section-heading">Client / Admin</text>
  <text x="120" y="57" text-anchor="middle" class="subtitle-text">Browser / Curl</text>
  <line x1="120" y1="68" x2="120" y2="580" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Lifeline Header: Nginx Proxy (:8080) -->
  <rect x="255" y="20" width="190" height="48" rx="6" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8" />
  <text x="350" y="42" text-anchor="middle" class="section-heading">Nginx Proxy (:8080)</text>
  <text x="350" y="57" text-anchor="middle" class="subtitle-text">Basic Auth (.htpasswd)</text>
  <line x1="350" y1="68" x2="350" y2="580" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Lifeline Header: Flask API (:5000) -->
  <rect x="485" y="20" width="190" height="48" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.8" />
  <text x="580" y="42" text-anchor="middle" class="section-heading">Flask API (:5000)</text>
  <text x="580" y="57" text-anchor="middle" class="subtitle-text">POST /trigger</text>
  <line x1="580" y1="68" x2="580" y2="580" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Lifeline Header: Redis & Worker -->
  <rect x="715" y="20" width="190" height="48" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.8" />
  <text x="810" y="42" text-anchor="middle" class="section-heading">Redis &amp; Worker</text>
  <text x="810" y="57" text-anchor="middle" class="subtitle-text">Task Queue &amp; Daemon</text>
  <line x1="810" y1="68" x2="810" y2="580" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Lifeline Header: Flower (:5555) -->
  <rect x="945" y="20" width="190" height="48" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" />
  <text x="1040" y="42" text-anchor="middle" class="section-heading">Flower (:5555)</text>
  <text x="1040" y="57" text-anchor="middle" class="subtitle-text">Monitoring Dashboard</text>
  <line x1="1040" y1="68" x2="1040" y2="580" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Message Step -->
  <line x1="120" y1="125" x2="578" y2="125" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="350" y="97" text-anchor="middle" class="flow-step-title">1. POST /trigger {"count": 5}</text>

  <text x="350" y="113" text-anchor="middle" class="flow-step-sub">(Client submits 5 batch tasks to Flask API)</text>

  <!-- Message Step -->
  <line x1="580" y1="205" x2="808" y2="205" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="695" y="177" text-anchor="middle" class="flow-step-title">2. Enqueue in Redis &amp; Execute</text>

  <text x="695" y="193" text-anchor="middle" class="flow-step-sub">(Worker processes with 20% simulated error)</text>

  <!-- Message Step -->
  <line x1="810" y1="285" x2="1038" y2="285" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="925" y="257" text-anchor="middle" class="flow-step-title">3. Celery Event Stream</text>

  <text x="925" y="273" text-anchor="middle" class="flow-step-sub">(Worker emits task state transitions to Flower)</text>

  <!-- Message Step -->
  <line x1="120" y1="365" x2="348" y2="365" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="235" y="337" text-anchor="middle" class="flow-step-title">4. GET :8080/ (with Basic Auth)</text>

  <text x="235" y="353" text-anchor="middle" class="flow-step-sub">(User provides admin:admin123 credentials)</text>

  <!-- Self Loop -->
  <path d="M 350 433 C 385 433, 385 457, 355 457" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arr-black)" />
  <text x="395" y="443" text-anchor="start" class="flow-step-title">5. Verify against .htpasswd</text>

  <text x="395" y="459" text-anchor="start" class="flow-step-sub">Matches cryptographic password hash</text>

  <!-- Message Step -->
  <line x1="350" y1="525" x2="1038" y2="525" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="695" y="497" text-anchor="middle" class="flow-step-title">6. proxy_pass http://127.0.0.1:5555</text>

  <text x="695" y="513" text-anchor="middle" class="flow-step-sub">(Nginx forwards authenticated session; Flower delivers dashboard HTML)</text>
</svg>