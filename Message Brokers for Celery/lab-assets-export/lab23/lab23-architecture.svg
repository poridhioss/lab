    <text x="54" y="27" text-anchor="start" class="title-text">RabbitMQ Message Broker</text>
    <text x="54" y="45" text-anchor="start" class="subtitle-text">Central AMQP Message Bus</text>

    <g transform="translate(15, 65)">
      <text x="0" y="20" class="body-text">lab23-rabbitmq (:5672 AMQP / :15672 Web)</text>
      <text x="0" y="46" class="code-font">URL: amqp://celery:celery123@...:5672</text>
      <text x="0" y="74" class="body-text">• Volume: rabbitmq_data (/var/lib/rabbitmq)</text>
      <text x="0" y="102" class="body-text">• Preserves task queues across restarts</text>
      <text x="0" y="126" class="subtitle-text">Central AMQP message bus</text>
    </g>
