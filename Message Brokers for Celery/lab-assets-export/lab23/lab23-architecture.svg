    <text x="54" y="45" text-anchor="start" class="subtitle-text">Asynchronous Consumer</text>

    <g transform="translate(15, 65)">
      <text x="0" y="20" class="code-font">Container: lab23-worker (python:3.11)</text>
      <text x="0" y="46" class="code-font">Task: add(10, 20) -&gt; 30 (sleep 2s)</text>
      <text x="0" y="74" class="body-text">• Celery command: celery -A tasks worker</text>
      <text x="0" y="102" class="code-font">• Result reply backend: rpc://</text>
      <text x="0" y="126" class="subtitle-text">Asynchronous background worker</text>
    </g>
