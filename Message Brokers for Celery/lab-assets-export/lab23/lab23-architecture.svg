    <text x="54" y="45" text-anchor="start" class="subtitle-text">Local Container Task Producer</text>

    <g transform="translate(15, 65)">
      <text x="0" y="20" class="code-font">docker compose exec worker</text>
      <text x="0" y="46" class="code-font">python -c "from tasks import add; r=add.delay(10,20)"</text>
      <text x="0" y="74" class="body-text">• Non-blocking asynchronous dispatch</text>
      <text x="0" y="102" class="code-font" font-weight="bold">Task ID: [UUID string]</text>
      <text x="0" y="126" class="subtitle-text">Local container task producer</text>
    </g>
