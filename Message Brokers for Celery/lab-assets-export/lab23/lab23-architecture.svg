    <text x="54" y="45" text-anchor="start" class="subtitle-text">Encrypted Edge Ingress Gateway</text>

    <g transform="translate(15, 65)">
      <text x="0" y="20" class="code-font">./cloudflared tunnel --url :5555</text>
      <text x="0" y="46" class="body-text">• Establishes outbound encrypted TLS tunnel</text>
      <text x="0" y="74" class="body-text">• Generates public HTTPS trycloudflare URL</text>
      <text x="0" y="102" class="body-text">• Proxies external requests to port 5555</text>
      <text x="0" y="126" class="subtitle-text">Encrypted edge ingress gateway</text>
    </g>
  </g>

