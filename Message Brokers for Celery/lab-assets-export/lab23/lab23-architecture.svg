    <g transform="translate(15, 65)">
      <text x="0" y="20" class="code-font" font-weight="bold">https://*.trycloudflare.com</text>
      <text x="0" y="46" class="body-text">• /tasks: Inspects executed add task (SUCCESS)</text>
      <text x="0" y="74" class="body-text">• /workers: 1 Worker Online status</text>
      <text x="0" y="102" class="body-text">• Zero inbound firewall open ports</text>
