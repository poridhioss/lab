  <text x="958" y="44" text-anchor="start" class="section-heading">Flower + Cloudflare</text>
  <text x="958" y="64" text-anchor="start" class="subtitle-text">Port 5555 -&gt; HTTPS Tunnel</text>
  <line x1="1010" y1="80" x2="1010" y2="660" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Message Step -->
  <line x1="150" y1="145" x2="428" y2="145" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="290" y="117" text-anchor="middle" class="flow-step-title">1. add.delay(10, 20)</text>

  <text x="290" y="133" text-anchor="middle" class="flow-step-sub">(Python script dispatches task via AMQP broker)</text>

  <!-- Message Step -->
  <line x1="430" y1="233" x2="728" y2="233" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="580" y="205" text-anchor="middle" class="flow-step-title">2. Worker Dequeues from RabbitMQ</text>

  <text x="580" y="221" text-anchor="middle" class="flow-step-sub">(Worker pulls pending add task from queue)</text>

  <!-- Self Loop -->
  <path d="M 730 309 C 770 309, 770 333, 735 333" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arr-black)" />
  <text x="780" y="319" text-anchor="start" class="flow-step-title">3. Execute add(10, 20)</text>

  <text x="780" y="337" text-anchor="start" class="flow-step-sub">sleep(2) then returns 30</text>

  <!-- Message Step -->
  <line x1="730" y1="409" x2="432" y2="409" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="580" y="381" text-anchor="middle" class="flow-step-title">4. RPC Result Reply (30)</text>

  <text x="580" y="397" text-anchor="middle" class="flow-step-sub">(Worker sends outcome back over AMQP backend)</text>

  <!-- Message Step -->
  <line x1="430" y1="497" x2="1008" y2="497" stroke="#000000" stroke-width="1.8" stroke-dasharray="5,5" marker-end="url(#arr-black)" />
  <text x="720" y="469" text-anchor="middle" class="flow-step-title">5. Ingest Event into Flower</text>

  <text x="720" y="485" text-anchor="middle" class="flow-step-sub">(Flower captures SUCCESS status transition)</text>

  <!-- Message Step -->
  <line x1="150" y1="585" x2="1008" y2="585" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="580" y="557" text-anchor="middle" class="flow-step-title">6. HTTPS Ingress via Cloudflare Tunnel</text>

  <text x="580" y="573" text-anchor="middle" class="flow-step-sub">(Remote operator views tasks.add SUCCESS in browser UI)</text>
</svg>