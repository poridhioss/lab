  <text x="678" y="44" text-anchor="start" class="section-heading">Celery Worker</text>
  <text x="678" y="64" text-anchor="start" class="subtitle-text">tasks.add(10, 20)</text>
  <line x1="730" y1="80" x2="730" y2="660" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Lifeline Header: Flower + Cloudflare -->
  <rect x="900" y="20" width="220" height="60" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" />
  
  <rect x="912" y="31" width="38" height="38" rx="7" fill="#ffffff" stroke="#ea580c" stroke-width="1.2" />
  <g transform="translate(917, 36) scale(1.16)">
