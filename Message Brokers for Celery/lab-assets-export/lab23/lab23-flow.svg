<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" width="1080" height="600">

  <defs>
    <style>
      text {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        fill: #000000;
      }
      .title-text {
        font-size: 15px;
        font-weight: bold;
        fill: #000000;
      }
      .subtitle-text {
        font-size: 11px;
        font-style: italic;
        fill: #000000;
      }
      .section-heading {
        font-size: 12px;
        font-weight: bold;
        fill: #000000;
      }
      .code-font {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        font-size: 11px;
        fill: #000000;
      }
      .body-text {
        font-size: 11px;
        fill: #000000;
      }
      .arrow-label {
        font-size: 11px;
        font-weight: bold;
        fill: #000000;
      }
      .arrow-sub {
        font-size: 10px;
        font-style: italic;
        fill: #000000;
      }
      .flow-step-title {
        font-size: 12px;
        font-weight: bold;
        fill: #000000;
      }
      .flow-step-sub {
        font-size: 11px;
        font-style: italic;
        fill: #000000;
      }
    </style>
    <marker id="arr-black" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

<rect width="100%" height="100%" fill="#ffffff" />

  <!-- Lifeline Header: Client / Operator -->
  <rect x="35" y="20" width="190" height="48" rx="6" fill="#fafafa" stroke="#000000" stroke-width="1.5" />
  <text x="130" y="42" text-anchor="middle" class="section-heading">Client / Operator</text>
  <text x="130" y="57" text-anchor="middle" class="subtitle-text">Python Client &amp; Browser</text>
  <line x1="130" y1="68" x2="130" y2="580" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Lifeline Header: RabbitMQ (Broker) -->
  <rect x="305" y="20" width="190" height="48" rx="6" fill="#fafafa" stroke="#000000" stroke-width="1.5" />
  <text x="400" y="42" text-anchor="middle" class="section-heading">RabbitMQ (Broker)</text>
  <text x="400" y="57" text-anchor="middle" class="subtitle-text">Port 5672 (AMQP)</text>
  <line x1="400" y1="68" x2="400" y2="580" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Lifeline Header: Celery Worker -->
  <rect x="575" y="20" width="190" height="48" rx="6" fill="#fafafa" stroke="#000000" stroke-width="1.5" />
  <text x="670" y="42" text-anchor="middle" class="section-heading">Celery Worker</text>
  <text x="670" y="57" text-anchor="middle" class="subtitle-text">tasks.add(10, 20)</text>
  <line x1="670" y1="68" x2="670" y2="580" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Lifeline Header: Flower + Cloudflare -->
  <rect x="845" y="20" width="190" height="48" rx="6" fill="#fafafa" stroke="#000000" stroke-width="1.5" />
  <text x="940" y="42" text-anchor="middle" class="section-heading">Flower + Cloudflare</text>
  <text x="940" y="57" text-anchor="middle" class="subtitle-text">Port 5555 -&gt; HTTPS Tunnel</text>
  <line x1="940" y1="68" x2="940" y2="580" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Message Step -->
  <line x1="130" y1="120" x2="398" y2="120" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="265" y="92" text-anchor="middle" class="flow-step-title">1. add.delay(10, 20)</text>

  <text x="265" y="108" text-anchor="middle" class="flow-step-sub">(Python script dispatches task via AMQP broker)</text>

  <!-- Message Step -->
  <line x1="400" y1="200" x2="668" y2="200" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="535" y="172" text-anchor="middle" class="flow-step-title">2. Worker Dequeues from RabbitMQ</text>

  <text x="535" y="188" text-anchor="middle" class="flow-step-sub">(Worker pulls pending add task from queue)</text>

  <!-- Self Loop -->
  <path d="M 670 268 C 705 268, 705 292, 675 292" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arr-black)" />
  <text x="715" y="278" text-anchor="start" class="flow-step-title">3. Execute add(10, 20)</text>

  <text x="715" y="294" text-anchor="start" class="flow-step-sub">sleep(2) then returns 30</text>

  <!-- Message Step -->
  <line x1="670" y1="360" x2="402" y2="360" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="535" y="332" text-anchor="middle" class="flow-step-title">4. RPC Result Reply (30)</text>

  <text x="535" y="348" text-anchor="middle" class="flow-step-sub">(Worker sends outcome back over AMQP backend)</text>

  <!-- Message Step -->
  <line x1="400" y1="440" x2="938" y2="440" stroke="#000000" stroke-width="1.8" stroke-dasharray="5,5" marker-end="url(#arr-black)" />
  <text x="670" y="412" text-anchor="middle" class="flow-step-title">5. Ingest Event into Flower</text>

  <text x="670" y="428" text-anchor="middle" class="flow-step-sub">(Flower captures SUCCESS status transition)</text>

  <!-- Message Step -->
  <line x1="130" y1="520" x2="938" y2="520" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="535" y="492" text-anchor="middle" class="flow-step-title">6. HTTPS Ingress via Cloudflare Tunnel</text>

  <text x="535" y="508" text-anchor="middle" class="flow-step-sub">(Remote operator views tasks.add SUCCESS in browser UI)</text>
</svg>