  <text x="378" y="64" text-anchor="start" class="subtitle-text">Port 5672 (AMQP)</text>
  <line x1="430" y1="80" x2="430" y2="660" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />


