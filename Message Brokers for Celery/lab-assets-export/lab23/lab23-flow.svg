  <text x="98" y="64" text-anchor="start" class="subtitle-text">Python Client &amp; Browser</text>
  <line x1="150" y1="80" x2="150" y2="660" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Lifeline Header: RabbitMQ (Broker) -->
  <rect x="320" y="20" width="220" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.8" />
  
