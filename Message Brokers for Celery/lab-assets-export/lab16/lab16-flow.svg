<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 650" width="1180" height="650">

  <defs>
    <style>
      text {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        fill: #000000;
      }
      .title-text {
        font-size: 15px;
        font-weight: bold;
        fill: #000000;
      }
      .subtitle-text {
        font-size: 11px;
        font-style: italic;
        fill: #000000;
      }
      .section-heading {
        font-size: 12px;
        font-weight: bold;
        fill: #000000;
      }
      .code-font {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        font-size: 11px;
        fill: #000000;
      }
      .body-text {
        font-size: 11px;
        fill: #000000;
      }
      .arrow-label {
        font-size: 11px;
        font-weight: bold;
        fill: #000000;
      }
      .arrow-sub {
        font-size: 10px;
        font-style: italic;
        fill: #000000;
      }
      .flow-step-title {
        font-size: 12px;
        font-weight: bold;
        fill: #000000;
      }
      .flow-step-sub {
        font-size: 11px;
        font-style: italic;
        fill: #000000;
      }
    </style>
    <marker id="arr-black" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

<rect width="100%" height="100%" fill="#ffffff" />

  <!-- Lifeline Header: Client (Curl) -->
  <rect x="35" y="20" width="190" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
  <text x="130" y="42" text-anchor="middle" class="section-heading">Client (Curl)</text>
  <text x="130" y="57" text-anchor="middle" class="subtitle-text">HTTP Caller</text>
  <line x1="130" y1="68" x2="130" y2="630" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Lifeline Header: Flask API (:5000) -->
  <rect x="295" y="20" width="190" height="48" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.8" />
  <text x="390" y="42" text-anchor="middle" class="section-heading">Flask API (:5000)</text>
  <text x="390" y="57" text-anchor="middle" class="subtitle-text">Producer Service</text>
  <line x1="390" y1="68" x2="390" y2="630" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Lifeline Header: Redis (DB 0 & DB 1) -->
  <rect x="555" y="20" width="190" height="48" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.8" />
  <text x="650" y="42" text-anchor="middle" class="section-heading">Redis (DB 0 &amp; DB 1)</text>
  <text x="650" y="57" text-anchor="middle" class="subtitle-text">Broker &amp; Result Store</text>
  <line x1="650" y1="68" x2="650" y2="630" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Lifeline Header: Celery Pool (x4) -->
  <rect x="805" y="20" width="190" height="48" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8" />
  <text x="900" y="42" text-anchor="middle" class="section-heading">Celery Pool (x4)</text>
  <text x="900" y="57" text-anchor="middle" class="subtitle-text">Concurrent Workers</text>
  <line x1="900" y1="68" x2="900" y2="630" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Message Step -->
  <line x1="130" y1="125" x2="388" y2="125" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="260" y="97" text-anchor="middle" class="flow-step-title">1. POST /tasks {"duration": 10}</text>

  <text x="260" y="113" text-anchor="middle" class="flow-step-sub">(Client submits long-running task request)</text>

  <!-- Message Step -->
  <line x1="390" y1="205" x2="648" y2="205" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="520" y="177" text-anchor="middle" class="flow-step-title">2. long_running_task.delay(10)</text>

  <text x="520" y="193" text-anchor="middle" class="flow-step-sub">(Flask dispatches job to Redis DB 0)</text>

  <!-- Message Step -->
  <line x1="390" y1="285" x2="132" y2="285" stroke="#000000" stroke-width="1.8" stroke-dasharray="5,5" marker-end="url(#arr-black)" />
  <text x="260" y="257" text-anchor="middle" class="flow-step-title">3. 202 Accepted {"task_id":"uuid"}</text>

  <text x="260" y="273" text-anchor="middle" class="flow-step-sub">(Instant return with status: PENDING)</text>

  <!-- Message Step -->
  <line x1="650" y1="365" x2="898" y2="365" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="775" y="337" text-anchor="middle" class="flow-step-title">4. Worker Slot Dequeue (1 of 4)</text>

  <text x="775" y="353" text-anchor="middle" class="flow-step-sub">(Allocated to available process in concurrency pool)</text>

  <!-- Self Loop -->
  <path d="M 900 433 C 935 433, 935 457, 905 457" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arr-black)" />
  <text x="945" y="443" text-anchor="start" class="flow-step-title">5. On Exception: Retry Backoff</text>

  <text x="945" y="459" text-anchor="start" class="flow-step-sub">retry_backoff=True (max 3 retries)</text>

  <!-- Message Step -->
  <line x1="900" y1="525" x2="652" y2="525" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="775" y="497" text-anchor="middle" class="flow-step-title">6. Save Result (SUCCESS)</text>

  <text x="775" y="513" text-anchor="middle" class="flow-step-sub">(Stores duration &amp; completion payload in DB 1)</text>

  <!-- Message Step -->
  <line x1="130" y1="605" x2="388" y2="605" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="260" y="577" text-anchor="middle" class="flow-step-title">7. GET /tasks/{id} -&gt; SUCCESS</text>

  <text x="260" y="593" text-anchor="middle" class="flow-step-sub">(Client retrieves: "Long-running task completed successfully")</text>
</svg>