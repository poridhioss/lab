<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 650" width="1180" height="650">

  <defs>
    <style>
      text {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        fill: #000000;
      }
      .title-text {
        font-size: 15px;
        font-weight: bold;
        fill: #000000;
      }
      .subtitle-text {
        font-size: 11px;
        font-style: italic;
        fill: #000000;
      }
      .section-heading {
        font-size: 12px;
        font-weight: bold;
        fill: #000000;
      }
      .code-font {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        font-size: 11px;
        fill: #000000;
      }
      .body-text {
        font-size: 11px;
        fill: #000000;
      }
      .arrow-label {
        font-size: 11px;
        font-weight: bold;
        fill: #000000;
      }
      .arrow-sub {
        font-size: 10px;
        font-style: italic;
        fill: #000000;
      }
      .flow-step-title {
        font-size: 12px;
        font-weight: bold;
        fill: #000000;
      }
      .flow-step-sub {
        font-size: 11px;
        font-style: italic;
        fill: #000000;
      }
    </style>
    <marker id="arr-black" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

<rect width="100%" height="100%" fill="#ffffff" />

  <!-- Lifeline Header: Client (Curl) -->
  <rect x="35" y="20" width="190" height="48" rx="6" fill="#fafafa" stroke="#000000" stroke-width="1.5" />
  <text x="130" y="42" text-anchor="middle" class="section-heading">Client (Curl)</text>
  <text x="130" y="57" text-anchor="middle" class="subtitle-text">HTTP Caller</text>
  <line x1="130" y1="68" x2="130" y2="630" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Lifeline Header: Flask API (:5000) -->
  <rect x="295" y="20" width="190" height="48" rx="6" fill="#fafafa" stroke="#000000" stroke-width="1.5" />
  <text x="390" y="42" text-anchor="middle" class="section-heading">Flask API (:5000)</text>
  <text x="390" y="57" text-anchor="middle" class="subtitle-text">Producer Service</text>
  <line x1="390" y1="68" x2="390" y2="630" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Lifeline Header: Redis (DB 0 & DB 1) -->
  <rect x="555" y="20" width="190" height="48" rx="6" fill="#fafafa" stroke="#000000" stroke-width="1.5" />
  <text x="650" y="42" text-anchor="middle" class="section-heading">Redis (DB 0 &amp; DB 1)</text>
  <text x="650" y="57" text-anchor="middle" class="subtitle-text">Broker &amp; Result Store</text>
  <line x1="650" y1="68" x2="650" y2="630" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Lifeline Header: Celery Pool (x4) -->
  <rect x="805" y="20" width="190" height="48" rx="6" fill="#fafafa" stroke="#000000" stroke-width="1.5" />
  <text x="900" y="42" text-anchor="middle" class="section-heading">Celery Pool (x4)</text>
  <text x="900" y="57" text-anchor="middle" class="subtitle-text">Concurrent Workers</text>
  <line x1="900" y1="68" x2="900" y2="630" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,4" />


  <!-- Message Step -->
  <line x1="130" y1="120" x2="388" y2="120" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="260" y="92" text-anchor="middle" class="flow-step-title">1. POST /tasks {"duration": 10}</text>

  <text x="260" y="108" text-anchor="middle" class="flow-step-sub">(Client submits long-running task request)</text>

  <!-- Message Step -->
  <line x1="390" y1="200" x2="648" y2="200" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="520" y="172" text-anchor="middle" class="flow-step-title">2. long_running_task.delay(10)</text>

  <text x="520" y="188" text-anchor="middle" class="flow-step-sub">(Flask dispatches job to Redis DB 0)</text>

  <!-- Message Step -->
  <line x1="390" y1="280" x2="132" y2="280" stroke="#000000" stroke-width="1.8" stroke-dasharray="5,5" marker-end="url(#arr-black)" />
  <text x="260" y="252" text-anchor="middle" class="flow-step-title">3. 202 Accepted {"task_id":"uuid"}</text>

  <text x="260" y="268" text-anchor="middle" class="flow-step-sub">(Instant return with status: PENDING)</text>

  <!-- Message Step -->
  <line x1="650" y1="360" x2="898" y2="360" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="775" y="332" text-anchor="middle" class="flow-step-title">4. Worker Slot Dequeue (1 of 4)</text>

  <text x="775" y="348" text-anchor="middle" class="flow-step-sub">(Allocated to available process in concurrency pool)</text>

  <!-- Self Loop -->
  <path d="M 900 428 C 935 428, 935 452, 905 452" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arr-black)" />
  <text x="945" y="438" text-anchor="start" class="flow-step-title">5. On Exception: Retry Backoff</text>

  <text x="945" y="454" text-anchor="start" class="flow-step-sub">retry_backoff=True (max 3 retries)</text>

  <!-- Message Step -->
  <line x1="900" y1="520" x2="652" y2="520" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="775" y="492" text-anchor="middle" class="flow-step-title">6. Save Result (SUCCESS)</text>

  <text x="775" y="508" text-anchor="middle" class="flow-step-sub">(Stores duration &amp; completion payload in DB 1)</text>

  <!-- Message Step -->
  <line x1="130" y1="600" x2="388" y2="600" stroke="#000000" stroke-width="1.8"  marker-end="url(#arr-black)" />
  <text x="260" y="572" text-anchor="middle" class="flow-step-title">7. GET /tasks/{id} -&gt; SUCCESS</text>

  <text x="260" y="588" text-anchor="middle" class="flow-step-sub">(Client retrieves: "Long-running task completed successfully")</text>
</svg>