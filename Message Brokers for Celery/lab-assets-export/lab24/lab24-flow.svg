<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="100%" height="100%">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 500; fill: #64748b; }
      .actor-title { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .actor-sub { font-size: 10.5px; font-weight: 500; fill: #e2e8f0; }
      .step-num { font-size: 11px; font-weight: 700; fill: #ffffff; }
      .step-title { font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .step-desc { font-size: 11px; font-weight: 400; fill: #334155; }
      .lifeline { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 4; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
  </defs>

  <rect width="1000" height="660" fill="#f8fafc" rx="12" />
  <rect x="1" y="1" width="998" height="658" fill="none" stroke="#e2e8f0" stroke-width="2" rx="11" />

  <!-- Header -->
  <rect x="25" y="20" width="950" height="54" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)" />
  <text x="45" y="44" class="font-sans title">Lab 24: Nginx Reverse Proxy Authentication Lifecycle</text>
  <text x="45" y="62" class="font-sans subtitle">Step-by-step verification of unauthorized denial (401) and authorized proxying (200) to Flower</text>

  <!-- Actors (4) -->
  <g transform="translate(40, 95)">
    <rect width="180" height="48" rx="8" fill="#2563eb" filter="url(#shadow)" />
    <text x="90" y="23" text-anchor="middle" class="font-sans actor-title">Client / Admin</text>
    <text x="90" y="38" text-anchor="middle" class="font-sans actor-sub">Browser / Curl</text>
    <line x1="90" y1="48" x2="90" y2="530" class="lifeline" />
  </g>

  <g transform="translate(280, 95)">
    <rect width="190" height="48" rx="8" fill="#059669" filter="url(#shadow)" />
    <text x="95" y="23" text-anchor="middle" class="font-sans actor-title">Nginx Proxy (Port 80)</text>
    <text x="95" y="38" text-anchor="middle" class="font-sans actor-sub">auth_basic Module</text>
    <line x1="95" y1="48" x2="95" y2="530" class="lifeline" />
  </g>

  <g transform="translate(530, 95)">
    <rect width="190" height="48" rx="8" fill="#d97706" filter="url(#shadow)" />
    <text x="95" y="23" text-anchor="middle" class="font-sans actor-title">Flower (Port 5555)</text>
    <text x="95" y="38" text-anchor="middle" class="font-sans actor-sub">127.0.0.1:5555 (Internal)</text>
    <line x1="95" y1="48" x2="95" y2="530" class="lifeline" />
  </g>

  <g transform="translate(770, 95)">
    <rect width="190" height="48" rx="8" fill="#dc2626" filter="url(#shadow)" />
    <text x="95" y="23" text-anchor="middle" class="font-sans actor-title">RabbitMQ (Broker)</text>
    <text x="95" y="38" text-anchor="middle" class="font-sans actor-sub">127.0.0.1:5672</text>
    <line x1="95" y1="48" x2="95" y2="530" class="lifeline" />
  </g>

  <!-- Step 1: Unauthenticated Request -->
  <g transform="translate(0, 160)">
    <line x1="130" y1="20" x2="375" y2="20" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)" />
    <rect x="180" y="2" width="160" height="34" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="196" cy="19" r="10" fill="#dc2626" />
    <text x="196" y="23" text-anchor="middle" class="font-sans step-num">1</text>
    <text x="214" y="16" class="font-sans step-title" fill="#991b1b">GET / (No Auth)</text>
    <text x="214" y="29" class="font-sans step-desc">curl -I http://localhost</text>
  </g>

  <!-- Step 2: 401 Unauthorized -->
  <g transform="translate(0, 220)">
    <line x1="375" y1="20" x2="130" y2="20" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr-red)" />
    <rect x="180" y="2" width="160" height="34" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="196" cy="19" r="10" fill="#dc2626" />
    <text x="196" y="23" text-anchor="middle" class="font-sans step-num">2</text>
    <text x="214" y="16" class="font-sans step-title" fill="#991b1b">401 Unauthorized</text>
    <text x="214" y="29" class="font-sans step-desc">WWW-Authenticate Challenge</text>
  </g>

  <!-- Step 3: Authenticated Request -->
  <g transform="translate(0, 290)">
    <line x1="130" y1="20" x2="375" y2="20" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)" />
    <rect x="180" y="2" width="160" height="34" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="196" cy="19" r="10" fill="#059669" />
    <text x="196" y="23" text-anchor="middle" class="font-sans step-num">3</text>
    <text x="214" y="16" class="font-sans step-title" fill="#065f46">GET / (With Auth)</text>
    <text x="214" y="29" class="font-sans step-desc">Basic: admin:admin123</text>
  </g>

  <!-- Step 4: Nginx validates against .flower_htpasswd -->
  <g transform="translate(0, 350)">
    <path d="M 375 15 C 420 15, 420 45, 375 45" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)" />
    <rect x="425" y="10" width="160" height="42" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="441" cy="31" r="10" fill="#059669" />
    <text x="441" y="35" text-anchor="middle" class="font-sans step-num">4</text>
    <text x="459" y="25" class="font-sans step-title" fill="#065f46">Verify Hash</text>
    <text x="459" y="40" class="font-sans step-desc">Matches .flower_htpasswd</text>
  </g>

  <!-- Step 5: Nginx proxies to Flower -->
  <g transform="translate(0, 415)">
    <line x1="375" y1="20" x2="625" y2="20" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)" />
    <rect x="440" y="2" width="150" height="34" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="456" cy="19" r="10" fill="#059669" />
    <text x="456" y="23" text-anchor="middle" class="font-sans step-num">5</text>
    <text x="474" y="16" class="font-sans step-title" fill="#065f46">Proxy to Flower</text>
    <text x="474" y="29" class="font-sans step-desc">proxy_pass :5555</text>
  </g>

  <!-- Step 6: 200 OK Returned -->
  <g transform="translate(0, 475)">
    <line x1="375" y1="20" x2="130" y2="20" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)" />
    <rect x="180" y="2" width="160" height="34" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="196" cy="19" r="10" fill="#059669" />
    <text x="196" y="23" text-anchor="middle" class="font-sans step-num">6</text>
    <text x="214" y="16" class="font-sans step-title" fill="#065f46">200 OK Response</text>
    <text x="214" y="29" class="font-sans step-desc">Dashboard HTML delivered</text>
  </g>

  <!-- Footer note -->
  <g transform="translate(40, 545)">
    <rect width="920" height="85" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect width="6" height="85" rx="3" fill="#059669" />
    <text x="24" y="28" class="font-sans step-title">Security Architecture Rule:</text>
    <text x="24" y="48" class="font-sans step-desc">• Flower is bound to localhost (127.0.0.1:5555) without direct exposure to the public network.</text>
    <text x="24" y="66" class="font-sans step-desc">• All public requests must traverse Nginx port 80 and satisfy cryptographic htpasswd verification.</text>
  </g>
</svg>