<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 480" width="1560" height="480">

  <defs>
    <style>
      text {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        fill: #000000;
      }
      .title-text {
        font-size: 15px;
        font-weight: bold;
        fill: #000000;
      }
      .subtitle-text {
        font-size: 11px;
        font-style: italic;
        fill: #000000;
      }
      .section-heading {
        font-size: 12px;
        font-weight: bold;
        fill: #000000;
      }
      .code-font {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        font-size: 11px;
        fill: #000000;
      }
      .body-text {
        font-size: 11px;
        fill: #000000;
      }
      .arrow-label {
        font-size: 11px;
        font-weight: bold;
        fill: #000000;
      }
      .arrow-sub {
        font-size: 10px;
        font-style: italic;
        fill: #000000;
      }
      .flow-step-title {
        font-size: 12px;
        font-weight: bold;
        fill: #000000;
      }
      .flow-step-sub {
        font-size: 11px;
        font-style: italic;
        fill: #000000;
      }
    </style>
    <marker id="arr-black" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Box 1: Remote User / Browser -->
  <g transform="translate(20, 20)">
    <rect width="260" height="440" rx="8" fill="#fafafa" stroke="#000000" stroke-width="2" />
    <rect width="260" height="44" rx="8" fill="#f0f0f0" stroke="#000000" stroke-width="1.5" />
    <rect y="34" width="260" height="10" fill="#f0f0f0" />
    <text x="130" y="24" text-anchor="middle" class="title-text">Remote User / Browser</text>
    <text x="130" y="40" text-anchor="middle" class="subtitle-text">External HTTP Client</text>

    <g transform="translate(15, 60)">
      <rect width="230" height="170" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1" />
      <rect width="230" height="24" rx="6" fill="#f5f5f5" stroke="#333333" stroke-width="1" />
      <text x="10" y="17" class="section-heading">Unauthenticated Access</text>
      <text x="10" y="44" class="code-font">curl -I http://localhost</text>
      <text x="10" y="70" class="body-text">• No credentials provided</text>
      <text x="10" y="92" class="body-text">• Response from Nginx:</text>
      <text x="18" y="112" class="code-font" font-weight="bold">HTTP/1.1 401 Unauthorized</text>
      <text x="10" y="136" class="body-text">• WWW-Authenticate header</text>
      <text x="10" y="156" class="body-text">• Request blocked at edge</text>
    </g>

    <g transform="translate(15, 245)">
      <rect width="230" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1" />
      <rect width="230" height="24" rx="6" fill="#f5f5f5" stroke="#333333" stroke-width="1" />
      <text x="10" y="17" class="section-heading">Authenticated Access</text>
      <text x="10" y="44" class="code-font">curl -u floweradmin http://...</text>
      <text x="10" y="70" class="body-text">• Enter host password</text>
      <text x="10" y="92" class="body-text">• Response from Nginx:</text>
      <text x="18" y="112" class="code-font" font-weight="bold">HTTP/1.1 200 OK</text>
      <text x="10" y="136" class="body-text">• Delivers Flower HTML UI</text>
      <text x="10" y="156" class="body-text">• Secure administrative access</text>
    </g>
  </g>

  <!-- Box 2: Nginx Reverse Proxy -->
  <g transform="translate(420, 20)">
    <rect width="270" height="440" rx="8" fill="#fafafa" stroke="#000000" stroke-width="2" />
    <rect width="270" height="44" rx="8" fill="#f0f0f0" stroke="#000000" stroke-width="1.5" />
    <rect y="34" width="270" height="10" fill="#f0f0f0" />
    <text x="135" y="24" text-anchor="middle" class="title-text">Nginx Reverse Proxy</text>
    <text x="135" y="40" text-anchor="middle" class="subtitle-text">Port 80 (Public Listener)</text>

    <g transform="translate(15, 60)">
      <rect width="240" height="170" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1" />
      <rect width="240" height="24" rx="6" fill="#f5f5f5" stroke="#333333" stroke-width="1" />
      <text x="10" y="17" class="section-heading">HTTP Basic Authentication</text>
      <text x="10" y="44" class="body-text">auth_basic "Flower Auth";</text>
      <text x="10" y="66" class="body-text">auth_basic_user_file</text>
      <text x="18" y="86" class="code-font">/etc/nginx/.flower_htpasswd;</text>
      <text x="10" y="112" class="body-text">• Verifies credentials hash</text>
      <text x="10" y="134" class="body-text">• Prevents public exposure</text>
      <text x="10" y="154" class="body-text">• Native lightweight auth</text>
    </g>

    <g transform="translate(15, 245)">
      <rect width="240" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1" />
      <rect width="240" height="24" rx="6" fill="#f5f5f5" stroke="#333333" stroke-width="1" />
      <text x="10" y="17" class="section-heading">Reverse Proxying</text>
      <text x="10" y="44" class="body-text">proxy_pass http://localhost:5555;</text>
      <text x="10" y="66" class="body-text">• Forwards authenticated traffic</text>
      <text x="10" y="88" class="body-text">• Preserves Host header</text>
      <text x="10" y="110" class="body-text">• Sets X-Real-IP &amp; X-Forwarded-For</text>
      <text x="10" y="132" class="body-text">• Isolates Flower backend</text>
      <text x="10" y="152" class="body-text">• Complete ingress protection</text>
    </g>
  </g>

  <!-- Box 3: Flower Monitoring Dashboard -->
  <g transform="translate(830, 20)">
    <rect width="270" height="440" rx="8" fill="#fafafa" stroke="#000000" stroke-width="2" />
    <rect width="270" height="44" rx="8" fill="#f0f0f0" stroke="#000000" stroke-width="1.5" />
    <rect y="34" width="270" height="10" fill="#f0f0f0" />
    <text x="135" y="24" text-anchor="middle" class="title-text">Flower Dashboard</text>
    <text x="135" y="40" text-anchor="middle" class="subtitle-text">Local Port: 5555 (Internal)</text>

    <g transform="translate(15, 60)">
      <rect width="240" height="170" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1" />
      <rect width="240" height="24" rx="6" fill="#f5f5f5" stroke="#333333" stroke-width="1" />
      <text x="10" y="17" class="section-heading">Localhost Binding</text>
      <text x="10" y="44" class="body-text">• Bound to: 127.0.0.1:5555</text>
      <text x="10" y="66" class="body-text">• No direct public exposure</text>
      <text x="10" y="88" class="body-text">• Renders real-time cluster state</text>
      <text x="10" y="110" class="body-text">• Worker health &amp; task history</text>
      <text x="10" y="132" class="body-text">• Graph &amp; concurrency metrics</text>
      <text x="10" y="152" class="body-text">• Protected behind Nginx proxy</text>
    </g>

    <g transform="translate(15, 245)">
      <rect width="240" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1" />
      <rect width="240" height="24" rx="6" fill="#f5f5f5" stroke="#333333" stroke-width="1" />
      <text x="10" y="17" class="section-heading">Broker Telemetry</text>
      <text x="10" y="44" class="body-text">• Started with broker argument:</text>
      <text x="18" y="64" class="code-font">--broker=amqp://guest:guest@...</text>
      <text x="10" y="88" class="body-text">• Queries RabbitMQ queue state</text>
      <text x="10" y="110" class="body-text">• Monitors worker events in real time</text>
      <text x="10" y="132" class="body-text">• HTML dashboard generation</text>
      <text x="10" y="152" class="body-text">• Zero performance overhead</text>
    </g>
  </g>

  <!-- Box 4: RabbitMQ Message Broker -->
  <g transform="translate(1240, 20)">
    <rect width="270" height="440" rx="8" fill="#fafafa" stroke="#000000" stroke-width="2" />
    <rect width="270" height="44" rx="8" fill="#f0f0f0" stroke="#000000" stroke-width="1.5" />
    <rect y="34" width="270" height="10" fill="#f0f0f0" />
    <text x="135" y="24" text-anchor="middle" class="title-text">RabbitMQ Broker</text>
    <text x="135" y="40" text-anchor="middle" class="subtitle-text">Native Service (:5672)</text>

    <g transform="translate(15, 60)">
      <rect width="240" height="170" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1" />
      <rect width="240" height="24" rx="6" fill="#f5f5f5" stroke="#333333" stroke-width="1" />
      <text x="10" y="17" class="section-heading">Systemd Daemon Service</text>
      <text x="10" y="44" class="body-text">• Package: rabbitmq-server</text>
      <text x="10" y="66" class="body-text">• Managed via systemctl</text>
      <text x="10" y="88" class="body-text">• Port 5672: AMQP message bus</text>
      <text x="10" y="110" class="body-text">• Default credentials: guest / guest</text>
      <text x="10" y="132" class="body-text">• Coordinates distributed task queues</text>
      <text x="10" y="152" class="body-text">• Asynchronous messaging core</text>
    </g>

    <g transform="translate(15, 245)">
      <rect width="240" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1" />
      <rect width="240" height="24" rx="6" fill="#f5f5f5" stroke="#333333" stroke-width="1" />
      <text x="10" y="17" class="section-heading">Queue Inspection API</text>
      <text x="10" y="44" class="body-text">• Ingests task dispatch messages</text>
      <text x="10" y="66" class="body-text">• Emits worker heartbeats</text>
      <text x="10" y="88" class="body-text">• Exposes queue metrics to Flower</text>
      <text x="10" y="110" class="body-text">• High throughput message delivery</text>
      <text x="10" y="132" class="body-text">• Production asynchronous backbone</text>
      <text x="10" y="152" class="body-text">• Persistent queue state</text>
    </g>
  </g>

  <!-- Connectors -->
  <!-- 1. Request (:80) -->
  <line x1="280" y1="140" x2="418" y2="140" stroke="#000000" stroke-width="2" marker-end="url(#arr-black)" />
  <rect x="300" y="118" width="95" height="22" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="0.75" />
  <text x="347" y="133" text-anchor="middle" class="arrow-label">1. Request (:80)</text>

  <!-- 2. proxy_pass (:5555) -->
  <line x1="690" y1="140" x2="828" y2="140" stroke="#000000" stroke-width="2" marker-end="url(#arr-black)" />
  <rect x="710" y="118" width="100" height="22" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="0.75" />
  <text x="760" y="133" text-anchor="middle" class="arrow-label">2. Proxy (:5555)</text>

  <!-- 3. AMQP (:5672) -->
  <line x1="1100" y1="140" x2="1238" y2="140" stroke="#000000" stroke-width="2" marker-end="url(#arr-black)" />
  <rect x="1120" y="118" width="100" height="22" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="0.75" />
  <text x="1170" y="133" text-anchor="middle" class="arrow-label">3. AMQP (:5672)</text>

</svg>