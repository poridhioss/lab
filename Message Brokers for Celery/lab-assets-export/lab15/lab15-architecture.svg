<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" width="1400" height="520">

  <defs>
    <style>
      text {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        fill: #000000;
      }
      .title-text {
        font-size: 20px;
        font-weight: bold;
        fill: #000000;
      }
      .subtitle-text {
        font-size: 15px;
        font-style: italic;
        fill: #000000;
      }
      .section-heading {
        font-size: 17px;
        font-weight: bold;
        fill: #000000;
      }
      .code-font {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        font-size: 15.5px;
        fill: #000000;
      }
      .body-text {
        font-size: 15.5px;
        fill: #000000;
      }
      .arrow-label {
        font-size: 16px;
        font-weight: bold;
        fill: #000000;
      }
      .arrow-sub {
        font-size: 14.5px;
        font-style: italic;
        fill: #000000;
      }
      .flow-step-title {
        font-size: 16.5px;
        font-weight: bold;
        fill: #000000;
      }
      .flow-step-sub {
        font-size: 14.5px;
        font-style: italic;
        fill: #000000;
      }
    </style>
    <marker id="arr-black" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Box 1: Python Client (REPL) -->
  <g transform="translate(30, 20)">
    <rect width="350" height="480" rx="8" fill="#f0f7ff" stroke="#2563eb" stroke-width="2" />

    <rect width="350" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
    <rect y="48" width="350" height="10" fill="#dbeafe" />
    <rect x="14" y="10" width="38" height="38" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" />
    <g transform="translate(19, 15) scale(1.16)">
      <path d="M14.25.18l.9.2.73.26.59.3.45.32.34.34.25.34.16.33.1.3.04.26.02.2-.01.13V8.5l-.05.63-.13.55-.21.46-.26.38-.3.31-.33.25-.35.19-.35.14-.33.1-.3.07-.26.04-.21.02H8.77l-.69.05-.59.14-.5.22-.41.27-.33.32-.27.35-.2.36-.15.37-.1.35-.07.32-.04.27-.02.21v3.06H3.17l-.21-.03-.28-.07-.32-.12-.35-.18-.36-.26-.36-.36-.35-.46-.32-.59-.28-.73-.21-.88-.14-1.05-.05-1.23.06-1.22.16-1.04.24-.87.32-.71.36-.57.4-.44.42-.33.42-.24.4-.16.36-.1.32-.05.24-.01h.16l.06.01h8.16v-.83H6.18l-.01-2.75-.02-.37.05-.34.11-.31.17-.28.25-.26.31-.23.38-.2.44-.18.51-.15.58-.12.64-.1.71-.06.77-.04.84-.02 1.27.05zm-6.3 1.98l-.23.33-.08.41.08.41.23.34.33.22.41.09.41-.09.33-.22.23-.34.08-.41-.08-.41-.23-.33-.33-.22-.41-.09-.41.09zm13.09 3.95l.28.06.32.12.35.18.36.27.36.35.35.47.32.59.28.73.21.88.14 1.04.05 1.23-.06 1.23-.16 1.04-.24.86-.32.71-.36.57-.4.45-.42.33-.42.24-.4.16-.36.09-.32.05-.24.02-.16-.01h-8.22v.82h5.84l.01 2.76.02.36-.05.34-.11.31-.17.29-.25.25-.31.24-.38.2-.44.17-.51.15-.58.13-.64.09-.71.07-.77.04-.84.01-1.27-.04-1.07-.14-.9-.2-.73-.25-.59-.3-.45-.33-.34-.34-.25-.34-.16-.33-.1-.3-.04-.25-.02-.2.01-.13v-5.34l.05-.64.13-.54.21-.46.26-.38.3-.32.33-.24.35-.2.35-.14.33-.1.3-.06.26-.04.21-.02.13-.01h5.84l.69-.05.59-.14.5-.21.41-.28.33-.32.27-.35.2-.36.15-.36.1-.35.07-.32.04-.28.02-.21V6.07h2.09l.14.01zm-6.47 14.25l-.23.33-.08.41.08.41.23.33.33.23.41.08.41-.08.33-.23.23-.33.08-.41-.08-.41-.23-.33-.33-.23-.41-.08-.41.08z" fill="#3776ab" />
    </g>
    <text x="60" y="28" text-anchor="start" class="title-text">Python Client (REPL)</text>
    <text x="60" y="48" text-anchor="start" class="subtitle-text">Interactive Producer (tasks.py)</text>

    <g transform="translate(15, 75)">
      <rect width="320" height="170" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2" />
      <rect width="320" height="32" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">Task Dispatch (Non-Blocking)</text>
      <text x="12" y="60" class="code-font">&gt;&gt;&gt; from tasks import process_task</text>
      <text x="12" y="88" class="code-font">&gt;&gt;&gt; res = process_task.delay("Bayajid")</text>
      <text x="12" y="120" class="body-text">• Returns AsyncResult immediately</text>
      <text x="12" y="148" class="code-font">&gt;&gt;&gt; print(res.id) # Task UUID</text>
    </g>

    <g transform="translate(15, 260)">
      <rect width="320" height="200" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2" />
      <rect width="320" height="32" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">Status &amp; Result Retrieval</text>
      <text x="12" y="60" class="code-font">&gt;&gt;&gt; print(res.status) # SUCCESS</text>
      <text x="12" y="88" class="code-font">&gt;&gt;&gt; print(res.get())</text>
      <text x="12" y="122" class="body-text">"Hello Bayajid, task completed successfully"</text>
      <text x="12" y="175" class="subtitle-text">Client queries Redis DB 1 directly</text>
    </g>
  </g>

  <!-- Forward Arrow 1: Client -> Redis -->
  <rect x="410" y="110" width="85" height="30" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2" />
  <text x="452" y="130" text-anchor="middle" class="arrow-label">1. delay()</text>
  <line x1="380" y1="152" x2="523" y2="152" stroke="#000000" stroke-width="1.8" marker-end="url(#arr-black)" />

  <!-- Backward Arrow 4: Redis -> Client (res.get) -->
  <rect x="405" y="240" width="95" height="30" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2" />
  <text x="452" y="260" text-anchor="middle" class="arrow-label">4. res.get()</text>
  <line x1="525" y1="282" x2="382" y2="282" stroke="#000000" stroke-width="1.8" stroke-dasharray="5,5" marker-end="url(#arr-black)" />

  <!-- Box 2: Redis 7 Container -->
  <g transform="translate(525, 20)">
    <rect width="370" height="480" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />

    <rect width="370" height="58" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
    <rect y="48" width="370" height="10" fill="#fee2e2" />
    <rect x="14" y="10" width="38" height="38" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" />
    <g transform="translate(19, 15) scale(1.16)">
      <path d="M22.71 13.145c-1.66 2.092-3.452 4.483-7.038 4.483-3.203 0-4.397-2.825-4.48-5.12.701 1.484 2.073 2.685 4.214 2.63 4.117-.133 6.94-3.852 6.94-7.239 0-4.05-3.022-6.972-8.268-6.972-3.752 0-8.4 1.428-11.455 3.685C2.59 6.937 3.885 9.958 4.35 9.626c2.648-1.904 4.748-3.13 6.784-3.744C8.12 9.244.886 17.05 0 18.425c.1 1.261 1.66 4.648 2.424 4.648.232 0 .431-.133.664-.365a100.49 100.49 0 0 0 5.54-6.765c.222 3.104 1.748 6.898 6.014 6.898 3.819 0 7.604-2.756 9.33-8.965.2-.764-.73-1.361-1.261-.73zm-4.349-5.013c0 1.959-1.926 2.922-3.685 2.922-.941 0-1.664-.247-2.235-.568 1.051-1.592 2.092-3.225 3.21-4.973 1.972.334 2.71 1.43 2.71 2.619z" fill="#dc2626" />
    </g>
    <text x="60" y="28" text-anchor="start" class="title-text">Redis 7 Container</text>
    <text x="60" y="48" text-anchor="start" class="subtitle-text">Docker Port: 6379:6379</text>

    <g transform="translate(15, 75)">
      <rect width="340" height="170" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2" />
      <rect width="340" height="32" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">Database 0: Message Broker (Queue)</text>
      <text x="12" y="60" class="code-font">URL: redis://localhost:6379/0</text>
      <text x="12" y="88" class="body-text">• Key: "celery" (Task List)</text>
      <text x="12" y="118" class="body-text">• Ingests task message payloads</text>
      <text x="12" y="148" class="body-text">• Atomic BRPOP delivery to worker</text>
    </g>

    <g transform="translate(15, 260)">
      <rect width="340" height="200" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2" />
      <rect width="340" height="32" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">Database 1: Result Backend (States)</text>
      <text x="12" y="60" class="code-font">URL: redis://localhost:6379/1</text>
      <text x="12" y="88" class="body-text">• Key: celery-task-meta-{task_id}</text>
      <text x="12" y="118" class="body-text">• Stores status, result string &amp; traceback</text>
      <text x="12" y="148" class="body-text">• Serves client status and get() calls</text>
      <text x="12" y="180" class="subtitle-text">Isolated metadata storage in DB 1</text>
    </g>
  </g>

  <!-- Forward Arrow 2: Redis -> Worker -->
  <rect x="922" y="110" width="85" height="30" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" />
  <text x="965" y="130" text-anchor="middle" class="arrow-label">2. BRPOP</text>
  <line x1="895" y1="152" x2="1033" y2="152" stroke="#000000" stroke-width="1.8" marker-end="url(#arr-black)" />

  <!-- Backward Arrow 3: Worker -> Redis -->
  <rect x="910" y="240" width="110" height="30" rx="5" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2" />
  <text x="965" y="260" text-anchor="middle" class="arrow-label">3. Store Result</text>
  <line x1="1035" y1="282" x2="897" y2="282" stroke="#000000" stroke-width="1.8" marker-end="url(#arr-black)" />

  <!-- Box 3: Celery Worker -->
  <g transform="translate(1035, 20)">
    <rect width="340" height="480" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" />

    <rect width="340" height="58" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5" />
    <rect y="48" width="340" height="10" fill="#f3e8ff" />
    <rect x="14" y="10" width="38" height="38" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" />
    <g transform="translate(19, 15) scale(1.16)">
      <path d="M2.303 0A2.298 2.298 0 0 0 0 2.303v19.394A2.298 2.298 0 0 0 2.303 24h19.394A2.298 2.298 0 0 0 24 21.697V2.303A2.298 2.298 0 0 0 21.697 0zm8.177 3.072c4.098 0 7.028 1.438 7.68 1.764l-1.194 2.55c-2.442-1.057-4.993-1.41-5.672-1.41-1.574 0-2.17.922-2.17 1.763v8.494c0 .869.596 1.791 2.17 1.791.679 0 3.23-.38 5.672-1.41l1.194 2.496c-.435.271-3.637 1.818-7.68 1.818-1.112 0-4.64-.244-4.64-4.64V7.713c0-4.397 3.528-4.64 4.64-4.64z" fill="#7c3aed" />
    </g>
    <text x="60" y="28" text-anchor="start" class="title-text">Celery Worker</text>
    <text x="60" y="48" text-anchor="start" class="subtitle-text">Consumer / Execution Daemon</text>

    <g transform="translate(15, 75)">
      <rect width="310" height="170" rx="6" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.2" />
      <rect width="310" height="32" rx="6" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">Task Definition (tasks.py)</text>
      <text x="12" y="60" class="code-font">@app.task</text>
      <text x="12" y="88" class="code-font">def process_task(name):</text>
      <text x="12" y="118" class="code-font">  time.sleep(5) # 5s workload</text>
      <text x="12" y="146" class="code-font">  return f"Hello {name}..."</text>
    </g>

    <g transform="translate(15, 260)">
      <rect width="310" height="200" rx="6" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.2" />
      <rect width="310" height="32" rx="6" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">Worker Daemon Execution</text>
      <text x="12" y="60" class="code-font">celery -A tasks.app worker</text>
      <text x="12" y="90" class="body-text">• Pulls pending jobs from DB 0</text>
      <text x="12" y="120" class="body-text">• Executes 5s simulated workload</text>
      <text x="12" y="150" class="body-text">• Writes SUCCESS result to DB 1</text>
      <text x="12" y="180" class="subtitle-text">Registered task: tasks.process_task</text>
    </g>
  </g>

</svg>