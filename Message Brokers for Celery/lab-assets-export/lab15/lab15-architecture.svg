<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 480" width="1320" height="480">

  <defs>
    <style>
      text {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        fill: #000000;
      }
      .title-text {
        font-size: 17px;
        font-weight: bold;
        fill: #000000;
      }
      .subtitle-text {
        font-size: 13px;
        font-style: italic;
        fill: #000000;
      }
      .section-heading {
        font-size: 14.5px;
        font-weight: bold;
        fill: #000000;
      }
      .code-font {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        font-size: 13px;
        fill: #000000;
      }
      .body-text {
        font-size: 13px;
        fill: #000000;
      }
      .arrow-label {
        font-size: 13px;
        font-weight: bold;
        fill: #000000;
      }
      .arrow-sub {
        font-size: 12px;
        font-style: italic;
        fill: #000000;
      }
      .flow-step-title {
        font-size: 13.5px;
        font-weight: bold;
        fill: #000000;
      }
      .flow-step-sub {
        font-size: 12px;
        font-style: italic;
        fill: #000000;
      }
    </style>
    <marker id="arr-black" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Box 1: Python Client (REPL) (Blue) -->
  <g transform="translate(20, 20)">
    <rect width="310" height="440" rx="8" fill="#f0f7ff" stroke="#2563eb" stroke-width="2" />
    <rect width="310" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
    <rect y="36" width="310" height="10" fill="#dbeafe" />
    <text x="155" y="26" text-anchor="middle" class="title-text">Python Client (REPL)</text>
    <text x="155" y="42" text-anchor="middle" class="subtitle-text">Interactive Producer / Caller</text>

    <g transform="translate(15, 65)">
      <rect width="280" height="150" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2" />
      <rect width="280" height="28" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
      <text x="12" y="19" class="section-heading">Task Dispatch (Non-Blocking)</text>
      <text x="12" y="52" class="code-font">&gt;&gt;&gt; from tasks import process_task</text>
      <text x="12" y="78" class="code-font">&gt;&gt;&gt; res = process_task.delay("Bayajid")</text>
      <text x="12" y="106" class="body-text">• Returns AsyncResult immediately</text>
      <text x="12" y="130" class="code-font">&gt;&gt;&gt; print(res.id) # Task UUID</text>
    </g>

    <g transform="translate(15, 235)">
      <rect width="280" height="175" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2" />
      <rect width="280" height="28" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
      <text x="12" y="19" class="section-heading">Status &amp; Result Retrieval</text>
      <text x="12" y="52" class="code-font">&gt;&gt;&gt; print(res.status) # SUCCESS</text>
      <text x="12" y="78" class="code-font">&gt;&gt;&gt; print(res.get())</text>
      <text x="12" y="108" class="code-font">"Hello Bayajid, task completed</text>
      <text x="12" y="128" class="code-font">successfully"</text>
      <text x="12" y="160" class="subtitle-text">Client queries Redis DB 1 directly</text>
    </g>
  </g>

  <!-- Box 2: Redis 7 Container (Red) -->
  <g transform="translate(480, 20)">
    <rect width="360" height="440" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="2" />
    <rect width="360" height="46" rx="8" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5" />
    <rect y="36" width="360" height="10" fill="#ffe4e6" />
    <text x="180" y="26" text-anchor="middle" class="title-text">Redis 7 Container</text>
    <text x="180" y="42" text-anchor="middle" class="subtitle-text">Docker Port: 6379:6379</text>

    <g transform="translate(15, 65)">
      <rect width="330" height="150" rx="6" fill="#ffffff" stroke="#fda4af" stroke-width="1.2" />
      <rect width="330" height="28" rx="6" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2" />
      <text x="12" y="19" class="section-heading">Database 0: Message Broker (Queue)</text>
      <text x="12" y="52" class="code-font">URL: redis://localhost:6379/0</text>
      <text x="12" y="78" class="code-font">• Key: "celery" (Task List)</text>
      <text x="12" y="106" class="body-text">• Ingests task message payloads</text>
      <text x="12" y="130" class="body-text">• Atomic BRPOP delivery to worker</text>
    </g>

    <g transform="translate(15, 235)">
      <rect width="330" height="175" rx="6" fill="#ffffff" stroke="#fda4af" stroke-width="1.2" />
      <rect width="330" height="28" rx="6" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2" />
      <text x="12" y="19" class="section-heading">Database 1: Result Backend (States)</text>
      <text x="12" y="52" class="code-font">URL: redis://localhost:6379/1</text>
      <text x="12" y="78" class="code-font">• Key: celery-task-meta-{task_id}</text>
      <text x="12" y="106" class="body-text">• Stores status, result string &amp; traceback</text>
      <text x="12" y="132" class="body-text">• Serves client status and get() calls</text>
      <text x="12" y="160" class="subtitle-text">Isolated metadata storage in DB 1</text>
    </g>
  </g>

  <!-- Box 3: Celery Worker (Purple) -->
  <g transform="translate(980, 20)">
    <rect width="320" height="440" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" />
    <rect width="320" height="46" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" />
    <rect y="36" width="320" height="10" fill="#ede9fe" />
    <text x="160" y="26" text-anchor="middle" class="title-text">Celery Worker</text>
    <text x="160" y="42" text-anchor="middle" class="subtitle-text">Consumer / Execution Daemon</text>

    <g transform="translate(15, 65)">
      <rect width="290" height="150" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2" />
      <rect width="290" height="28" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2" />
      <text x="12" y="19" class="section-heading">Task Definition (tasks.py)</text>
      <text x="12" y="52" class="code-font">@app.task</text>
      <text x="12" y="74" class="code-font">def process_task(name):</text>
      <text x="20" y="100" class="code-font">time.sleep(5) # 5s workload</text>
      <text x="20" y="124" class="code-font">return f"Hello {name}..."</text>
    </g>

    <g transform="translate(15, 235)">
      <rect width="290" height="175" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2" />
      <rect width="290" height="28" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2" />
      <text x="12" y="19" class="section-heading">Worker Daemon Execution</text>
      <text x="12" y="52" class="code-font">celery -A tasks.app worker</text>
      <text x="12" y="78" class="body-text">• Pulls pending jobs from DB 0</text>
      <text x="12" y="106" class="body-text">• Executes 5s simulated workload</text>
      <text x="12" y="132" class="body-text">• Writes SUCCESS result to DB 1</text>
      <text x="12" y="160" class="subtitle-text">Registered task: tasks.process_task</text>
    </g>
  </g>

  <!-- Connectors (Badges strictly ABOVE lines!) -->
  <!-- 1. delay() -->
  <rect x="350" y="112" width="105" height="26" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" />
  <text x="402" y="130" text-anchor="middle" class="arrow-label">1. delay()</text>
  <line x1="330" y1="150" x2="478" y2="150" stroke="#000000" stroke-width="2" marker-end="url(#arr-black)" />

  <!-- 2. BRPOP -->
  <rect x="860" y="112" width="100" height="26" rx="4" fill="#ffffff" stroke="#e11d48" stroke-width="1.2" />
  <text x="910" y="130" text-anchor="middle" class="arrow-label">2. BRPOP</text>
  <line x1="840" y1="150" x2="978" y2="150" stroke="#000000" stroke-width="2" marker-end="url(#arr-black)" />

  <!-- 3. Store Result -->
  <rect x="850" y="292" width="115" height="26" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" />
  <text x="907" y="310" text-anchor="middle" class="arrow-label">3. Store Result</text>
  <line x1="980" y1="330" x2="842" y2="330" stroke="#000000" stroke-width="2" marker-end="url(#arr-black)" />

  <!-- 4. get() -->
  <rect x="350" y="292" width="105" height="26" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" />
  <text x="402" y="310" text-anchor="middle" class="arrow-label">4. res.get()</text>
  <line x1="330" y1="330" x2="478" y2="330" stroke="#000000" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arr-black)" />

</svg>