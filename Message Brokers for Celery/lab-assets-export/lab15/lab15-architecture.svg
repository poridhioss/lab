<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="100%" height="100%">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 500; fill: #64748b; }
      .box-title { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .box-desc { font-size: 12px; font-weight: 400; fill: #475569; }
      .badge-text { font-size: 11px; font-weight: 600; }
      .label-text { font-size: 12px; font-weight: 600; fill: #334155; }
      .code-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #0f172a; }
    </style>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <filter id="subtle-shadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
    </marker>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1100" height="560" fill="#f8fafc" rx="12" />
  <rect x="1" y="1" width="1098" height="558" fill="none" stroke="#e2e8f0" stroke-width="2" rx="11" />

  <!-- Top Title Bar -->
  <rect x="30" y="24" width="1040" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#subtle-shadow)" />
  <circle cx="58" cy="54" r="16" fill="#eff6ff" />
  <path d="M51 54 L56 59 L66 49" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="86" y="48" class="font-sans title">Lab 15: Celery Asynchronous Processing Architecture with Redis</text>
  <text x="86" y="68" class="font-sans subtitle">Single-Worker Celery Pipeline with Redis as Message Broker (DB 0) and Result Backend (DB 1)</text>

  <!-- Component 1: Python Client / REPL -->
  <g transform="translate(40, 115)">
    <rect width="280" height="390" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)" />
    <!-- Header -->
    <rect width="280" height="46" rx="10" fill="#eff6ff" />
    <rect y="36" width="280" height="10" fill="#eff6ff" />
    <line x1="0" y1="46" x2="280" y2="46" stroke="#bfdbfe" stroke-width="1" />
    <rect x="14" y="12" width="70" height="22" rx="4" fill="#2563eb" />
    <text x="49" y="27" text-anchor="middle" class="font-sans badge-text" fill="#ffffff">PRODUCER</text>
    <text x="94" y="28" class="font-sans box-title" fill="#1e40af">Python Client</text>

    <!-- Content -->
    <text x="16" y="72" class="font-sans label-text">Interactive REPL / Script</text>
    <text x="16" y="90" class="font-sans box-desc">Triggers background tasks &amp; queries results</text>

    <!-- Code Card 1: Submit -->
    <rect x="14" y="105" width="252" height="115" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <rect x="14" y="105" width="252" height="24" rx="6" fill="#e2e8f0" />
    <rect y="123" width="252" height="6" fill="#e2e8f0" />
    <text x="24" y="121" class="font-sans badge-text" fill="#475569">TASK SUBMISSION</text>
    <text x="24" y="145" class="code-text" fill="#0f172a">&gt;&gt;&gt; from tasks import process_task</text>
    <text x="24" y="165" class="code-text" fill="#2563eb">&gt;&gt;&gt; res = process_task.delay("Bayajid")</text>
    <text x="24" y="185" class="code-text" fill="#64748b"># Returns AsyncResult immediately</text>
    <text x="24" y="205" class="code-text" fill="#0f172a">&gt;&gt;&gt; print(res.id)  # Task UUID</text>

    <!-- Code Card 2: Retrieve -->
    <rect x="14" y="235" width="252" height="110" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <rect x="14" y="235" width="252" height="24" rx="6" fill="#e2e8f0" />
    <rect y="253" width="252" height="6" fill="#e2e8f0" />
    <text x="24" y="251" class="font-sans badge-text" fill="#475569">STATUS &amp; RESULT RETRIEVAL</text>
    <text x="24" y="275" class="code-text" fill="#0f172a">&gt;&gt;&gt; print(res.status)</text>
    <text x="24" y="293" class="code-text" fill="#059669">SUCCESS</text>
    <text x="24" y="313" class="code-text" fill="#0f172a">&gt;&gt;&gt; print(res.get())</text>
    <text x="24" y="331" class="code-text" fill="#059669">"Hello Bayajid, task completed..."</text>

    <!-- Bottom note -->
    <rect x="14" y="355" width="252" height="24" rx="4" fill="#f1f5f9" />
    <text x="140" y="371" text-anchor="middle" class="font-sans badge-text" fill="#64748b">Non-blocking caller execution</text>
  </g>

  <!-- Component 2: Redis Docker Container -->
  <g transform="translate(390, 115)">
    <!-- Container Outline (Docker Host representation) -->
    <rect width="320" height="390" rx="10" fill="#ffffff" stroke="#f87171" stroke-width="1.5" filter="url(#card-shadow)" />
    
    <!-- Header -->
    <rect width="320" height="46" rx="10" fill="#fef2f2" />
    <rect y="36" width="320" height="10" fill="#fef2f2" />
    <line x1="0" y1="46" x2="320" y2="46" stroke="#fecaca" stroke-width="1" />
    <rect x="14" y="12" width="105" height="22" rx="4" fill="#dc2626" />
    <text x="66" y="27" text-anchor="middle" class="font-sans badge-text" fill="#ffffff">DOCKER SERVICE</text>
    <text x="128" y="28" class="font-sans box-title" fill="#991b1b">Redis 7 In-Memory Store</text>

    <!-- Subheader Info -->
    <rect x="14" y="58" width="292" height="30" rx="4" fill="#fff1f2" stroke="#ffe4e6" stroke-width="1" />
    <text x="24" y="78" class="font-sans code-text" fill="#991b1b">docker: redis:7 | Port: 6379:6379</text>

    <!-- Sub-box 1: Database 0 - Message Broker -->
    <rect x="14" y="98" width="292" height="125" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <rect x="14" y="98" width="292" height="26" rx="8" fill="#e2e8f0" />
    <rect y="116" width="292" height="8" fill="#e2e8f0" />
    <text x="24" y="116" class="font-sans badge-text" fill="#1e293b">DB 0 : MESSAGE BROKER (Task Queue)</text>
    <text x="24" y="142" class="font-sans box-desc" font-weight="600">URL: <tspan font-family="monospace">redis://localhost:6379/0</tspan></text>
    <text x="24" y="162" class="font-sans box-desc">• Receives task payloads from Client</text>
    <text x="24" y="180" class="font-sans box-desc">• Queues tasks in Celery list key (<tspan font-family="monospace">celery</tspan>)</text>
    <text x="24" y="198" class="font-sans box-desc">• Worker consumes via atomic BRPOP</text>

    <!-- Sub-box 2: Database 1 - Result Backend -->
    <rect x="14" y="235" width="292" height="135" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <rect x="14" y="235" width="292" height="26" rx="8" fill="#e2e8f0" />
    <rect y="253" width="292" height="8" fill="#e2e8f0" />
    <text x="24" y="253" class="font-sans badge-text" fill="#1e293b">DB 1 : RESULT BACKEND (Task States)</text>
    <text x="24" y="279" class="font-sans box-desc" font-weight="600">URL: <tspan font-family="monospace">redis://localhost:6379/1</tspan></text>
    <text x="24" y="299" class="font-sans box-desc">• Key: <tspan font-family="monospace">celery-task-meta-{task_id}</tspan></text>
    <text x="24" y="317" class="font-sans box-desc">• Value: JSON {"status":"SUCCESS", "result":...}</text>
    <text x="24" y="335" class="font-sans box-desc">• Serves client status checks &amp; return data</text>
    <text x="24" y="353" class="font-sans box-desc">• Enables asynchronous decoupled polling</text>
  </g>

  <!-- Component 3: Celery Worker -->
  <g transform="translate(780, 115)">
    <rect width="280" height="390" rx="10" fill="#ffffff" stroke="#c084fc" stroke-width="1.5" filter="url(#card-shadow)" />
    <!-- Header -->
    <rect width="280" height="46" rx="10" fill="#faf5ff" />
    <rect y="36" width="280" height="10" fill="#faf5ff" />
    <line x1="0" y1="46" x2="280" y2="46" stroke="#e9d5ff" stroke-width="1" />
    <rect x="14" y="12" width="75" height="22" rx="4" fill="#7c3aed" />
    <text x="51" y="27" text-anchor="middle" class="font-sans badge-text" fill="#ffffff">CONSUMER</text>
    <text x="98" y="28" class="font-sans box-title" fill="#581c87">Celery Worker</text>

    <!-- Content -->
    <text x="16" y="72" class="font-sans label-text">Background Daemon Process</text>
    <text x="16" y="90" class="font-sans box-desc">celery -A tasks.app worker --loglevel=info</text>

    <!-- Task Spec Card -->
    <rect x="14" y="105" width="252" height="160" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <rect x="14" y="105" width="252" height="24" rx="6" fill="#e2e8f0" />
    <rect y="123" width="252" height="6" fill="#e2e8f0" />
    <text x="24" y="121" class="font-sans badge-text" fill="#475569">TASK EXECUTION ENGINE</text>
    <text x="24" y="145" class="code-text" fill="#7c3aed">@app.task</text>
    <text x="24" y="163" class="code-text" fill="#0f172a">def process_task(name):</text>
    <text x="36" y="181" class="code-text" fill="#475569">print("Processing task...")</text>
    <text x="36" y="199" class="code-text" fill="#d97706">time.sleep(5)  # 5s delay</text>
    <text x="36" y="217" class="code-text" fill="#475569">print("Task completed")</text>
    <text x="36" y="235" class="code-text" fill="#059669">return f"Hello {name}..."</text>
    <text x="24" y="255" class="font-sans box-desc" fill="#64748b">• Registered as: tasks.process_task</text>

    <!-- Worker lifecycle card -->
    <rect x="14" y="280" width="252" height="95" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <rect x="14" y="280" width="252" height="24" rx="6" fill="#e2e8f0" />
    <rect y="298" width="252" height="6" fill="#e2e8f0" />
    <text x="24" y="296" class="font-sans badge-text" fill="#475569">WORKER CHARACTERISTICS</text>
    <text x="24" y="320" class="font-sans box-desc">• Long-lived persistent daemon process</text>
    <text x="24" y="338" class="font-sans box-desc">• Concurrency pool handles pending jobs</text>
    <text x="24" y="356" class="font-sans box-desc">• Auto-acknowledges on successful return</text>
  </g>

  <!-- Connectors & Arrows -->
  <!-- 1. Submit task (Client -> Redis DB 0) -->
  <path d="M 320 220 L 390 220" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)" />
  <rect x="325" y="198" width="60" height="18" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
  <text x="355" y="211" text-anchor="middle" class="font-sans badge-text" fill="#2563eb">1. delay()</text>

  <!-- 2. Worker fetches task (Redis DB 0 -> Worker) -->
  <path d="M 710 220 L 780 220" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-purple)" />
  <rect x="715" y="198" width="60" height="18" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1" />
  <text x="745" y="211" text-anchor="middle" class="font-sans badge-text" fill="#7c3aed">2. BRPOP</text>

  <!-- 3. Worker saves result (Worker -> Redis DB 1) -->
  <path d="M 780 390 L 710 390" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-emerald)" />
  <rect x="715" y="368" width="60" height="18" rx="3" fill="#ffffff" stroke="#059669" stroke-width="1" />
  <text x="745" y="381" text-anchor="middle" class="font-sans badge-text" fill="#059669">3. Store</text>

  <!-- 4. Client reads result (Client -> Redis DB 1) -->
  <path d="M 320 390 L 390 390" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrow-emerald)" />
  <rect x="325" y="368" width="60" height="18" rx="3" fill="#ffffff" stroke="#059669" stroke-width="1" />
  <text x="355" y="381" text-anchor="middle" class="font-sans badge-text" fill="#059669">4. get()</text>

  <!-- Footer Legend -->
  <rect x="40" y="515" width="1020" height="30" rx="6" fill="#f1f5f9" />
  <circle cx="65" cy="530" r="5" fill="#2563eb" />
  <text x="78" y="534" class="font-sans box-desc">Blue: Task Dispatch Path (DB 0)</text>
  <circle cx="285" cy="530" r="5" fill="#7c3aed" />
  <text x="298" y="534" class="font-sans box-desc">Purple: Worker Task Consumption</text>
  <circle cx="515" cy="530" r="5" fill="#059669" />
  <text x="528" y="534" class="font-sans box-desc">Green: Result Storage &amp; Status Polling Path (DB 1)</text>
  <text x="1040" y="534" text-anchor="end" class="font-sans badge-text" fill="#64748b">Poridhi Labs • Celery + Redis Architecture</text>
</svg>