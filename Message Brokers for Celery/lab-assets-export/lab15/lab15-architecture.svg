<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 480" width="1300" height="480">

  <defs>
    <style>
      text {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        fill: #000000;
      }
      .title-text {
        font-size: 15px;
        font-weight: bold;
        fill: #000000;
      }
      .subtitle-text {
        font-size: 11px;
        font-style: italic;
        fill: #000000;
      }
      .section-heading {
        font-size: 12px;
        font-weight: bold;
        fill: #000000;
      }
      .code-font {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        font-size: 11px;
        fill: #000000;
      }
      .body-text {
        font-size: 11px;
        fill: #000000;
      }
      .arrow-label {
        font-size: 11px;
        font-weight: bold;
        fill: #000000;
      }
      .arrow-sub {
        font-size: 10px;
        font-style: italic;
        fill: #000000;
      }
      .flow-step-title {
        font-size: 12px;
        font-weight: bold;
        fill: #000000;
      }
      .flow-step-sub {
        font-size: 11px;
        font-style: italic;
        fill: #000000;
      }
    </style>
    <marker id="arr-black" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Box 1: Python Client (REPL) -->
  <g transform="translate(20, 20)">
    <rect width="300" height="440" rx="8" fill="#fafafa" stroke="#000000" stroke-width="2" />
    <rect width="300" height="44" rx="8" fill="#f0f0f0" stroke="#000000" stroke-width="1.5" />
    <rect y="34" width="300" height="10" fill="#f0f0f0" />
    <text x="150" y="24" text-anchor="middle" class="title-text">Python Client (REPL)</text>
    <text x="150" y="40" text-anchor="middle" class="subtitle-text">Task Producer / Caller</text>

    <g transform="translate(15, 60)">
      <rect width="270" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1" />
      <rect width="270" height="24" rx="6" fill="#f5f5f5" stroke="#333333" stroke-width="1" />
      <text x="10" y="17" class="section-heading">Task Submission</text>
      <text x="10" y="44" class="code-font">&gt;&gt;&gt; from tasks import process_task</text>
      <text x="10" y="66" class="code-font">&gt;&gt;&gt; res = process_task.delay("Bayajid")</text>
      <text x="10" y="92" class="body-text">• Non-blocking asynchronous call</text>
      <text x="10" y="112" class="body-text">• Returns AsyncResult object immediately</text>
      <text x="10" y="134" class="code-font">&gt;&gt;&gt; print(res.id) # Task UUID</text>
    </g>

    <g transform="translate(15, 225)">
      <rect width="270" height="170" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1" />
      <rect width="270" height="24" rx="6" fill="#f5f5f5" stroke="#333333" stroke-width="1" />
      <text x="10" y="17" class="section-heading">Result &amp; Status Query</text>
      <text x="10" y="44" class="code-font">&gt;&gt;&gt; print(res.status)</text>
      <text x="18" y="64" class="code-font" font-weight="bold">SUCCESS</text>
      <text x="10" y="90" class="code-font">&gt;&gt;&gt; print(res.get())</text>
      <text x="18" y="110" class="code-font">"Hello Bayajid, task completed</text>
      <text x="18" y="128" class="code-font">successfully"</text>
    </g>

    <text x="150" y="425" text-anchor="middle" class="subtitle-text">Client Module: tasks.py</text>
  </g>

  <!-- Box 2: Redis 7 Container -->
  <g transform="translate(460, 20)">
    <rect width="360" height="440" rx="8" fill="#fafafa" stroke="#000000" stroke-width="2" />
    <rect width="360" height="44" rx="8" fill="#f0f0f0" stroke="#000000" stroke-width="1.5" />
    <rect y="34" width="360" height="10" fill="#f0f0f0" />
    <text x="180" y="24" text-anchor="middle" class="title-text">Redis 7 Container</text>
    <text x="180" y="40" text-anchor="middle" class="subtitle-text">Docker Port: 6379:6379</text>

    <g transform="translate(15, 60)">
      <rect width="330" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1" />
      <rect width="330" height="24" rx="6" fill="#f5f5f5" stroke="#333333" stroke-width="1" />
      <text x="10" y="17" class="section-heading">Database 0: Message Broker (Queue)</text>
      <text x="10" y="44" class="code-font">URL: redis://localhost:6379/0</text>
      <text x="10" y="68" class="body-text">• Ingests task message payloads</text>
      <text x="10" y="90" class="body-text">• Stores queued tasks in list key: "celery"</text>
      <text x="10" y="112" class="body-text">• Atomically delivers tasks via BRPOP</text>
      <text x="10" y="134" class="body-text">• Decouples caller from worker execution</text>
    </g>

    <g transform="translate(15, 230)">
      <rect width="330" height="175" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1" />
      <rect width="330" height="24" rx="6" fill="#f5f5f5" stroke="#333333" stroke-width="1" />
      <text x="10" y="17" class="section-heading">Database 1: Result Backend (States)</text>
      <text x="10" y="44" class="code-font">URL: redis://localhost:6379/1</text>
      <text x="10" y="68" class="body-text">• Stores task outcomes and return values</text>
      <text x="10" y="90" class="body-text">• Key schema: celery-task-meta-{task_id}</text>
      <text x="10" y="112" class="body-text">• Stores JSON: status, result, traceback</text>
      <text x="10" y="134" class="body-text">• Serves client status polling queries</text>
      <text x="10" y="156" class="body-text">• Retains results for client retrieval</text>
    </g>
  </g>

  <!-- Box 3: Celery Worker -->
  <g transform="translate(960, 20)">
    <rect width="320" height="440" rx="8" fill="#fafafa" stroke="#000000" stroke-width="2" />
    <rect width="320" height="44" rx="8" fill="#f0f0f0" stroke="#000000" stroke-width="1.5" />
    <rect y="34" width="320" height="10" fill="#f0f0f0" />
    <text x="160" y="24" text-anchor="middle" class="title-text">Celery Worker</text>
    <text x="160" y="40" text-anchor="middle" class="subtitle-text">Consumer / Execution Engine</text>

    <g transform="translate(15, 60)">
      <rect width="290" height="175" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1" />
      <rect width="290" height="24" rx="6" fill="#f5f5f5" stroke="#333333" stroke-width="1" />
      <text x="10" y="17" class="section-heading">Task Definition</text>
      <text x="10" y="44" class="code-font">@app.task</text>
      <text x="10" y="64" class="code-font">def process_task(name):</text>
      <text x="18" y="86" class="code-font">print("Processing task...")</text>
      <text x="18" y="106" class="code-font">time.sleep(5) # 5s delay</text>
      <text x="18" y="126" class="code-font">print("Task completed")</text>
      <text x="18" y="146" class="code-font">return f"Hello {name}..."</text>
    </g>

    <g transform="translate(15, 250)">
      <rect width="290" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1" />
      <rect width="290" height="24" rx="6" fill="#f5f5f5" stroke="#333333" stroke-width="1" />
      <text x="10" y="17" class="section-heading">Worker Daemon Process</text>
      <text x="10" y="44" class="code-font">celery -A tasks.app worker</text>
      <text x="10" y="62" class="code-font">--loglevel=info</text>
      <text x="10" y="88" class="body-text">• Pulls pending jobs from DB 0</text>
      <text x="10" y="108" class="body-text">• Runs task in background process</text>
      <text x="10" y="128" class="body-text">• Writes return status to DB 1</text>
    </g>

    <text x="160" y="425" text-anchor="middle" class="subtitle-text">Registered: tasks.process_task</text>
  </g>

  <!-- Connectors -->
  <!-- 1. delay() -->
  <line x1="320" y1="120" x2="458" y2="120" stroke="#000000" stroke-width="2" marker-end="url(#arr-black)" />
  <rect x="355" y="98" width="70" height="22" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="0.75" />
  <text x="390" y="113" text-anchor="middle" class="arrow-label">1. delay()</text>

  <!-- 2. BRPOP -->
  <line x1="820" y1="120" x2="958" y2="120" stroke="#000000" stroke-width="2" marker-end="url(#arr-black)" />
  <rect x="855" y="98" width="70" height="22" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="0.75" />
  <text x="890" y="113" text-anchor="middle" class="arrow-label">2. BRPOP</text>

  <!-- 3. Store Result -->
  <line x1="960" y1="330" x2="822" y2="330" stroke="#000000" stroke-width="2" marker-end="url(#arr-black)" />
  <rect x="845" y="308" width="90" height="22" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="0.75" />
  <text x="890" y="323" text-anchor="middle" class="arrow-label">3. Store Result</text>

  <!-- 4. get() -->
  <line x1="320" y1="330" x2="458" y2="330" stroke="#000000" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arr-black)" />
  <rect x="355" y="308" width="70" height="22" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="0.75" />
  <text x="390" y="323" text-anchor="middle" class="arrow-label">4. get()</text>

</svg>