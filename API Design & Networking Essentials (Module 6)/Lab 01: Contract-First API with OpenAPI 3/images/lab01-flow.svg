<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 420" width="1060" height="420">
  <defs>
    <!-- Draw.io Authentic Drop Shadow Filter -->
    <filter id="dropShadow" x="-12%" y="-12%" width="135%" height="145%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Draw.io Classic Marker Arrowheads -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000" />
    </marker>

    <style>
      text {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        font-weight: bold;
        fill: #000000;
      }
      .banner-title {
        font-size: 19px;
        font-weight: bold;
        fill: #000000;
      }
      .banner-sub {
        font-size: 14px;
        font-weight: bold;
        fill: #333333;
        font-style: italic;
      }
      .flow-title {
        font-size: 14px;
        font-weight: bold;
        fill: #000000;
      }
      .flow-step-num {
        font-size: 11px;
        font-weight: bold;
        fill: #ffffff;
        text-anchor: middle;
      }
      .flow-text {
        font-size: 12.5px;
        font-weight: bold;
        fill: #111111;
      }
      .code-badge {
        font-family: "Courier New", Courier, monospace;
        font-size: 12px;
        font-weight: bold;
      }
      .flow-sub {
        font-size: 11px;
        font-weight: bold;
        fill: #444444;
        font-style: italic;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Outer Frame -->
  <rect x="15" y="15" width="1030" height="390" rx="10" fill="#fafafa" stroke="#000000" stroke-width="1.5" />

  <!-- Header Banner -->
  <g transform="translate(35, 42)">
    <text x="0" y="0" class="banner-title">Lab 01: Request Execution &amp; Pagination Lifecycle Flow</text>
    <text x="0" y="22" class="banner-sub">End-to-End Tracing: Write Mutation • Cursor Pagination Stream • RFC 7807 Error Handling</text>
  </g>

  <!-- Divider Line -->
  <line x1="35" y1="76" x2="1025" y2="76" stroke="#cccccc" stroke-width="1.5" />

  <!-- 3 DRAW.IO FLOW CARDS (Times New Roman Bold) -->

  <!-- CARD 1: WRITE MUTATION FLOW -->
  <g transform="translate(35, 95)">
    <rect x="0" y="0" width="315" height="290" rx="8" fill="#dae8fc" stroke="#000000" stroke-width="1.5" filter="url(#dropShadow)" />
    <!-- Header Box -->
    <rect x="0" y="0" width="315" height="36" rx="8" fill="#cce0ff" stroke="#000000" stroke-width="1.5" />
    <text x="14" y="24" class="flow-title">1. Write Mutation Flow (POST)</text>

    <!-- Subtag -->
    <rect x="14" y="46" width="165" height="20" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="20" y="60" class="code-badge" fill="#1d4ed8">POST /api/v1/orders</text>

    <!-- Step A -->
    <g transform="translate(14, 76)">
      <circle cx="9" cy="9" r="9" fill="#000000" />
      <text x="9" y="13" class="flow-step-num">A</text>
      <text x="26" y="14" class="flow-text">Transmits Idempotency-Key</text>
      <text x="26" y="28" class="flow-sub">Header: UUID v4 token (Required)</text>
      <text x="26" y="41" class="flow-sub">Body: { item_id, quantity, amount }</text>
    </g>

    <!-- Step B -->
    <g transform="translate(14, 130)">
      <circle cx="9" cy="9" r="9" fill="#000000" />
      <text x="9" y="13" class="flow-step-num">B</text>
      <text x="26" y="14" class="flow-text">Contract Schema Validation</text>
      <text x="26" y="28" class="flow-sub">server.js verifies key existence</text>
      <text x="26" y="41" class="flow-sub">Asserts quantity &gt;= 1, amount &gt; 0</text>
    </g>

    <!-- Step C -->
    <g transform="translate(14, 184)">
      <circle cx="9" cy="9" r="9" fill="#000000" />
      <text x="9" y="13" class="flow-step-num">C</text>
      <text x="26" y="14" class="flow-text">Persists &amp; Returns 201 Created</text>
      <text x="26" y="28" class="flow-sub">Appends to ordersDb (ID 126)</text>
      <text x="26" y="41" class="flow-sub">Sets Location: /api/v1/orders/126</text>
    </g>

    <!-- Bottom note -->
    <rect x="14" y="238" width="287" height="38" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="20" y="254" class="flow-sub" fill="#000000">Retrying with same UUID key prevents</text>
    <text x="20" y="268" class="flow-sub" fill="#000000">duplicate order insertion in database.</text>
  </g>

  <!-- CARD 2: CURSOR PAGINATION FLOW -->
  <g transform="translate(372, 95)">
    <rect x="0" y="0" width="315" height="290" rx="8" fill="#d5e8d4" stroke="#000000" stroke-width="1.5" filter="url(#dropShadow)" />
    <!-- Header Box -->
    <rect x="0" y="0" width="315" height="36" rx="8" fill="#c3e6c3" stroke="#000000" stroke-width="1.5" />
    <text x="14" y="24" class="flow-title">2. Cursor Pagination Flow (GET)</text>

    <!-- Subtag -->
    <rect x="14" y="46" width="160" height="20" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="20" y="60" class="code-badge" fill="#15803d">GET /api/v1/orders</text>

    <!-- Step A -->
    <g transform="translate(14, 76)">
      <circle cx="9" cy="9" r="9" fill="#000000" />
      <text x="9" y="13" class="flow-step-num">A</text>
      <text x="26" y="14" class="flow-text">Passes Cursor &amp; Limit Query</text>
      <text x="26" y="28" class="flow-sub">Query: ?limit=3&amp;cursor=103</text>
      <text x="26" y="41" class="flow-sub">Contract bounds: 1 &lt;= limit &lt;= 50</text>
    </g>

    <!-- Step B -->
    <g transform="translate(14, 130)">
      <circle cx="9" cy="9" r="9" fill="#000000" />
      <text x="9" y="13" class="flow-step-num">B</text>
      <text x="26" y="14" class="flow-text">Sequential Pointer Filter</text>
      <text x="26" y="28" class="flow-sub">Filters records WHERE id &gt; 103</text>
      <text x="26" y="41" class="flow-sub">Slices exactly 3 items: [104, 105, 106]</text>
    </g>

    <!-- Step C -->
    <g transform="translate(14, 184)">
      <circle cx="9" cy="9" r="9" fill="#000000" />
      <text x="9" y="13" class="flow-step-num">C</text>
      <text x="26" y="14" class="flow-text">Returns 200 OK + Metadata</text>
      <text x="26" y="28" class="flow-sub">Sets next_cursor = 106</text>
      <text x="26" y="41" class="flow-sub">Sets has_more = true</text>
    </g>

    <!-- Bottom note -->
    <rect x="14" y="238" width="287" height="38" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="20" y="254" class="flow-sub" fill="#000000">Cursor pointers eliminate duplicate items</text>
    <text x="20" y="268" class="flow-sub" fill="#000000">when new orders arrive concurrently.</text>
  </g>

  <!-- CARD 3: RFC 7807 ERROR FLOW -->
  <g transform="translate(710, 95)">
    <rect x="0" y="0" width="315" height="290" rx="8" fill="#fff2cc" stroke="#000000" stroke-width="1.5" filter="url(#dropShadow)" />
    <!-- Header Box -->
    <rect x="0" y="0" width="315" height="36" rx="8" fill="#ffe599" stroke="#000000" stroke-width="1.5" />
    <text x="14" y="24" class="flow-title">3. RFC 7807 Error Handling</text>

    <!-- Subtag -->
    <rect x="14" y="46" width="180" height="20" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="20" y="60" class="code-badge" fill="#b45309">application/problem+json</text>

    <!-- Step A -->
    <g transform="translate(14, 76)">
      <circle cx="9" cy="9" r="9" fill="#000000" />
      <text x="9" y="13" class="flow-step-num">A</text>
      <text x="26" y="14" class="flow-text">Contract Boundary Breach</text>
      <text x="26" y="28" class="flow-sub">Trigger 1: Omitted Idempotency-Key</text>
      <text x="26" y="41" class="flow-sub">Trigger 2: limit=100 (exceeds max 50)</text>
    </g>

    <!-- Step B -->
    <g transform="translate(14, 130)">
      <circle cx="9" cy="9" r="9" fill="#000000" />
      <text x="9" y="13" class="flow-step-num">B</text>
      <text x="26" y="14" class="flow-text">Standard Problem Format</text>
      <text x="26" y="28" class="flow-sub">type: uri, title: string</text>
      <text x="26" y="41" class="flow-sub">status: 400, instance: /api/v1/orders</text>
    </g>

    <!-- Step C -->
    <g transform="translate(14, 184)">
      <circle cx="9" cy="9" r="9" fill="#000000" />
      <text x="9" y="13" class="flow-step-num">C</text>
      <text x="26" y="14" class="flow-text">Deterministic Error Replay</text>
      <text x="26" y="28" class="flow-sub">detail: "The limit parameter must be</text>
      <text x="26" y="41" class="flow-sub">between 1 and 50. Received: 100"</text>
    </g>

    <!-- Bottom note -->
    <rect x="14" y="238" width="287" height="38" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="20" y="254" class="flow-sub" fill="#000000">IETF standard gives frontend predictable</text>
    <text x="20" y="268" class="flow-sub" fill="#000000">error parsing across all API failure modes.</text>
  </g>

</svg>
