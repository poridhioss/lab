      <rect width="250" height="32" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">Edge Guard Rejections</text>
      <text x="12" y="56" class="body-text">• Missing key: 401 Unauthorized</text>
      <text x="12" y="84" class="body-text">• Burst &gt; 10 req/s: 429 Too Many</text>
      <text x="12" y="112" class="body-text">• Zero backend service load</text>
      <text x="12" y="140" class="subtitle-text">Edge gatekeeper protection</text>
    </g>
  </g>

