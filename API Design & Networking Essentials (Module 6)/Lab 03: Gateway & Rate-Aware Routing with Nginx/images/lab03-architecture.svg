      <rect width="250" height="32" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">Authenticated Queries</text>
      <text x="12" y="56" class="code-font" font-weight="bold">X-API-Key: valid-secret-key</text>
      <text x="12" y="84" class="body-text">• GET /api/v1/orders</text>
      <text x="12" y="112" class="body-text">• GET /api/v1/users</text>
      <text x="12" y="140" class="body-text">← 200 OK (Proxied Service)</text>
    </g>

    <g transform="translate(15, 257)">
