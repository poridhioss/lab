      <text x="12" y="56" class="code-font" font-weight="bold">Zone: limit_req_zone</text>
      <text x="12" y="84" class="body-text">• Rate: 10r/s burst=5 nodelay</text>
      <text x="12" y="112" class="body-text">• API Key Auth validation map</text>
      <text x="12" y="140" class="body-text">• Immediate 401 and 429 rejection</text>
    </g>

