      <text x="12" y="22" class="section-heading">Dynamic Route Splitting</text>
      <text x="12" y="56" class="body-text">• /api/v1/orders -&gt; Port 3001</text>
      <text x="12" y="84" class="body-text">• /api/v1/users -&gt; Port 3002</text>
      <text x="12" y="112" class="body-text">• Preserves X-Forwarded-For</text>
      <text x="12" y="140" class="subtitle-text">High-throughput reverse proxy</text>
    </g>
  </g>

