  <!-- Step 1: GET /api/v1/orders (X-API-Key: valid) -->
  <text x="360" y="110" text-anchor="middle" class="flow-step-title">1. GET /api/v1/orders (X-API-Key: valid)</text>
  <text x="360" y="125" text-anchor="middle" class="flow-step-sub">Client calls Orders endpoint via port 80</text>
  <line x1="150" y1="130" x2="565" y2="130" stroke="#000000" stroke-width="1.8" marker-end="url(#arr-black)" />

  <!-- Step 2: proxy_pass http://orders_service:3001 -->
  <text x="790" y="160" text-anchor="middle" class="flow-step-title">2. proxy_pass http://orders_service:3001</text>
  <text x="790" y="175" text-anchor="middle" class="flow-step-sub">Gateway validates API key and forwards to Orders Service</text>
  <line x1="570" y1="180" x2="1005" y2="180" stroke="#000000" stroke-width="1.8" marker-end="url(#arr-black)" />

  <!-- Step 3: 200 OK [{&quot;id&quot;: 1, &quot;item&quot;: &quot;Laptop&quot;}] -->
  <text x="790" y="210" text-anchor="middle" class="flow-step-title">3. 200 OK [{&quot;id&quot;: 1, &quot;item&quot;: &quot;Laptop&quot;}]</text>
  <text x="790" y="225" text-anchor="middle" class="flow-step-sub">Orders service returns JSON payload</text>
  <line x1="1010" y1="230" x2="575" y2="230" stroke="#000000" stroke-width="1.8" stroke-dasharray="5,5" marker-end="url(#arr-black)" />

  <!-- Step 4: 200 OK (Proxied Response) -->
  <text x="360" y="260" text-anchor="middle" class="flow-step-title">4. 200 OK (Proxied Response)</text>
  <text x="360" y="275" text-anchor="middle" class="flow-step-sub">Gateway returns response to client</text>
  <line x1="570" y1="280" x2="155" y2="280" stroke="#000000" stroke-width="1.8" stroke-dasharray="5,5" marker-end="url(#arr-black)" />

  <!-- Step 5: GET /api/v1/users (X-API-Key: valid) -->
  <text x="360" y="320" text-anchor="middle" class="flow-step-title">5. GET /api/v1/users (X-API-Key: valid)</text>
  <text x="360" y="335" text-anchor="middle" class="flow-step-sub">Client calls Users endpoint via port 80</text>
  <line x1="150" y1="340" x2="565" y2="340" stroke="#000000" stroke-width="1.8" marker-end="url(#arr-black)" />

  <!-- Step 6: proxy_pass http://users_service:3002 -->
  <text x="1000" y="370" text-anchor="middle" class="flow-step-title">6. proxy_pass http://users_service:3002</text>
  <text x="1000" y="385" text-anchor="middle" class="flow-step-sub">Gateway routes request to Users Service</text>
  <line x1="570" y1="390" x2="1425" y2="390" stroke="#000000" stroke-width="1.8" marker-end="url(#arr-black)" />

  <!-- Step 7: 200 OK [{&quot;id&quot;: 10, &quot;name&quot;: &quot;Alice&quot;}] -->
  <text x="1000" y="420" text-anchor="middle" class="flow-step-title">7. 200 OK [{&quot;id&quot;: 10, &quot;name&quot;: &quot;Alice&quot;}]</text>
  <text x="1000" y="435" text-anchor="middle" class="flow-step-sub">Users service responds to Gateway</text>
  <line x1="1430" y1="440" x2="575" y2="440" stroke="#000000" stroke-width="1.8" stroke-dasharray="5,5" marker-end="url(#arr-black)" />

  <!-- Step 8: 200 OK (Proxied User Response) -->
  <text x="360" y="470" text-anchor="middle" class="flow-step-title">8. 200 OK (Proxied User Response)</text>
  <text x="360" y="485" text-anchor="middle" class="flow-step-sub">Gateway forwards response to client</text>
  <line x1="570" y1="490" x2="155" y2="490" stroke="#000000" stroke-width="1.8" stroke-dasharray="5,5" marker-end="url(#arr-black)" />

  <!-- Step 9: GET /api/v1/orders (Missing / Invalid Key) -->
  <text x="360" y="525" text-anchor="middle" class="flow-step-title">9. GET /api/v1/orders (Missing / Invalid Key)</text>
  <text x="360" y="540" text-anchor="middle" class="flow-step-sub">Unauthenticated request intercepted at edge</text>
  <line x1="150" y1="545" x2="565" y2="545" stroke="#000000" stroke-width="1.8" marker-end="url(#arr-black)" />

  <!-- Step 10: 401 Unauthorized / 429 Too Many Requests -->
  <text x="360" y="565" text-anchor="middle" class="flow-step-title">10. 401 Unauthorized / 429 Too Many Requests</text>
  <text x="360" y="580" text-anchor="middle" class="flow-step-sub">Gateway rejects request immediately without touching services</text>
  <line x1="570" y1="585" x2="155" y2="585" stroke="#000000" stroke-width="1.8" stroke-dasharray="5,5" marker-end="url(#arr-black)" />
</svg>