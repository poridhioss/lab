<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 420" width="1060" height="420">
  <defs>
    <filter id="dropShadow" x="-12%" y="-12%" width="135%" height="145%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <style>
      text {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        font-weight: bold;
        fill: #000000;
      }
      .banner-title { font-size: 19px; font-weight: bold; fill: #000000; }
      .banner-sub { font-size: 14px; font-weight: bold; fill: #333333; font-style: italic; }
      .flow-title { font-size: 14px; font-weight: bold; fill: #000000; }
      .flow-step-num { font-size: 11px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .flow-text { font-size: 12.5px; font-weight: bold; fill: #111111; }
      .code-badge { font-family: "Courier New", Courier, monospace; font-size: 12px; font-weight: bold; }
      .flow-sub { font-size: 11px; font-weight: bold; fill: #444444; font-style: italic; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />
  <rect x="15" y="15" width="1030" height="390" rx="10" fill="#fafafa" stroke="#000000" stroke-width="1.5" />

  <g transform="translate(35, 42)">
    <text x="0" y="0" class="banner-title">Lab 04: End-to-End Execution &amp; Retry Lifecycle Flow</text>
    <text x="0" y="22" class="banner-sub">End-to-End Tracing: Ingress Mutation • Idempotent Retry Replay • Layered Defense Drops</text>
  </g>

  <line x1="35" y1="76" x2="1025" y2="76" stroke="#cccccc" stroke-width="1.5" />

  <!-- CARD 1: LAYERED WRITE MUTATION -->
  <g transform="translate(35, 95)">
    <rect x="0" y="0" width="315" height="290" rx="8" fill="#dae8fc" stroke="#000000" stroke-width="1.5" filter="url(#dropShadow)" />
    <rect x="0" y="0" width="315" height="36" rx="8" fill="#cce0ff" stroke="#000000" stroke-width="1.5" />
    <text x="14" y="24" class="flow-title">1. Layered Write Mutation (POST)</text>

    <rect x="14" y="46" width="145" height="20" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="20" y="60" class="code-badge" fill="#1d4ed8">X-Cache: MISS (201)</text>

    <g transform="translate(14, 76)">
      <circle cx="9" cy="9" r="9" fill="#000000" />
      <text x="9" y="13" class="flow-step-num">A</text>
      <text x="26" y="14" class="flow-text">Gateway Edge Ingress &amp; Auth</text>
      <text x="26" y="28" class="flow-sub">Client sends X-API-Key &amp; Idemp-Key</text>
      <text x="26" y="41" class="flow-sub">Nginx checks key &amp; forwards headers</text>
    </g>

    <g transform="translate(14, 130)">
      <circle cx="9" cy="9" r="9" fill="#000000" />
      <text x="9" y="13" class="flow-step-num">B</text>
      <text x="26" y="14" class="flow-text">Contract Validation &amp; Lock</text>
      <text x="26" y="28" class="flow-sub">Validates against openapi.yaml</text>
      <text x="26" y="41" class="flow-sub">SET idemp:&lt;key&gt; "IN_PROGRESS" NX</text>
    </g>

    <g transform="translate(14, 184)">
      <circle cx="9" cy="9" r="9" fill="#000000" />
      <text x="9" y="13" class="flow-step-num">C</text>
      <text x="26" y="14" class="flow-text">Commit Order &amp; Cache 201</text>
      <text x="26" y="28" class="flow-sub">Inserts order (ID 1) into ordersDb</text>
      <text x="26" y="41" class="flow-sub">Caches payload in Redis (24-hr TTL)</text>
    </g>

    <rect x="14" y="238" width="287" height="38" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="20" y="254" class="flow-sub" fill="#000000">Edge defense, contract verification, locking,</text>
    <text x="20" y="268" class="flow-sub" fill="#000000">and database commit succeed in sequence.</text>
  </g>

  <!-- CARD 2: NETWORK RETRY REPLAY -->
  <g transform="translate(372, 95)">
    <rect x="0" y="0" width="315" height="290" rx="8" fill="#d5e8d4" stroke="#000000" stroke-width="1.5" filter="url(#dropShadow)" />
    <rect x="0" y="0" width="315" height="36" rx="8" fill="#c3e6c3" stroke="#000000" stroke-width="1.5" />
    <text x="14" y="24" class="flow-title">2. Network Retry Replay (Hit)</text>

    <rect x="14" y="46" width="165" height="20" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="20" y="60" class="code-badge" fill="#15803d">HIT-IDEMPOTENT</text>

    <g transform="translate(14, 76)">
      <circle cx="9" cy="9" r="9" fill="#000000" />
      <text x="9" y="13" class="flow-step-num">A</text>
      <text x="26" y="14" class="flow-text">Client Retries Identical Key</text>
      <text x="26" y="28" class="flow-sub">Enters public Gateway (port 8080)</text>
      <text x="26" y="41" class="flow-sub">Nginx propagates Idempotency-Key</text>
    </g>

    <g transform="translate(14, 130)">
      <circle cx="9" cy="9" r="9" fill="#000000" />
      <text x="9" y="13" class="flow-step-num">B</text>
      <text x="26" y="14" class="flow-text">Redis Cache Interception</text>
      <text x="26" y="28" class="flow-sub">Middleware finds existing record</text>
      <text x="26" y="41" class="flow-sub">Retrieves cached { status: 201, ... }</text>
    </g>

    <g transform="translate(14, 184)">
      <circle cx="9" cy="9" r="9" fill="#000000" />
      <text x="9" y="13" class="flow-step-num">C</text>
      <text x="26" y="14" class="flow-text">Zero DB Mutation Replay</text>
      <text x="26" y="28" class="flow-sub">Replays cached 201 Created directly</text>
      <text x="26" y="41" class="flow-sub">Database order count remains 1</text>
    </g>

    <rect x="14" y="238" width="287" height="38" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="20" y="254" class="flow-sub" fill="#000000">Retrying through public gateway produces</text>
    <text x="20" y="268" class="flow-sub" fill="#000000">identical semantics without database calls.</text>
  </g>

  <!-- CARD 3: LAYERED DEFENSE -->
  <g transform="translate(710, 95)">
    <rect x="0" y="0" width="315" height="290" rx="8" fill="#fee2e2" stroke="#000000" stroke-width="1.5" filter="url(#dropShadow)" />
    <rect x="0" y="0" width="315" height="36" rx="8" fill="#fecaca" stroke="#000000" stroke-width="1.5" />
    <text x="14" y="24" class="flow-title">3. Multi-Layered Rejections</text>

    <rect x="14" y="46" width="160" height="20" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="20" y="60" class="code-badge" fill="#b91c1c">Earliest Boundary</text>

    <g transform="translate(14, 76)">
      <circle cx="9" cy="9" r="9" fill="#000000" />
      <text x="9" y="13" class="flow-step-num">A</text>
      <text x="26" y="14" class="flow-text">Gateway Edge Boundary</text>
      <text x="26" y="28" class="flow-sub">Missing API Key -&gt; 401 Unauthorized</text>
      <text x="26" y="41" class="flow-sub">Rate &gt; 5r/s -&gt; 429 Too Many Requests</text>
    </g>

    <g transform="translate(14, 130)">
      <circle cx="9" cy="9" r="9" fill="#000000" />
      <text x="9" y="13" class="flow-step-num">B</text>
      <text x="26" y="14" class="flow-text">Contract Schema Boundary</text>
      <text x="26" y="28" class="flow-sub">Missing Idempotency-Key -&gt; 400</text>
      <text x="26" y="41" class="flow-sub">Negative amount/quantity -&gt; 400</text>
    </g>

    <g transform="translate(14, 184)">
      <circle cx="9" cy="9" r="9" fill="#000000" />
      <text x="9" y="13" class="flow-step-num">C</text>
      <text x="26" y="14" class="flow-text">Redis Concurrency Boundary</text>
      <text x="26" y="28" class="flow-sub">Parallel duplicate in-flight -&gt; 409</text>
      <text x="26" y="41" class="flow-sub">Protects mutual exclusion across nodes</text>
    </g>

    <rect x="14" y="238" width="287" height="38" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="20" y="254" class="flow-sub" fill="#000000">Each layer rejects its failure mode at earliest</text>
    <text x="20" y="268" class="flow-sub" fill="#000000">boundary, protecting backend databases.</text>
  </g>

</svg>