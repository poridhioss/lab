    <text x="60" y="28" text-anchor="start" class="title-text">Unified API Service</text>
    <text x="60" y="48" text-anchor="start" class="subtitle-text">Node.js Service (:3000)</text>

    <g transform="translate(15, 75)">
      <rect width="250" height="166" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2" />
      <rect width="250" height="32" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">OpenAPI 3 Validation</text>
      <text x="12" y="56" class="body-text">• Validates against openapi.yaml</text>
      <text x="12" y="84" class="body-text">• Checks JSON schema types</text>
      <text x="12" y="112" class="body-text">• Rejects invalid payload (400)</text>
      <text x="12" y="140" class="subtitle-text">Contract-first enforcement</text>
    </g>

    <g transform="translate(15, 257)">
      <rect width="250" height="166" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2" />
      <rect width="250" height="32" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">Idempotency Controller</text>
      <text x="12" y="56" class="body-text">• Redis SETNX mutual exclusion</text>
      <text x="12" y="84" class="body-text">• Prevents parallel race condition</text>
      <text x="12" y="112" class="body-text">• Replays cached 201 on duplicate</text>
      <text x="12" y="140" class="subtitle-text">Emits X-Cache: HIT / MISS</text>
    </g>
  </g>

