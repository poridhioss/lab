    <text x="60" y="28" text-anchor="start" class="title-text">External Client</text>
    <text x="60" y="48" text-anchor="start" class="subtitle-text">End-to-End Automated Test</text>

    <g transform="translate(15, 75)">
      <rect width="250" height="166" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2" />
      <rect width="250" height="32" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">Idempotent POST Call</text>
      <text x="12" y="56" class="code-font" font-weight="bold">POST /api/v1/orders</text>
      <text x="12" y="84" class="body-text">X-API-Key: m6_secret_token</text>
      <text x="12" y="112" class="body-text">Idempotency-Key: tx_live_891</text>
      <text x="12" y="140" class="body-text">Payload: {&quot;item_id&quot;: 99, &quot;qty&quot;: 1}</text>
    </g>

    <g transform="translate(15, 257)">
      <rect width="250" height="166" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2" />
      <rect width="250" height="32" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">Automated Retry Test</text>
      <text x="12" y="56" class="body-text">• Simulates network disconnect</text>
      <text x="12" y="84" class="body-text">• Retries exact same key and body</text>
      <text x="12" y="112" class="body-text">• Asserts single DB execution</text>
      <text x="12" y="140" class="subtitle-text">Validates end-to-end guarantee</text>
    </g>
  </g>

