    <text x="60" y="28" text-anchor="start" class="title-text">Nginx API Gateway</text>
    <text x="60" y="48" text-anchor="start" class="subtitle-text">Port 80 Edge Gatekeeper</text>

    <g transform="translate(15, 75)">
      <rect width="250" height="166" rx="6" fill="#ffffff" stroke="#99f6e4" stroke-width="1.2" />
      <rect width="250" height="32" rx="6" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">Security &amp; Header Forwarding</text>
      <text x="12" y="56" class="body-text">• Validates X-API-Key header</text>
      <text x="12" y="84" class="body-text">• Enforces limit_req rate quota</text>
      <text x="12" y="112" class="body-text">• Preserves Idempotency-Key</text>
      <text x="12" y="140" class="body-text">• Passes X-Forwarded-For</text>
    </g>

    <g transform="translate(15, 257)">
      <rect width="250" height="166" rx="6" fill="#ffffff" stroke="#99f6e4" stroke-width="1.2" />
      <rect width="250" height="32" rx="6" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">Service Upstream Proxy</text>
      <text x="12" y="56" class="code-font" font-weight="bold">proxy_pass http:api_service:3000</text>
      <text x="12" y="84" class="body-text">• Strips unauthorized calls</text>
      <text x="12" y="112" class="body-text">• Isolates internal architecture</text>
      <text x="12" y="140" class="subtitle-text">Zero bypass of gateway layer</text>
    </g>
  </g>

