<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 360" width="1060" height="360">
  <defs>
    <filter id="dropShadow" x="-12%" y="-12%" width="135%" height="145%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <style>
      text {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        font-weight: bold;
        fill: #000000;
      }
      .banner-title { font-size: 19px; font-weight: bold; fill: #000000; }
      .banner-sub { font-size: 14px; font-weight: bold; fill: #333333; font-style: italic; }
      .card-title { font-size: 14px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .card-detail { font-size: 11px; font-weight: bold; fill: #222222; text-anchor: middle; }
      .card-sub { font-size: 13px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .badge-text { font-size: 10px; font-weight: bold; fill: #000000; text-anchor: middle; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />
  <rect x="15" y="15" width="1030" height="330" rx="10" fill="#fafafa" stroke="#000000" stroke-width="1.5" />

  <g transform="translate(35, 42)">
    <text x="0" y="0" class="banner-title">Lab 04: Complete Unified API Layer Architecture</text>
    <text x="0" y="22" class="banner-sub">Nginx Edge Gateway • OpenAPI 3 Validation • Redis Idempotency Mutex • Zero DB Replays</text>
  </g>

  <line x1="35" y1="76" x2="1025" y2="76" stroke="#cccccc" stroke-width="1.5" />

  <!-- NODE 1: Client -->
  <g transform="translate(30, 140)">
    <rect x="0" y="0" width="135" height="95" rx="8" fill="#dae8fc" stroke="#000000" stroke-width="1.5" filter="url(#dropShadow)" />
    <g transform="translate(49, 12)">
      <rect x="0" y="2" width="36" height="24" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <line x1="0" y1="20" x2="36" y2="20" stroke="#000000" stroke-width="1" />
      <polygon points="15,26 21,26 24,32 12,32" fill="#000000" />
      <line x1="8" y1="32" x2="28" y2="32" stroke="#000000" stroke-width="1.5" stroke-linecap="round" />
      <polyline points="6,9 10,12 6,15" fill="none" stroke="#1d4ed8" stroke-width="1.5" />
      <line x1="13" y1="15" x2="18" y2="15" stroke="#1d4ed8" stroke-width="1.5" />
    </g>
    <text x="67" y="66" class="card-title">HTTP Client</text>
    <text x="67" y="82" class="card-detail">cURL / Tests</text>
    <text x="67" y="118" class="card-sub">Consumer</text>
  </g>

  <path d="M 165 187 L 225 187" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)" />
  <rect x="170" y="168" width="50" height="20" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="195" y="183" class="badge-text">:8080</text>

  <!-- NODE 2: Poridhi LB -->
  <g transform="translate(230, 140)">
    <rect x="0" y="0" width="140" height="95" rx="8" fill="#e1d5e7" stroke="#000000" stroke-width="1.5" filter="url(#dropShadow)" />
    <g transform="translate(50, 12)">
      <circle cx="20" cy="17" r="15" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <line x1="12" y1="17" x2="28" y2="17" stroke="#000000" stroke-width="1.5" />
      <polygon points="28,17 24,14 24,20" fill="#000000" />
      <line x1="20" y1="9" x2="20" y2="25" stroke="#000000" stroke-width="1.5" />
      <polygon points="20,9 17,13 23,13" fill="#000000" />
    </g>
    <text x="70" y="66" class="card-title">Poridhi LB</text>
    <text x="70" y="82" class="card-detail">Host Port 8080</text>
    <text x="70" y="118" class="card-sub">Network Gateway</text>
  </g>

  <path d="M 370 187 L 425 187" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)" />
  <rect x="374" y="168" width="48" height="20" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="398" y="183" class="badge-text">Ingress</text>

  <!-- NODE 3: Nginx Gateway -->
  <g transform="translate(430, 140)">
    <rect x="0" y="0" width="150" height="95" rx="8" fill="#d5e8d4" stroke="#000000" stroke-width="1.5" filter="url(#dropShadow)" />
    <g transform="translate(56, 10)">
      <polygon points="20,2 37,9 37,25 20,36 3,25 3,9" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <path d="M 12 18 L 18 24 L 28 13" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="75" y="66" class="card-title">Nginx Gateway</text>
    <text x="75" y="82" class="card-detail">Auth &amp; Header Prop.</text>
    <text x="75" y="118" class="card-sub">Edge Defense</text>
  </g>

  <path d="M 580 187 L 635 187" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)" />
  <rect x="582" y="168" width="50" height="20" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="607" y="183" class="badge-text">Headers</text>

  <!-- NODE 4: Express API Service -->
  <g transform="translate(640, 140)">
    <rect x="0" y="0" width="155" height="95" rx="8" fill="#fff2cc" stroke="#000000" stroke-width="1.5" filter="url(#dropShadow)" />
    <g transform="translate(58, 10)">
      <polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <line x1="20" y1="20" x2="20" y2="38" stroke="#000000" stroke-width="1.2" />
      <line x1="20" y1="20" x2="36" y2="11" stroke="#000000" stroke-width="1.2" />
      <line x1="20" y1="20" x2="4" y2="11" stroke="#000000" stroke-width="1.2" />
    </g>
    <text x="77" y="66" class="card-title">API Service</text>
    <text x="77" y="82" class="card-detail">OpenAPI + Idemp.</text>
    <text x="77" y="118" class="card-sub">Application Runtime</text>
  </g>

  <!-- TREE BRANCHING -->
  <path d="M 795 187 L 830 187" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" />

  <!-- Upper Branch to Redis -->
  <path d="M 830 187 L 830 125 L 865 125" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)" />
  <rect x="795" y="103" width="70" height="20" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="830" y="117" class="badge-text">Lock/Cache</text>

  <!-- Lower Branch to DB -->
  <path d="M 830 187 L 830 245 L 865 245" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)" />
  <rect x="795" y="247" width="70" height="20" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="830" y="261" class="badge-text">Order Store</text>

  <!-- NODE 5: Redis 7 -->
  <g transform="translate(870, 80)">
    <rect x="0" y="0" width="155" height="90" rx="8" fill="#fee2e2" stroke="#000000" stroke-width="1.5" filter="url(#dropShadow)" />
    <g transform="translate(58, 8)">
      <polygon points="19,2 35,10 19,18 3,10" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <polygon points="19,10 35,18 19,26 3,18" fill="#fecaca" stroke="#000000" stroke-width="1.5" />
      <polygon points="19,18 35,26 19,34 3,26" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    </g>
    <text x="77" y="62" class="card-title">Redis 7</text>
    <text x="77" y="78" class="card-detail">Container (:6379)</text>
    <text x="77" y="108" class="card-sub">Mutex &amp; Caching</text>
  </g>

  <!-- NODE 6: DB -->
  <g transform="translate(870, 200)">
    <rect x="0" y="0" width="155" height="90" rx="8" fill="#f5f5f5" stroke="#000000" stroke-width="1.5" filter="url(#dropShadow)" />
    <g transform="translate(59, 8)">
      <ellipse cx="18" cy="8" rx="16" ry="6" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <path d="M 2 8 L 2 18 A 16 6 0 0 0 34 18 L 34 8" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <path d="M 2 18 L 2 28 A 16 6 0 0 0 34 28 L 34 18" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    </g>
    <text x="77" y="62" class="card-title">ordersDb[]</text>
    <text x="77" y="78" class="card-detail">Single Persistent DB</text>
    <text x="77" y="108" class="card-sub">Persistent Entity Store</text>
  </g>

</svg>