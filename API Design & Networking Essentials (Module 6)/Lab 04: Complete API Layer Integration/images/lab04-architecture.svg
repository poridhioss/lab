    <text x="60" y="28" text-anchor="start" class="title-text">Redis 7 Store</text>
    <text x="60" y="48" text-anchor="start" class="subtitle-text">Port 6379 (Internal Cache)</text>

    <g transform="translate(15, 75)">
      <rect width="250" height="166" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2" />
      <rect width="250" height="32" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">Distributed State Lock</text>
      <text x="12" y="56" class="code-font" font-weight="bold">Key: idemp:tx_live_891</text>
      <text x="12" y="84" class="body-text">• Status: IN_PROGRESS / DONE</text>
      <text x="12" y="112" class="body-text">• Atomic key reservation</text>
      <text x="12" y="140" class="subtitle-text">Prevents double-charging</text>
    </g>

    <g transform="translate(15, 257)">
      <rect width="250" height="166" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2" />
      <rect width="250" height="32" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">Cached Response Cache</text>
      <text x="12" y="56" class="body-text">• status: 201 Created</text>
      <text x="12" y="84" class="body-text">• body: {&quot;id&quot;: 891, ...}</text>
      <text x="12" y="112" class="body-text">• TTL: 86400s (24h retention)</text>
      <text x="12" y="140" class="subtitle-text">Instant zero-latency replay</text>
    </g>
  </g>
