<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 360" width="1060" height="360">
  <defs>
    <filter id="dropShadow" x="-12%" y="-12%" width="135%" height="145%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <style>
      text {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        font-weight: bold;
        fill: #000000;
      }
      .banner-title { font-size: 19px; font-weight: bold; fill: #000000; }
      .banner-sub { font-size: 14px; font-weight: bold; fill: #333333; font-style: italic; }
      .card-title { font-size: 15px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .card-detail { font-size: 12px; font-weight: bold; fill: #222222; text-anchor: middle; }
      .card-sub { font-size: 13.5px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .badge-text { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .callout-title { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .callout-body { font-size: 11px; font-weight: bold; fill: #b45309; text-anchor: middle; }
      .callout-sub { font-size: 10.5px; font-weight: bold; fill: #444444; text-anchor: middle; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />
  <rect x="15" y="15" width="1030" height="330" rx="10" fill="#fafafa" stroke="#000000" stroke-width="1.5" />

  <g transform="translate(35, 42)">
    <text x="0" y="0" class="banner-title">Lab 02: Idempotent Write Architecture</text>
    <text x="0" y="22" class="banner-sub">Node.js Express • Redis 7 Atomic Locks (SETNX) • Response Caching • Persistent Data Store</text>
  </g>

  <line x1="35" y1="76" x2="1025" y2="76" stroke="#cccccc" stroke-width="1.5" />

  <!-- NODE 1: Client -->
  <g transform="translate(35, 140)">
    <rect x="0" y="0" width="145" height="95" rx="8" fill="#dae8fc" stroke="#000000" stroke-width="1.5" filter="url(#dropShadow)" />
    <g transform="translate(54, 12)">
      <rect x="0" y="2" width="36" height="24" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <line x1="0" y1="20" x2="36" y2="20" stroke="#000000" stroke-width="1" />
      <polygon points="15,26 21,26 24,32 12,32" fill="#000000" />
      <line x1="8" y1="32" x2="28" y2="32" stroke="#000000" stroke-width="1.5" stroke-linecap="round" />
      <polyline points="6,9 10,12 6,15" fill="none" stroke="#1d4ed8" stroke-width="1.5" />
      <line x1="13" y1="15" x2="18" y2="15" stroke="#1d4ed8" stroke-width="1.5" />
    </g>
    <text x="72" y="66" class="card-title">HTTP Client</text>
    <text x="72" y="82" class="card-detail">cURL / Browser</text>
    <text x="72" y="118" class="card-sub">Client / Consumer</text>
  </g>

  <path d="M 180 187 L 245 187" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)" />
  <rect x="187" y="168" width="52" height="20" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="213" y="183" class="badge-text">:5000</text>

  <!-- NODE 2: Poridhi LB -->
  <g transform="translate(250, 140)">
    <rect x="0" y="0" width="150" height="95" rx="8" fill="#e1d5e7" stroke="#000000" stroke-width="1.5" filter="url(#dropShadow)" />
    <g transform="translate(55, 12)">
      <circle cx="20" cy="17" r="15" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <line x1="12" y1="17" x2="28" y2="17" stroke="#000000" stroke-width="1.5" />
      <polygon points="28,17 24,14 24,20" fill="#000000" />
      <line x1="20" y1="9" x2="20" y2="25" stroke="#000000" stroke-width="1.5" />
      <polygon points="20,9 17,13 23,13" fill="#000000" />
    </g>
    <text x="75" y="66" class="card-title">Poridhi LB</text>
    <text x="75" y="82" class="card-detail">Port 5000 Proxy</text>
    <text x="75" y="118" class="card-sub">Network Gateway</text>
  </g>

  <path d="M 400 187 L 465 187" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)" />
  <rect x="404" y="168" width="58" height="20" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="433" y="183" class="badge-text">Rev. Proxy</text>

  <!-- NODE 3: Express Server -->
  <g transform="translate(470, 140)">
    <rect x="0" y="0" width="165" height="95" rx="8" fill="#d5e8d4" stroke="#000000" stroke-width="1.5" filter="url(#dropShadow)" />
    <g transform="translate(62, 12)">
      <polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <line x1="20" y1="20" x2="20" y2="38" stroke="#000000" stroke-width="1.2" />
      <line x1="20" y1="20" x2="36" y2="11" stroke="#000000" stroke-width="1.2" />
      <line x1="20" y1="20" x2="4" y2="11" stroke="#000000" stroke-width="1.2" />
    </g>
    <text x="82" y="66" class="card-title">Express Server</text>
    <text x="82" y="82" class="card-detail">server.js (:5000)</text>
    <text x="82" y="118" class="card-sub">Idempotency Layer</text>
  </g>

  <!-- TREE BRANCHING -->
  <path d="M 635 187 L 675 187" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" />

  <!-- Upper Branch to Redis -->
  <path d="M 675 187 L 675 125 L 715 125" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)" />
  <rect x="630" y="103" width="90" height="20" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="675" y="117" class="badge-text">Lock &amp; Caching</text>

  <!-- Lower Branch to DB -->
  <path d="M 675 187 L 675 245 L 715 245" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)" />
  <rect x="635" y="247" width="80" height="20" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="675" y="261" class="badge-text">Commit on Miss</text>

  <!-- NODE 4: Redis 7 -->
  <g transform="translate(720, 80)">
    <rect x="0" y="0" width="165" height="90" rx="8" fill="#fff2cc" stroke="#000000" stroke-width="1.5" filter="url(#dropShadow)" />
    <g transform="translate(63, 8)">
      <polygon points="19,2 35,10 19,18 3,10" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <polygon points="19,10 35,18 19,26 3,18" fill="#fed7aa" stroke="#000000" stroke-width="1.5" />
      <polygon points="19,18 35,26 19,34 3,26" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    </g>
    <text x="82" y="62" class="card-title">Redis 7</text>
    <text x="82" y="78" class="card-detail">Container (:6379)</text>
    <text x="82" y="108" class="card-sub">Atomic Lock &amp; Cache</text>
  </g>

  <!-- NODE 5: DB -->
  <g transform="translate(720, 200)">
    <rect x="0" y="0" width="165" height="90" rx="8" fill="#f5f5f5" stroke="#000000" stroke-width="1.5" filter="url(#dropShadow)" />
    <g transform="translate(64, 8)">
      <ellipse cx="18" cy="8" rx="16" ry="6" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <path d="M 2 8 L 2 18 A 16 6 0 0 0 34 18 L 34 8" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <path d="M 2 18 L 2 28 A 16 6 0 0 0 34 28 L 34 18" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    </g>
    <text x="82" y="62" class="card-title">orders[] State</text>
    <text x="82" y="78" class="card-detail">Single Persistent DB</text>
    <text x="82" y="108" class="card-sub">Entity Data Store</text>
  </g>

  <!-- Callout -->
  <g transform="translate(905, 140)">
    <rect x="0" y="0" width="120" height="95" rx="6" fill="#f8fafc" stroke="#000000" stroke-width="1" stroke-dasharray="3,3" />
    <text x="60" y="26" class="callout-title">Redis Key Schema</text>
    <text x="60" y="47" class="callout-body">idemp:&lt;key&gt;</text>
    <text x="60" y="67" class="callout-sub">Lock: EX 60 NX</text>
    <text x="60" y="81" class="callout-sub">Cache: EX 86400</text>
  </g>
  <path d="M 885 125 L 895 125 L 895 187 L 905 187" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="3,3" />

</svg>