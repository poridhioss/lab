    <text x="60" y="48" text-anchor="start" class="subtitle-text">Retrying Caller / Web Client</text>

    <g transform="translate(15, 75)">
      <rect width="250" height="166" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2" />
      <rect width="250" height="32" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">Primary Write Request</text>
      <text x="12" y="56" class="code-font" font-weight="bold">POST /api/v1/orders</text>
      <text x="12" y="84" class="body-text">Idempotency-Key: pay_live_9a2f</text>
      <text x="12" y="112" class="body-text">Payload: {&quot;amount&quot;: 250}</text>
      <text x="12" y="140" class="subtitle-text">First write execution</text>
    </g>

    <g transform="translate(15, 257)">
      <rect width="250" height="166" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2" />
      <rect width="250" height="32" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">Network Retry Call</text>
      <text x="12" y="56" class="code-font" font-weight="bold">POST /api/v1/orders</text>
      <text x="12" y="84" class="body-text">Idempotency-Key: pay_live_9a2f</text>
      <text x="12" y="112" class="body-text">← 201 Created (Cached Replay)</text>
      <text x="12" y="140" class="subtitle-text">Zero duplicate order created</text>
    </g>
  </g>

