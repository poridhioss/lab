  <g transform="translate(1360, 20)">
    <rect width="280" height="480" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2" />
    <rect width="280" height="58" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
