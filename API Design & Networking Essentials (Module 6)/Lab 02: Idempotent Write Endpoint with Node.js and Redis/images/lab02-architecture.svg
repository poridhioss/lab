    </g>
    <text x="60" y="28" text-anchor="start" class="title-text">Redis 7 Store</text>
    <text x="60" y="48" text-anchor="start" class="subtitle-text">Key-Value State Cache</text>

    <g transform="translate(15, 75)">
      <rect width="250" height="166" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2" />
      <rect width="250" height="32" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">Atomic Lock Engine</text>
      <text x="12" y="56" class="code-font" font-weight="bold">SET key &apos;LOCK&apos; EX 60 NX</text>
      <text x="12" y="84" class="body-text">• Mutual exclusion on key</text>
      <text x="12" y="112" class="body-text">• Prevents duplicate race condition</text>
      <text x="12" y="140" class="body-text">• Status: IN_PROGRESS</text>
    </g>

    <g transform="translate(15, 257)">
      <rect width="250" height="166" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2" />
      <rect width="250" height="32" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">Cached Response Body</text>
      <text x="12" y="56" class="code-font" font-weight="bold">Key: idemp:pay_live_9a2f</text>
      <text x="12" y="84" class="body-text">• status: 201, headers: {...}</text>
      <text x="12" y="112" class="body-text">• body: {&quot;id&quot;: 501, &quot;status&quot;: ...}</text>
      <text x="12" y="140" class="subtitle-text">TTL: 86400s (24h retention)</text>
    </g>
  </g>

  <!-- Arrow: Execute Once -->
  <rect x="1224" y="198" width="110" height="30" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" />
