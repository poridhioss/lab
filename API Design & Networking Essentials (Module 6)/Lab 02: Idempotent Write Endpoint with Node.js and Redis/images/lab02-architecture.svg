    </g>
    <text x="60" y="28" text-anchor="start" class="title-text">Order Database</text>
    <text x="60" y="48" text-anchor="start" class="subtitle-text">Transactional Data Store</text>

    <g transform="translate(15, 75)">
      <rect width="250" height="166" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1.2" />
      <rect width="250" height="32" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">Payment Execution</text>
      <text x="12" y="56" class="body-text">• Deducts customer balance</text>
      <text x="12" y="84" class="body-text">• Inserts confirmed order row</text>
      <text x="12" y="112" class="body-text">• Executed strictly ONCE per key</text>
      <text x="12" y="140" class="subtitle-text">Zero double-billing anomaly</text>
    </g>

    <g transform="translate(15, 257)">
      <rect width="250" height="166" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1.2" />
      <rect width="250" height="32" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">Audit Ledger</text>
      <text x="12" y="56" class="body-text">• Maps Idempotency-Key to order</text>
      <text x="12" y="84" class="body-text">• Preserves transactional integrity</text>
      <text x="12" y="112" class="body-text">• Immutable order records</text>
      <text x="12" y="140" class="subtitle-text">Production safe guarantee</text>
    </g>
  </g>
