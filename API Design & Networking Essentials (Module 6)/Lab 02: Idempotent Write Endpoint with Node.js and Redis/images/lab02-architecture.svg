    <text x="60" y="28" text-anchor="start" class="title-text">Express API Server</text>
    <text x="60" y="48" text-anchor="start" class="subtitle-text">Idempotency Middleware</text>

    <g transform="translate(15, 75)">
      <rect width="250" height="166" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2" />
      <rect width="250" height="32" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">Idempotency Interceptor</text>
      <text x="12" y="56" class="body-text">• Checks Idempotency-Key header</text>
      <text x="12" y="84" class="body-text">• Queries Redis for key state</text>
      <text x="12" y="112" class="body-text">• SETNX acquires exclusive lock</text>
      <text x="12" y="140" class="body-text">• Concurrency: IN_PROGRESS</text>
    </g>

    <g transform="translate(15, 257)">
      <rect width="250" height="166" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2" />
      <rect width="250" height="32" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2" />
      <text x="12" y="22" class="section-heading">Response Cacher</text>
      <text x="12" y="56" class="body-text">• Intercepts res.send() output</text>
      <text x="12" y="84" class="body-text">• Caches status and body in Redis</text>
      <text x="12" y="112" class="body-text">• Replays cached body on retry</text>
      <text x="12" y="140" class="subtitle-text">Emits X-Cache: HIT / MISS</text>
    </g>
  </g>

  <!-- Arrow: 2. Lock (NX) -->
  <rect x="784" y="108" width="110" height="30" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2" />
  <text x="839" y="128" text-anchor="middle" class="arrow-label">2. Lock (NX)</text>
  <line x1="760" y1="150" x2="918" y2="150" stroke="#000000" stroke-width="1.8" marker-end="url(#arr-black)" />

