  <text x="841" y="308" text-anchor="middle" class="arrow-label">3. Cache Hit</text>
  <line x1="920" y1="330" x2="762" y2="330" stroke="#000000" stroke-width="1.8" stroke-dasharray="5,5" marker-end="url(#arr-black)" />

  <!-- Component: Redis 7 Store -->
  <g transform="translate(920, 20)">
