<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 420" width="1060" height="420">
  <defs>
    <filter id="dropShadow" x="-12%" y="-12%" width="135%" height="145%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <style>
      text {
        font-family: "Times New Roman", Times, "Liberation Serif", serif;
        font-weight: bold;
        fill: #000000;
      }
      .banner-title { font-size: 19px; font-weight: bold; fill: #000000; }
      .banner-sub { font-size: 14px; font-weight: bold; fill: #333333; font-style: italic; }
      .flow-title { font-size: 14px; font-weight: bold; fill: #000000; }
      .flow-step-num { font-size: 11px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .flow-text { font-size: 12.5px; font-weight: bold; fill: #111111; }
      .code-badge { font-family: "Courier New", Courier, monospace; font-size: 12px; font-weight: bold; }
      .flow-sub { font-size: 11px; font-weight: bold; fill: #444444; font-style: italic; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />
  <rect x="15" y="15" width="1030" height="390" rx="10" fill="#fafafa" stroke="#000000" stroke-width="1.5" />

  <g transform="translate(35, 42)">
    <text x="0" y="0" class="banner-title">Lab 02: Idempotency &amp; Concurrency Lifecycle Flow</text>
    <text x="0" y="22" class="banner-sub">End-to-End Tracing: Primary Mutation • Retry Replay • Concurrent Lock Contention</text>
  </g>

  <line x1="35" y1="76" x2="1025" y2="76" stroke="#cccccc" stroke-width="1.5" />

  <!-- CARD 1: FIRST MUTATION -->
  <g transform="translate(35, 95)">
    <rect x="0" y="0" width="315" height="290" rx="8" fill="#dae8fc" stroke="#000000" stroke-width="1.5" filter="url(#dropShadow)" />
    <rect x="0" y="0" width="315" height="36" rx="8" fill="#cce0ff" stroke="#000000" stroke-width="1.5" />
    <text x="14" y="24" class="flow-title">1. First Mutation (Cache Miss)</text>

    <rect x="14" y="46" width="135" height="20" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="20" y="60" class="code-badge" fill="#1d4ed8">X-Cache: MISS</text>

    <g transform="translate(14, 76)">
      <circle cx="9" cy="9" r="9" fill="#000000" />
      <text x="9" y="13" class="flow-step-num">A</text>
      <text x="26" y="14" class="flow-text">Acquires Atomic Lock</text>
      <text x="26" y="28" class="flow-sub">SET idemp:&lt;key&gt; "IN_PROGRESS"</text>
      <text x="26" y="41" class="flow-sub">Options: EX 60 NX (Locks key)</text>
    </g>

    <g transform="translate(14, 130)">
      <circle cx="9" cy="9" r="9" fill="#000000" />
      <text x="9" y="13" class="flow-step-num">B</text>
      <text x="26" y="14" class="flow-text">Executes Mutation Logic</text>
      <text x="26" y="28" class="flow-sub">Simulates payment &amp; latency</text>
      <text x="26" y="41" class="flow-sub">Appends to orders[] (ID 1)</text>
    </g>

    <g transform="translate(14, 184)">
      <circle cx="9" cy="9" r="9" fill="#000000" />
      <text x="9" y="13" class="flow-step-num">C</text>
      <text x="26" y="14" class="flow-text">Caches &amp; Responds 201</text>
      <text x="26" y="28" class="flow-sub">Saves { status: 201, body } in Redis</text>
      <text x="26" y="41" class="flow-sub">Sets 24-hr TTL (EX 86400)</text>
    </g>

    <rect x="14" y="238" width="287" height="38" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="20" y="254" class="flow-sub" fill="#000000">Database mutation executes strictly once;</text>
    <text x="20" y="268" class="flow-sub" fill="#000000">response is saved to Redis for retries.</text>
  </g>

  <!-- CARD 2: RETRY REPLAY -->
  <g transform="translate(372, 95)">
    <rect x="0" y="0" width="315" height="290" rx="8" fill="#d5e8d4" stroke="#000000" stroke-width="1.5" filter="url(#dropShadow)" />
    <rect x="0" y="0" width="315" height="36" rx="8" fill="#c3e6c3" stroke="#000000" stroke-width="1.5" />
    <text x="14" y="24" class="flow-title">2. Retry Replay (Cache Hit)</text>

    <rect x="14" y="46" width="135" height="20" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="20" y="60" class="code-badge" fill="#15803d">X-Cache: HIT</text>

    <g transform="translate(14, 76)">
      <circle cx="9" cy="9" r="9" fill="#000000" />
      <text x="9" y="13" class="flow-step-num">A</text>
      <text x="26" y="14" class="flow-text">Client Retries Identical Key</text>
      <text x="26" y="28" class="flow-sub">Header: Idempotency-Key: ord_tx_1001</text>
      <text x="26" y="41" class="flow-sub">Due to mobile timeout or retry policy</text>
    </g>

    <g transform="translate(14, 130)">
      <circle cx="9" cy="9" r="9" fill="#000000" />
      <text x="9" y="13" class="flow-step-num">B</text>
      <text x="26" y="14" class="flow-text">Redis Cache Interception</text>
      <text x="26" y="28" class="flow-sub">Middleware checks redis.get(key)</text>
      <text x="26" y="41" class="flow-sub">Finds completed { status: 201, ... }</text>
    </g>

    <g transform="translate(14, 184)">
      <circle cx="9" cy="9" r="9" fill="#000000" />
      <text x="9" y="13" class="flow-step-num">C</text>
      <text x="26" y="14" class="flow-text">Replays 201 Created</text>
      <text x="26" y="28" class="flow-sub">Sets Idempotency-Replay: true</text>
      <text x="26" y="41" class="flow-sub">Database order count remains 1</text>
    </g>

    <rect x="14" y="238" width="287" height="38" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="20" y="254" class="flow-sub" fill="#000000">Database and business logic are bypassed;</text>
    <text x="20" y="268" class="flow-sub" fill="#000000">zero double-charging or row duplicates.</text>
  </g>

  <!-- CARD 3: CONCURRENCY CONFLICT -->
  <g transform="translate(710, 95)">
    <rect x="0" y="0" width="315" height="290" rx="8" fill="#fee2e2" stroke="#000000" stroke-width="1.5" filter="url(#dropShadow)" />
    <rect x="0" y="0" width="315" height="36" rx="8" fill="#fecaca" stroke="#000000" stroke-width="1.5" />
    <text x="14" y="24" class="flow-title">3. Concurrency Conflict (409)</text>

    <rect x="14" y="46" width="160" height="20" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="20" y="60" class="code-badge" fill="#b91c1c">Mutual Exclusion</text>

    <g transform="translate(14, 76)">
      <circle cx="9" cy="9" r="9" fill="#000000" />
      <text x="9" y="13" class="flow-step-num">A</text>
      <text x="26" y="14" class="flow-text">Parallel Calls with Same Key</text>
      <text x="26" y="28" class="flow-sub">Two requests hit at same millisecond</text>
      <text x="26" y="41" class="flow-sub">Both contend for identical key</text>
    </g>

    <g transform="translate(14, 130)">
      <circle cx="9" cy="9" r="9" fill="#000000" />
      <text x="9" y="13" class="flow-step-num">B</text>
      <text x="26" y="14" class="flow-text">Atomic SETNX Winner</text>
      <text x="26" y="28" class="flow-sub">Request 1 wins atomic lock</text>
      <text x="26" y="41" class="flow-sub">Request 2 detects IN_PROGRESS</text>
    </g>

    <g transform="translate(14, 184)">
      <circle cx="9" cy="9" r="9" fill="#000000" />
      <text x="9" y="13" class="flow-step-num">C</text>
      <text x="26" y="14" class="flow-text">Immediate 409 Rejection</text>
      <text x="26" y="28" class="flow-sub">Returns 409 Conflict</text>
      <text x="26" y="41" class="flow-sub">detail: Mutation In Progress</text>
    </g>

    <rect x="14" y="238" width="287" height="38" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="20" y="254" class="flow-sub" fill="#000000">Redis atomic operations guarantee mutual</text>
    <text x="20" y="268" class="flow-sub" fill="#000000">exclusion across multi-process workers.</text>
  </g>

</svg>